<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F1E4">
<title>New video — Ayah Frame Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Manrope:wght@400;500;600;700;800&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>

  :root{
    --bg:#F6F1E4;
    --surface:#FFFDF6;
    --surface-2:#ECE3CC;
    --ink:#14183A;
    --ink-mute:#6C7094;
    --gold:#AD8226;
    --gold-soft:#C9973A;
    --line:rgba(20,24,58,.14);
    --line-soft:rgba(20,24,58,.07);
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; }
  body{
    background:
      radial-gradient(120% 45% at 50% -8%, rgba(173,130,38,.09), transparent 60%),
      var(--bg);
    color:var(--ink);
    font-family:'Manrope', sans-serif;
    min-height:100dvh;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:none;
  }
  button, a, input{ font-family:inherit; }

  .screen{
    min-height:100dvh;
    display:flex; flex-direction:column;
    max-width:480px; margin:0 auto;
    padding-top:env(safe-area-inset-top,0px);
  }

  /* ---------- topbar ---------- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 14px 10px;
  }
  .icon-btn{
    width:38px; height:38px; border-radius:12px;
    background:var(--surface); border:1px solid var(--line);
    box-shadow:0 2px 6px rgba(20,24,58,.06);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
    cursor:pointer;
  }
  .icon-btn svg{ width:16px; height:16px; }
  .icon-btn:active{ transform:scale(.94); }
  .topbar-title{ font-family:'Fraunces', serif; font-weight:600; font-size:15.5px; }
  .topbar-spacer{ width:38px; }

  /* ---------- scroll body ---------- */
  .body{ flex:1; overflow-y:auto; padding:6px 20px 26px; }

  .section{ margin-top:26px; }
  .section:first-child{ margin-top:6px; }
  .section-label{
    font-size:10.5px; font-weight:800; letter-spacing:1.2px; text-transform:uppercase;
    color:var(--ink-mute); margin-bottom:10px; padding:0 2px;
  }

  /* ---------- selector button (surah / reciter) ---------- */
  .select-btn{
    width:100%; display:flex; align-items:center; gap:12px;
    height:58px; padding:0 14px; border-radius:16px;
    background:var(--surface); border:1px solid var(--line);
    box-shadow:0 2px 6px rgba(20,24,58,.05);
    cursor:pointer; text-align:left;
  }
  .select-btn:active{ transform:scale(.99); }
  .select-glyph{
    width:36px; height:36px; border-radius:11px; flex-shrink:0;
    background:linear-gradient(160deg, var(--gold-soft), var(--gold));
    display:flex; align-items:center; justify-content:center;
    font-family:'Amiri', serif; font-weight:700; font-size:15px; color:#FFFDF6;
  }
  .select-text{ flex:1; min-width:0; }
  .select-title{ font-size:13.5px; font-weight:800; color:var(--ink); line-height:1.3; }
  .select-sub{ font-size:11px; color:var(--ink-mute); font-weight:600; margin-top:2px; }
  .select-btn svg.chev{ width:14px; height:14px; flex-shrink:0; }

  /* ---------- ayah range steppers ---------- */
  .range-card{
    margin-top:10px; padding:14px; border-radius:16px;
    background:var(--surface); border:1px solid var(--line);
    box-shadow:0 2px 6px rgba(20,24,58,.05);
    display:flex; align-items:center; gap:10px;
  }
  .stepper{ flex:1; }
  .stepper-label{ font-size:10px; font-weight:800; letter-spacing:.8px; text-transform:uppercase; color:var(--ink-mute); margin-bottom:8px; text-align:center; }
  .stepper-controls{ display:flex; align-items:center; justify-content:center; gap:2px; }
  .stepper-btn{
    width:34px; height:34px; border-radius:10px; flex-shrink:0;
    background:var(--surface-2); border:none; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:background .12s ease, transform .1s ease;
  }
  .stepper-btn svg{ width:13px; height:13px; }
  .stepper-btn:active{ transform:scale(.92); background:var(--line); }
  .stepper-btn:disabled{ opacity:.35; }
  .stepper-value{
    width:54px; text-align:center; font-size:16px; font-weight:800; font-variant-numeric:tabular-nums;
    border:none; background:transparent; color:var(--ink); padding:0; -moz-appearance:textfield;
  }
  .stepper-value:focus{ outline:none; }
  .stepper-value::-webkit-outer-spin-button,
  .stepper-value::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
  .range-divider{ width:14px; height:1px; background:var(--line); flex-shrink:0; margin-top:18px; }

  .verse-count-hint{
    text-align:center; font-size:11px; color:var(--ink-mute); margin-top:9px; font-weight:600;
  }

  /* ---------- selected verse preview ---------- */
  .verse-card{
    margin-top:14px; padding:16px; border-radius:16px;
    background:var(--surface); border:1px solid var(--line);
    box-shadow:0 2px 6px rgba(20,24,58,.05);
  }
  .verse-card-head{ display:flex; align-items:center; justify-content:space-between; }
  .verse-card-label{ font-size:10px; font-weight:800; letter-spacing:.8px; text-transform:uppercase; color:var(--ink-mute); }
  .verse-nav{ display:flex; gap:6px; flex-shrink:0; }
  .verse-nav-btn{
    width:24px; height:24px; border-radius:8px; flex-shrink:0;
    background:var(--surface-2); border:none; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:background .12s ease, transform .1s ease;
  }
  .verse-nav-btn svg{ width:11px; height:11px; }
  .verse-nav-btn:active{ transform:scale(.9); background:var(--line); }
  .verse-nav-btn:disabled{ opacity:.35; cursor:default; }
  .verse-ar{
    font-family:'Amiri', serif; font-weight:700; direction:rtl;
    font-size:19px; line-height:1.8; color:var(--ink); margin-top:10px;
  }
  .verse-en{
    font-size:11.5px; font-style:italic; color:var(--ink-mute); margin-top:6px; line-height:1.5;
  }

  /* ---------- orientation toggle ---------- */
  .segmented{ display:flex; background:var(--surface-2); border-radius:12px; padding:3px; gap:2px; }
  .segmented button{
    flex:1; border:none; background:none; cursor:pointer; padding:11px 4px; border-radius:9px;
    font-size:12.5px; font-weight:800; color:var(--ink-mute); white-space:nowrap;
    transition:background .15s ease, color .15s ease;
  }
  .segmented button.active{ background:var(--surface); color:var(--ink); box-shadow:0 2px 5px rgba(20,24,58,.08); }
  .segmented button:active{ transform:scale(.97); }

  /* ---------- theme row ---------- */
  .opt-row{
    display:flex; gap:10px; overflow-x:auto; padding:2px 2px 6px; scrollbar-width:none;
  }
  .opt-row::-webkit-scrollbar{ display:none; }

  .theme-card{
    flex-shrink:0; width:70px; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:7px;
  }
  .theme-swatch{
    width:70px; height:104px; border-radius:13px;
    border:1.5px solid var(--line); position:relative; overflow:hidden;
    display:flex; align-items:center; justify-content:center;
    transition:border-color .12s ease, transform .12s ease;
  }
  .theme-card.selected .theme-swatch{ border-color:var(--ink); transform:scale(.97); }
  .theme-swatch::after{
    content:""; position:absolute; inset:5px; border:1px solid rgba(255,255,255,.35); border-radius:9px;
    pointer-events:none;
  }
  .theme-swatch .glyph{ font-family:'Amiri', serif; font-weight:700; font-size:13px; }
  .theme-check{
    position:absolute; top:6px; right:6px; width:17px; height:17px; border-radius:50%;
    background:var(--ink); display:none; align-items:center; justify-content:center;
  }
  .theme-card.selected .theme-check{ display:flex; }
  .theme-check svg{ width:8px; height:8px; }
  .theme-name{ font-size:10px; font-weight:700; color:var(--ink-mute); text-align:center; line-height:1.25; }
  .theme-card.selected .theme-name{ color:var(--ink); }

  .theme-delete{
    position:absolute; top:6px; left:6px; width:17px; height:17px; border-radius:50%;
    background:rgba(20,24,58,.55); border:none; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .theme-delete svg{ width:8px; height:8px; }
  .theme-delete:active{ transform:scale(.9); }

  .theme-add{
    flex-shrink:0; width:70px; display:flex; flex-direction:column; align-items:center; gap:7px;
    cursor:pointer; border:none; background:none; padding:0;
  }
  .theme-add-swatch{
    width:70px; height:104px; border-radius:13px;
    border:1.5px dashed var(--line); background:transparent;
    display:flex; align-items:center; justify-content:center;
    transition:border-color .12s ease, background .12s ease;
  }
  .theme-add.is-edit .theme-add-swatch{
    border-style:solid; background:var(--surface-2); border-color:var(--line);
  }
  .theme-add.is-custom .theme-add-swatch{ border-color:var(--ink); }
  .theme-add:active .theme-add-swatch{ transform:scale(.96); }
  .theme-add-swatch svg{ width:18px; height:18px; }
  .theme-add-label{ font-size:10px; font-weight:700; color:var(--ink-mute); text-align:center; line-height:1.25; }
  .theme-add.is-custom .theme-add-label{ color:var(--ink); }

  /* ---------- sticky footer CTA ---------- */
  .footbar{
    padding:14px 20px calc(env(safe-area-inset-bottom,0px) + 16px);
    background:linear-gradient(180deg, rgba(246,241,228,0), var(--bg) 30%);
    border-top:1px solid var(--line-soft);
  }
  .continue-btn{
    width:100%; height:54px; border-radius:16px; border:none; cursor:pointer;
    background:var(--ink); color:#F6F1E4; font-weight:800; font-size:14.5px;
    display:flex; align-items:center; justify-content:center; gap:8px;
    box-shadow:0 16px 28px -16px rgba(20,24,58,.45);
    transition:transform .12s ease, opacity .12s ease;
  }
  .continue-btn:active{ transform:scale(.97); }
  .continue-btn:disabled{ opacity:.4; cursor:not-allowed; box-shadow:none; }
  .continue-btn:disabled:active{ transform:none; }
  .continue-btn svg{ width:14px; height:14px; }
  .continue-hint{ text-align:center; font-size:10.5px; color:var(--ink-mute); margin-top:9px; }

  /* ---------- bottom sheet ---------- */
  .sheet-backdrop{
    position:fixed; inset:0; background:rgba(20,24,58,.42);
    opacity:0; pointer-events:none; transition:opacity .2s ease;
    z-index:40;
  }
  .sheet-backdrop.open{ opacity:1; pointer-events:auto; }

  .sheet{
    position:fixed; left:0; right:0; bottom:0; z-index:41;
    max-width:480px; margin:0 auto;
    background:var(--bg);
    border-radius:22px 22px 0 0;
    border:1px solid var(--line);
    border-bottom:none;
    box-shadow:0 -18px 40px -20px rgba(20,24,58,.35);
    max-height:78vh;
    display:flex; flex-direction:column;
    transform:translateY(100%);
    transition:transform .28s cubic-bezier(.32,.72,0,1);
  }
  .sheet.open{ transform:translateY(0); }

  .sheet-handle{ display:flex; justify-content:center; padding:10px 0 4px; flex-shrink:0; }
  .sheet-handle span{ width:34px; height:4px; border-radius:100px; background:var(--line); }

  .sheet-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:6px 18px 12px; flex-shrink:0;
    border-bottom:1px solid var(--line-soft);
  }
  .sheet-title{ font-family:'Fraunces', serif; font-weight:600; font-size:16px; }
  .sheet-close{
    width:30px; height:30px; border-radius:50%; border:none; background:var(--surface-2);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .sheet-close svg{ width:12px; height:12px; }

  .sheet-search-wrap{ padding:10px 18px 4px; flex-shrink:0; }
  .sheet-search{
    width:100%; height:40px; border-radius:12px; border:1px solid var(--line-soft);
    background:var(--surface-2); padding:0 14px; font-size:12.5px; font-weight:600;
    color:var(--ink); outline:none;
  }
  .sheet-search::placeholder{ color:var(--ink-mute); font-weight:600; }

  .sheet-list{ flex:1; overflow-y:auto; padding:6px 10px; -webkit-overflow-scrolling:touch; }

  .sheet-row{
    display:flex; align-items:center; gap:12px; width:100%;
    padding:11px 10px; border-radius:14px; border:none; background:none; cursor:pointer;
    text-align:left;
  }
  .sheet-row:active{ background:var(--surface-2); }
  .sheet-row.picked{ background:#FBF4E2; }
  .sheet-row-num{
    width:28px; height:28px; border-radius:9px; flex-shrink:0;
    background:var(--surface-2); display:flex; align-items:center; justify-content:center;
    font-size:11px; font-weight:800; color:var(--ink-mute);
  }
  .sheet-row.picked .sheet-row-num{ background:var(--gold); color:#FFFDF6; }
  .sheet-row-text{ flex:1; min-width:0; }
  .sheet-row-title{ font-size:13px; font-weight:800; }
  .sheet-row-sub{ font-size:10.5px; color:var(--ink-mute); font-weight:600; margin-top:1px; }
  .sheet-row-ar{ font-family:'Amiri', serif; font-size:15px; color:var(--ink); flex-shrink:0; }
  .sheet-row-avatar{
    width:32px; height:32px; border-radius:50%; flex-shrink:0;
    background:linear-gradient(160deg, var(--gold-soft), var(--gold));
    display:flex; align-items:center; justify-content:center;
    font-family:'Fraunces', serif; font-weight:700; font-size:13px; color:#FFFDF6;
  }
  .sheet-row-check{ width:18px; height:18px; border-radius:50%; background:var(--gold); flex-shrink:0; display:none; align-items:center; justify-content:center; }
  .sheet-row.picked .sheet-row-check{ display:flex; }
  .sheet-row-check svg{ width:9px; height:9px; }

  .sheet-foot{
    padding:12px 18px calc(env(safe-area-inset-bottom,0px) + 14px);
    border-top:1px solid var(--line-soft); flex-shrink:0;
    background:var(--bg);
  }
  .sheet-select-btn{
    width:100%; height:50px; border-radius:15px; border:none; cursor:pointer;
    background:var(--ink); color:#F6F1E4; font-weight:800; font-size:13.5px;
  }
  .sheet-select-btn:active{ transform:scale(.98); }
  .sheet-manage-btn{
    width:100%; height:46px; border-radius:15px; margin-top:9px;
    border:1.5px solid var(--line-soft); cursor:pointer; background:transparent;
    color:var(--ink); font-weight:800; font-size:12.5px;
  }
  .sheet-manage-btn:active{ transform:scale(.98); }

  /* ---------- confirmation dialog ---------- */
  .confirm-backdrop{
    position:fixed; inset:0; background:rgba(20,24,58,.42);
    opacity:0; pointer-events:none; transition:opacity .18s ease;
    z-index:60;
  }
  .confirm-backdrop.open{ opacity:1; pointer-events:auto; }

  .confirm-modal{
    position:fixed; left:50%; top:50%; z-index:61;
    width:calc(100% - 64px); max-width:320px;
    background:var(--bg); border:1px solid var(--line); border-radius:20px;
    padding:22px 20px 18px; box-shadow:0 24px 60px -20px rgba(20,24,58,.45);
    opacity:0; pointer-events:none;
    transform:translate(-50%,-50%) scale(.92);
    transition:opacity .18s ease, transform .18s cubic-bezier(.32,.72,0,1);
  }
  .confirm-modal.open{ opacity:1; pointer-events:auto; transform:translate(-50%,-50%) scale(1); }

  .confirm-title{ font-family:'Fraunces', serif; font-weight:600; font-size:16px; text-align:center; }
  .confirm-message{
    font-size:12.5px; color:var(--ink-mute); text-align:center; line-height:1.5;
    margin-top:7px;
  }
  .confirm-actions{ display:flex; gap:9px; margin-top:18px; }
  .confirm-btn{
    flex:1; height:44px; border-radius:13px; border:none; cursor:pointer;
    font-weight:800; font-size:12.5px;
  }
  .confirm-btn:active{ transform:scale(.97); }
  .confirm-cancel{ background:var(--surface-2); color:var(--ink); }
  .confirm-danger{ background:#B4453A; color:#FFFDF6; }

</style>
</head>
<body>

<div class="screen">

  <div class="topbar">
    <button class="icon-btn" aria-label="Back" onclick="location.href='/'">
      <svg viewBox="0 0 24 24" fill="none" stroke="#14183A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="topbar-title">New video</div>
    <div class="topbar-spacer"></div>
  </div>

  <div class="body">

    <div class="section">
      <div class="section-label">Surah</div>
      <button class="select-btn" id="surahBtn">
        <div class="select-glyph" id="surahGlyph">ﷲ</div>
        <div class="select-text">
          <div class="select-title" id="surahTitle">Al-Fatihah</div>
          <div class="select-sub" id="surahSub">Surah 1 · 7 ayahs</div>
        </div>
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="#6C7094" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      </button>

      <div class="range-card">
        <div class="stepper">
          <div class="stepper-label">From ayah</div>
          <div class="stepper-controls">
            <button class="stepper-btn" id="fromMinus" aria-label="Decrease from ayah">
              <svg viewBox="0 0 24 24" fill="none" stroke="#14183A" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14"/></svg>
            </button>
            <input type="number" class="stepper-value" id="fromValue" value="1" inputmode="numeric" aria-label="From ayah number">
            <button class="stepper-btn" id="fromPlus" aria-label="Increase from ayah">
              <svg viewBox="0 0 24 24" fill="none" stroke="#14183A" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
            </button>
          </div>
        </div>
        <div class="range-divider"></div>
        <div class="stepper">
          <div class="stepper-label">To ayah</div>
          <div class="stepper-controls">
            <button class="stepper-btn" id="toMinus" aria-label="Decrease to ayah">
              <svg viewBox="0 0 24 24" fill="none" stroke="#14183A" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14"/></svg>
            </button>
            <input type="number" class="stepper-value" id="toValue" value="7" inputmode="numeric" aria-label="To ayah number">
            <button class="stepper-btn" id="toPlus" aria-label="Increase to ayah">
              <svg viewBox="0 0 24 24" fill="none" stroke="#14183A" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
            </button>
          </div>
        </div>
      </div>
      <div class="verse-count-hint" id="rangeHint">7 ayahs selected</div>

      <div class="verse-card">
        <div class="verse-card-head">
          <div class="verse-card-label" id="verseCardLabel">Preview</div>
          <div class="verse-nav">
            <button class="verse-nav-btn" id="previewPrev" aria-label="Preview previous ayah">
              <svg viewBox="0 0 24 24" fill="none" stroke="#14183A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
            </button>
            <button class="verse-nav-btn" id="previewNext" aria-label="Preview next ayah">
              <svg viewBox="0 0 24 24" fill="none" stroke="#14183A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
            </button>
          </div>
        </div>
        <div class="verse-ar" id="verseAr">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>
        <div class="verse-en" id="verseEn">Loading…</div>
      </div>
    </div>

    <div class="section">
      <div class="section-label">Reciter</div>
      <button class="select-btn" id="reciterBtn">
        <div class="select-glyph" id="reciterGlyph">M</div>
        <div class="select-text">
          <div class="select-title" id="reciterTitle">Loading…</div>
          <div class="select-sub" id="reciterSub"></div>
        </div>
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="#6C7094" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      </button>
    </div>

    <div class="section">
      <div class="section-label">Translation</div>
      <button class="select-btn" id="translationBtn">
        <div class="select-glyph" id="translationGlyph">EN</div>
        <div class="select-text">
          <div class="select-title" id="translationTitle">Loading…</div>
          <div class="select-sub" id="translationSub"></div>
        </div>
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="#6C7094" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      </button>
    </div>

    <div class="section">
      <div class="section-label">Orientation</div>
      <div class="segmented" id="orientationSeg">
        <button class="active" data-value="vertical">Vertical</button>
        <button data-value="horizontal">Horizontal</button>
      </div>
    </div>

    <div class="section">
      <div class="section-label">Style</div>
      <div class="opt-row" id="themeRow">
        <div id="themeCards" style="display:contents"></div>
        <button class="theme-add" id="themeAddBtn">
          <div class="theme-add-swatch" id="themeAddSwatch">
            <svg id="themeAddIcon" viewBox="0 0 24 24" fill="none" stroke="#AD8226" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
          </div>
          <div class="theme-add-label" id="themeAddLabel">Add<br>theme</div>
        </button>
      </div>

      Continue to timing
      <svg viewBox="0 0 24 24" fill="none" stroke="#F6F1E4" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>

<script src="/quran-data.js"></script>
<script>
  // ============ DATA ============
  const surahs = window.SURAHS;
  let reciters = []; // [{key, name}], filled from /api/reciters

  // ============ SESSION (server-side video-creation project; see sessions-refactor-progress.md) ============
  let sessionId = new URLSearchParams(location.search).get('sessionId');

  async function ensureSession(){
    if (sessionId){
      const res = await fetch(`/api/sessions/${encodeURIComponent(sessionId)}`);
      if (res.ok){
        const session = await res.json();
        if (session.status !== 'complete') return session;
        // A completed session can't be edited -- shouldn't normally be
        // reachable from the UI, but fall through to starting a fresh one.
      }
      sessionId = null;
    }
    const created = await fetch('/api/sessions', { method: 'POST' }).then(r => r.json());
    sessionId = created.id;
    history.replaceState(null, '', `/new_video.html?sessionId=${encodeURIComponent(sessionId)}`);
    return created;
  }

  function saveSessionState(){
    if (!sessionId) return;
    fetch(`/api/sessions/${encodeURIComponent(sessionId)}`, {
      method: 'PUT', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        surah: state.surah.n,
        ayahStart: state.from,
        ayahEnd: state.to,
        reciter: state.reciter ? state.reciter.key : null,
        translation: state.translation,
        orientation: state.orientation,
        theme: state.themeObject,
        themeName: state.themeLabel,
      }),
    }).catch(() => { /* best-effort; local state is still correct either way */ });
  }

  // ============ STATE ============
  let state = {
    surah: surahs[0],
    from: 1,
    to: 7,
    previewAyah: 1,   // which ayah the Preview card is currently showing; starts at "From" but can be browsed independently
    reciter: null,
    translation: 'en.sahih',  // edition identifier (see /api/translations); this default always exists so the Preview card and a fresh session work before the picker's list has loaded
    orientation: 'vertical',  // 'vertical' | 'horizontal' -- actual export orientation, sent through to /api/generate on the timing screen
    themeKey: null,     // 'preset:<name>' or 'saved:<id>', or null (= default look)
    themeLabel: null,   // display name string, or null
    themeObject: null,  // resolved theme.py-shaped object, or null
  };

  // ============ SURAH SELECT ============
  const surahBtn = document.getElementById('surahBtn');
  const surahTitle = document.getElementById('surahTitle');
  const surahSub = document.getElementById('surahSub');
  const surahGlyph = document.getElementById('surahGlyph');

  function updatePreviewNav(){
    document.getElementById('previewPrev').disabled = state.previewAyah <= 1;
    document.getElementById('previewNext').disabled = state.previewAyah >= state.surah.ayahs;
    document.getElementById('verseCardLabel').textContent = `Preview · Ayah ${state.previewAyah}`;
  }

  async function loadPreview(){
    const verseEn = document.getElementById('verseEn');
    const verseAr = document.getElementById('verseAr');
    updatePreviewNav();
    verseEn.textContent = 'Loading…';
    try {
      const res = await fetch(`/api/timing/text?surah=${state.surah.n}&ayah=${state.previewAyah}&translation=${encodeURIComponent(state.translation)}`);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'fetch failed');
      // Show exactly what the generated video's frame will render for this ayah --
      // the Basmala is split off (data.basmalaArabic) but the generator never plays
      // or shows it as part of ayah 1's scene (see video_build.py), since the
      // per-ayah recitation audio for most reciters doesn't include it spoken. Adding
      // it back here would make the preview lie about what actually gets produced.
      verseAr.textContent = data.arabic;
      verseEn.textContent = data.translation;
    } catch (e) {
      verseAr.textContent = state.surah.ar;
      verseEn.textContent = `Ayah ${state.previewAyah} of ${state.surah.en}`;
    }
  }

  document.getElementById('previewPrev').addEventListener('click', () => {
    if (state.previewAyah > 1){ state.previewAyah--; loadPreview(); }
  });
  document.getElementById('previewNext').addEventListener('click', () => {
    if (state.previewAyah < state.surah.ayahs){ state.previewAyah++; loadPreview(); }
  });

  function updateSurahDisplay(){
    surahTitle.textContent = state.surah.en;
    surahSub.textContent = `Surah ${state.surah.n} · ${state.surah.ayahs} ayahs`;
    surahGlyph.textContent = state.surah.ar[0];
    state.previewAyah = state.from;
    loadPreview();
  }

  function renderSurahSheetList(pickedNum, query){
    const listEl = document.getElementById('surahSheetList');
    const q = (query || '').trim().toLowerCase();
    const filtered = q
      ? surahs.filter(s => s.en.toLowerCase().includes(q) || s.ar.includes(q) || String(s.n) === q)
      : surahs;
    if (!filtered.length){
      listEl.innerHTML = `<div class="sheet-row-sub" style="padding:14px 10px;">No surahs found</div>`;
      return;
    }
    listEl.innerHTML = filtered.map(s => `
      <button class="sheet-row ${s.n === pickedNum ? 'picked' : ''}" data-n="${s.n}">
        <div class="sheet-row-num">${s.n}</div>
        <div class="sheet-row-text">
          <div class="sheet-row-title">${s.en}</div>
          <div class="sheet-row-sub">${s.ayahs} ayahs</div>
        </div>
        <div class="sheet-row-ar">${s.ar}</div>
        <div class="sheet-row-check"><svg viewBox="0 0 24 24" fill="none" stroke="#FFFDF6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></div>
      </button>
    `).join('');
  }

  let surahPick = state.surah.n;
  const surahSearchInput = document.getElementById('surahSearchInput');
  surahBtn.addEventListener('click', () => {
    surahPick = state.surah.n;
    surahSearchInput.value = '';
    renderSurahSheetList(surahPick);
    openSheet('surah');
  });
  surahSearchInput.addEventListener('input', () => {
    renderSurahSheetList(surahPick, surahSearchInput.value);
  });
  document.getElementById('surahSheetList').addEventListener('click', async (e) => {
    const row = e.target.closest('.sheet-row');
    if (!row) return;
    surahPick = Number(row.dataset.n);
    state.surah = surahs.find(s => s.n === surahPick);
    state.from = 1;
    state.to = state.surah.ayahs;
    updateSurahDisplay();
    updateRangeDisplay();
    closeSheet('surah');
    saveSessionState();

    // The reciter was verified gapless for the PREVIOUS surah -- a new
    // surah has its own continuous-recording download and timing data, so
    // that verification doesn't carry over automatically. Re-check silently
    // and only bother the user if it actually broke.
    if (state.reciter){
      const result = await verifyReciterGapless(state.reciter.key, state.surah.n);
      if (!result.gapless){
        await showAlert({
          title: "Reciter not supported for this surah",
          message: (result.reason || "This reciter doesn't have a gapless recording for this surah.")
            + " Please pick a different reciter.",
        });
        state.reciter = null;
        updateReciterDisplay();
        updateContinueBtn();
        saveSessionState();
      }
    }
  });

  // ============ AYAH RANGE STEPPERS + DIRECT INPUT ============
  const fromValue = document.getElementById('fromValue');
  const toValue = document.getElementById('toValue');
  const rangeHint = document.getElementById('rangeHint');

  function updateRangeDisplay(){
    fromValue.value = state.from;
    toValue.value = state.to;
    fromValue.min = 1; fromValue.max = state.to;
    toValue.min = state.from; toValue.max = state.surah.ayahs;
    document.getElementById('fromMinus').disabled = state.from <= 1;
    document.getElementById('fromPlus').disabled = state.from >= state.to;
    document.getElementById('toMinus').disabled = state.to <= state.from;
    document.getElementById('toPlus').disabled = state.to >= state.surah.ayahs;
    const count = state.to - state.from + 1;
    rangeHint.textContent = `${count} ayah${count === 1 ? '' : 's'} selected`;
  }

  document.getElementById('fromMinus').addEventListener('click', () => { if (state.from > 1){ state.from--; state.previewAyah = state.from; updateRangeDisplay(); loadPreview(); saveSessionState(); } });
  document.getElementById('fromPlus').addEventListener('click', () => { if (state.from < state.to){ state.from++; state.previewAyah = state.from; updateRangeDisplay(); loadPreview(); saveSessionState(); } });
  document.getElementById('toMinus').addEventListener('click', () => { if (state.to > state.from){ state.to--; updateRangeDisplay(); saveSessionState(); } });
  document.getElementById('toPlus').addEventListener('click', () => { if (state.to < state.surah.ayahs){ state.to++; updateRangeDisplay(); saveSessionState(); } });

  document.getElementById('orientationSeg').addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    state.orientation = btn.dataset.value;
    document.querySelectorAll('#orientationSeg button').forEach(b => b.classList.toggle('active', b === btn));
    saveSessionState();
  });

  function commitFromValue(){
    let n = parseInt(fromValue.value, 10);
    if (isNaN(n)) n = state.from;
    n = Math.min(Math.max(n, 1), state.surah.ayahs);
    state.from = n;
    if (state.to < state.from) state.to = state.from;
    state.previewAyah = state.from;
    updateRangeDisplay();
    loadPreview();
    saveSessionState();
  }

  function commitToValue(){
    let n = parseInt(toValue.value, 10);
    if (isNaN(n)) n = state.to;
    n = Math.min(Math.max(n, 1), state.surah.ayahs);
    state.to = n;
    if (state.from > state.to) state.from = state.to;
    updateRangeDisplay();
    saveSessionState();
  }

  fromValue.addEventListener('focus', () => fromValue.select());
  toValue.addEventListener('focus', () => toValue.select());
  fromValue.addEventListener('change', commitFromValue);
  toValue.addEventListener('change', commitToValue);
  fromValue.addEventListener('keydown', (e) => { if (e.key === 'Enter') fromValue.blur(); });
  toValue.addEventListener('keydown', (e) => { if (e.key === 'Enter') toValue.blur(); });

  // ============ RECITER SELECT ============
  const reciterBtn = document.getElementById('reciterBtn');
  let gaplessReciterKeys = new Set(); // filled from /api/reciters/gapless -- reciters with a continuous-recording source CONFIGURED at all; only used to pick a sensible default, never to gate a selection (see verifyReciterGapless)
  let reciterVerifying = false;

  // The authoritative check: actually asks the backend to download/cross-check
  // THIS reciter's continuous recording for THIS surah (see
  // /api/reciters/verify-gapless in app.py) rather than trusting the static
  // candidate list above -- a reciter can be a structural candidate and still
  // fail for a given surah (network hiccup, mismatched timing data).
  async function verifyReciterGapless(reciterKey, surahNumber){
    try {
      const res = await fetch(`/api/reciters/verify-gapless?reciter=${encodeURIComponent(reciterKey)}&surah=${surahNumber}`);
      const data = await res.json();
      if (!res.ok) return { gapless: false, reason: data.error || "Couldn't verify this reciter." };
      return data;
    } catch (e) {
      return { gapless: false, reason: "Couldn't reach the server to verify this reciter." };
    }
  }

  function updateReciterDisplay(){
    if (!state.reciter){
      document.getElementById('reciterTitle').textContent = 'Select a reciter';
      document.getElementById('reciterSub').textContent = '';
      document.getElementById('reciterGlyph').textContent = '?';
      return;
    }
    document.getElementById('reciterTitle').textContent = state.reciter.name;
    document.getElementById('reciterSub').textContent = 'Recitation';
    document.getElementById('reciterGlyph').textContent = state.reciter.name[0];
  }

  function renderReciterSheetList(pickedKey, query){
    const listEl = document.getElementById('reciterSheetList');
    const q = (query || '').trim().toLowerCase();
    const filtered = q ? reciters.filter(r => r.name.toLowerCase().includes(q)) : reciters;
    if (!filtered.length){
      listEl.innerHTML = `<div class="sheet-row-sub" style="padding:14px 10px;">No reciters found</div>`;
      return;
    }
    listEl.innerHTML = filtered.map(r => `
      <button class="sheet-row ${r.key === pickedKey ? 'picked' : ''}" data-key="${r.key}">
        <div class="sheet-row-avatar">${r.name[0]}</div>
        <div class="sheet-row-text">
          <div class="sheet-row-title">${r.name}</div>
        </div>
        <div class="sheet-row-check"><svg viewBox="0 0 24 24" fill="none" stroke="#FFFDF6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></div>
      </button>
    `).join('');
  }

  let reciterPick = null;
  const reciterSearchInput = document.getElementById('reciterSearchInput');
  reciterBtn.addEventListener('click', () => {
    reciterPick = state.reciter ? state.reciter.key : null;
    reciterSearchInput.value = '';
    renderReciterSheetList(reciterPick);
    openSheet('reciter');
  });
  reciterSearchInput.addEventListener('input', () => {
    renderReciterSheetList(reciterPick, reciterSearchInput.value);
  });
  document.getElementById('reciterSheetList').addEventListener('click', async (e) => {
    const row = e.target.closest('.sheet-row');
    if (!row || reciterVerifying) return;
    const key = row.dataset.key;
    const titleEl = row.querySelector('.sheet-row-title');
    const originalTitle = titleEl.textContent;

    reciterVerifying = true;
    titleEl.textContent = `${originalTitle} — checking…`;
    const result = await verifyReciterGapless(key, state.surah.n);
    titleEl.textContent = originalTitle;
    reciterVerifying = false;

    if (!result.gapless){
      await showAlert({
        title: "Reciter not supported",
        message: result.reason || "This reciter doesn't have a gapless recording for this surah. Please pick a different reciter.",
      });
      return;
    }
    reciterPick = key;
    state.reciter = reciters.find(r => r.key === reciterPick);
    updateReciterDisplay();
    updateContinueBtn();
    closeSheet('reciter');
    saveSessionState();
  });
  document.getElementById('manageCustomAudioBtn').addEventListener('click', () => {
    saveSessionState();
    window.location.href = `/custom_audio.html?sessionId=${encodeURIComponent(sessionId)}`;
  });

  // ============ TRANSLATION SELECT ============
  const translationBtn = document.getElementById('translationBtn');
  let translations = []; // [{identifier, language, name, englishName}], filled from /api/translations

  // ISO 639-1 language code -> a representative country flag emoji, used in
  // place of the old 2-letter language-code text in the translation glyph
  // and sheet-row avatars. Falls back to a globe for anything not mapped.
  const LANG_FLAGS = {
    ar:'🇸🇦', en:'🇬🇧', ur:'🇵🇰', fr:'🇫🇷', es:'🇪🇸', de:'🇩🇪', id:'🇮🇩', tr:'🇹🇷',
    ru:'🇷🇺', zh:'🇨🇳', bn:'🇧🇩', ml:'🇮🇳', ta:'🇮🇳', sw:'🇹🇿', fa:'🇮🇷', hi:'🇮🇳',
    it:'🇮🇹', pt:'🇵🇹', nl:'🇳🇱', ja:'🇯🇵', ko:'🇰🇷', th:'🇹🇭', vi:'🇻🇳', ha:'🇳🇬',
    so:'🇸🇴', bs:'🇧🇦', sq:'🇦🇱', az:'🇦🇿', uz:'🇺🇿', tg:'🇹🇯', ku:'🇮🇶', sd:'🇵🇰',
    ps:'🇦🇫', am:'🇪🇹', kn:'🇮🇳', te:'🇮🇳', mr:'🇮🇳', pl:'🇵🇱', sv:'🇸🇪', no:'🇳🇴',
    da:'🇩🇰', fi:'🇫🇮', cs:'🇨🇿', ro:'🇷🇴', hu:'🇭🇺', el:'🇬🇷', he:'🇮🇱', ms:'🇲🇾',
    fil:'🇵🇭', tl:'🇵🇭', si:'🇱🇰', my:'🇲🇲', km:'🇰🇭', ne:'🇳🇵', uk:'🇺🇦', bg:'🇧🇬',
    sr:'🇷🇸', hr:'🇭🇷', sk:'🇸🇰', sl:'🇸🇮', et:'🇪🇪', lv:'🇱🇻', lt:'🇱🇹',
  };
  function langToFlag(lang){
    return LANG_FLAGS[(lang || '').toLowerCase()] || '🌐';
  }

  function updateTranslationDisplay(){
    const entry = translations.find(t => t.identifier === state.translation);
    if (!entry){
      // List hasn't loaded yet (or this session's saved identifier isn't in
      // it) -- still show the raw identifier rather than a blank/misleading
      // label, since state.translation itself is always a real value.
      document.getElementById('translationTitle').textContent = state.translation;
      document.getElementById('translationSub').textContent = '';
      document.getElementById('translationGlyph').textContent = '🌐';
      return;
    }
    document.getElementById('translationTitle').textContent = entry.englishName;
    document.getElementById('translationSub').textContent = `${entry.name} · ${entry.language.toUpperCase()}`;
    document.getElementById('translationGlyph').textContent = langToFlag(entry.language);
  }

  function renderTranslationSheetList(pickedId, query){
    const listEl = document.getElementById('translationSheetList');
    const q = (query || '').trim().toLowerCase();
    const filtered = q
      ? translations.filter(t => t.englishName.toLowerCase().includes(q) || t.name.toLowerCase().includes(q) || t.language.toLowerCase().includes(q))
      : translations;
    if (!filtered.length){
      listEl.innerHTML = `<div class="sheet-row-sub" style="padding:14px 10px;">No translations found</div>`;
      return;
    }
    listEl.innerHTML = filtered.map(t => `
      <button class="sheet-row ${t.identifier === pickedId ? 'picked' : ''}" data-id="${t.identifier}">
        <div class="sheet-row-avatar">${langToFlag(t.language)}</div>
        <div class="sheet-row-text">
          <div class="sheet-row-title">${t.englishName}</div>
          <div class="sheet-row-sub">${t.name} · ${t.language.toUpperCase()}</div>
        </div>
        <div class="sheet-row-check"><svg viewBox="0 0 24 24" fill="none" stroke="#FFFDF6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></div>
      </button>
    `).join('');
  }

  let translationPick = null;
  const translationSearchInput = document.getElementById('translationSearchInput');
  translationBtn.addEventListener('click', () => {
    translationPick = state.translation;
    translationSearchInput.value = '';
    renderTranslationSheetList(translationPick);
    openSheet('translation');
  });
  translationSearchInput.addEventListener('input', () => {
    renderTranslationSheetList(translationPick, translationSearchInput.value);
  });
  document.getElementById('translationSheetList').addEventListener('click', (e) => {
    const row = e.target.closest('.sheet-row');
    if (!row) return;
    translationPick = row.dataset.id;
    state.translation = translationPick;
    updateTranslationDisplay();
    closeSheet('translation');
    saveSessionState();
    loadPreview();  // the Preview card should reflect the newly picked translation
  });

  // ============ BOTTOM SHEET HELPERS ============
  function openSheet(key){
    document.getElementById(`${key}Backdrop`).classList.add('open');
    document.getElementById(`${key}Sheet`).classList.add('open');
  }
  function closeSheet(key){
    document.getElementById(`${key}Backdrop`).classList.remove('open');
    document.getElementById(`${key}Sheet`).classList.remove('open');
  }
  ['surah', 'reciter', 'translation'].forEach(key => {
    document.getElementById(`${key}Backdrop`).addEventListener('click', () => closeSheet(key));
    document.getElementById(`${key}SheetClose`).addEventListener('click', () => closeSheet(key));
  });

  // ============ CONFIRM DIALOG ============
  function showConfirm({ title, message, confirmLabel = 'Delete', cancelLabel = 'Cancel' }){
    const backdrop = document.getElementById('confirmBackdrop');
    const modal = document.getElementById('confirmModal');
    const titleEl = document.getElementById('confirmTitle');
    const messageEl = document.getElementById('confirmMessage');
    const cancelBtn = document.getElementById('confirmCancelBtn');
    const dangerBtn = document.getElementById('confirmDangerBtn');

    titleEl.textContent = title;
    messageEl.textContent = message;
    cancelBtn.textContent = cancelLabel;
    dangerBtn.textContent = confirmLabel;

    return new Promise(resolve => {
      function close(result){
        backdrop.classList.remove('open');
        modal.classList.remove('open');
        cancelBtn.removeEventListener('click', onCancel);
        dangerBtn.removeEventListener('click', onConfirm);
        backdrop.removeEventListener('click', onCancel);
        resolve(result);
      }
      function onCancel(){ close(false); }
      function onConfirm(){ close(true); }
      cancelBtn.addEventListener('click', onCancel);
      dangerBtn.addEventListener('click', onConfirm);
      backdrop.addEventListener('click', onCancel);
      backdrop.classList.add('open');
      modal.classList.add('open');
    });
  }

  // Single-button variant of showConfirm() above, reusing the same modal
  // markup with the Cancel button hidden -- for messages that just need
  // acknowledging, not a yes/no choice.
  function showAlert({ title, message, okLabel = 'OK' }){
    const backdrop = document.getElementById('confirmBackdrop');
    const modal = document.getElementById('confirmModal');
    const titleEl = document.getElementById('confirmTitle');
    const messageEl = document.getElementById('confirmMessage');
    const cancelBtn = document.getElementById('confirmCancelBtn');
    const dangerBtn = document.getElementById('confirmDangerBtn');

    titleEl.textContent = title;
    messageEl.textContent = message;
    cancelBtn.style.display = 'none';
    dangerBtn.textContent = okLabel;
    dangerBtn.classList.remove('confirm-danger');

    return new Promise(resolve => {
      function close(){
        backdrop.classList.remove('open');
        modal.classList.remove('open');
        dangerBtn.removeEventListener('click', onOk);
        backdrop.removeEventListener('click', onOk);
        cancelBtn.style.display = '';
        dangerBtn.classList.add('confirm-danger');
        resolve();
      }
      function onOk(){ close(); }
      dangerBtn.addEventListener('click', onOk);
      backdrop.addEventListener('click', onOk);
      backdrop.classList.add('open');
      modal.classList.add('open');
    });
  }

  // ============ THEME: built-in presets + saved custom themes ============
  const themeCardsEl = document.getElementById('themeCards');
  const themeRow = document.getElementById('themeRow');
  const themeAddBtn = document.getElementById('themeAddBtn');
  const themeAddLabel = document.getElementById('themeAddLabel');
  const themeAddIcon = document.getElementById('themeAddIcon');

  let savedThemes = []; // [{id, name, theme}], fetched from /api/themes

  // Presets are hard-coded in quran-data.js, so "deleting" one just hides it
  // for this browser (stored locally) rather than removing it from the file.
  function getHiddenPresets(){
    try { return JSON.parse(localStorage.getItem('afs_hidden_presets') || '[]'); }
    catch (e) { return []; }
  }
  function hidePreset(name){
    const hidden = getHiddenPresets();
    if (!hidden.includes(name)){
      hidden.push(name);
      localStorage.setItem('afs_hidden_presets', JSON.stringify(hidden));
    }
  }

  function themeEntries(){
    const hidden = getHiddenPresets();
    const presets = Object.keys(window.THEME_PRESETS)
      .filter(name => !hidden.includes(name))
      .map(name => ({
        key: 'preset:' + name, name, theme: window.THEME_PRESETS[name], deletable: true,
      }));
    const saved = savedThemes.map(t => ({
      key: 'saved:' + t.id, name: t.name, theme: t.theme, deletable: true, id: t.id,
    }));
    return presets.concat(saved);
  }

  function swatchStyle(theme){
    const top = (theme.background_style === 'solid' ? theme.bg_solid : theme.bg_top) || [10, 20, 35];
    const bottom = theme.background_style === 'solid' ? theme.bg_solid : (theme.bg_bottom || top);
    return `background:linear-gradient(160deg, rgb(${top.join(',')}), rgb(${bottom.join(',')}))`;
  }

  function glyphColor(theme){
    const c = theme.arabic_color || [240, 240, 235];
    return `color:rgb(${c.join(',')})`;
  }

  function renderThemeCards(){
    themeCardsEl.innerHTML = themeEntries().map(entry => `
      <div class="theme-card" data-key="${entry.key}">
        <div class="theme-swatch" style="${swatchStyle(entry.theme)}">
          ${entry.deletable ? `<button class="theme-delete" data-key="${entry.key}" aria-label="Delete theme"><svg viewBox="0 0 24 24" fill="none" stroke="#FFFDF6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>` : ''}
          <div class="theme-check"><svg viewBox="0 0 24 24" fill="none" stroke="#FFFDF6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></div>
          <div class="glyph" style="${glyphColor(entry.theme)}">ﷲ</div>
        </div>
        <div class="theme-name">${entry.name}</div>
      </div>
    `).join('');
    themeCardsEl.querySelectorAll('.theme-card').forEach(card => {
      card.classList.toggle('selected', card.dataset.key === state.themeKey);
      card.addEventListener('click', () => {
        const isSame = state.themeKey === card.dataset.key;
        selectTheme(isSame ? null : card.dataset.key);
      });
    });
    themeCardsEl.querySelectorAll('.theme-delete').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        e.stopPropagation();
        const key = btn.dataset.key;

        if (key.startsWith('preset:')){
          // Built-in style: hide it locally, nothing to delete server-side.
          const name = key.slice('preset:'.length);
          const ok = await showConfirm({
            title: 'Remove style?',
            message: `Remove "${name}" from your styles list? You can bring it back by clearing your browser data.`,
          });
          if (!ok) return;
          hidePreset(name);
          if (state.themeKey === key) selectTheme(null);
          renderThemeCards();
          return;
        }

        // Saved (custom) theme: delete from the backend.
        const id = key.slice('saved:'.length);
        const entry = savedThemes.find(t => t.id === id);
        const ok = await showConfirm({
          title: 'Delete style?',
          message: `Delete "${entry ? entry.name : 'this theme'}"? This can't be undone.`,
        });
        if (!ok) return;
        try {
          await fetch(`/api/themes/${id}`, { method: 'DELETE' });
        } catch (err) { /* best-effort */ }
        savedThemes = savedThemes.filter(t => t.id !== id);
        if (state.themeKey === key) selectTheme(null);
        renderThemeCards();
      });
    });
  }

  async function loadSavedThemes(){
    try {
      savedThemes = await fetch('/api/themes').then(r => r.json());
    } catch (e) {
      savedThemes = [];
    }
    renderThemeCards();
  }

  function selectTheme(key){
    const entry = key ? themeEntries().find(t => t.key === key) : null;
    state.themeKey = entry ? entry.key : null;
    state.themeLabel = entry ? entry.name : null;
    state.themeObject = entry ? entry.theme : null;
    themeCardsEl.querySelectorAll('.theme-card').forEach(c => c.classList.toggle('selected', c.dataset.key === state.themeKey));
    themeAddBtn.classList.toggle('is-custom', !!(entry && entry.id));
    updateThemeAddTile();
    updateContinueBtn();
    saveSessionState();
  }

  function updateThemeAddTile(){
    if (state.themeLabel){
      themeAddBtn.classList.add('is-edit');
      themeAddLabel.innerHTML = 'Edit<br>theme';
      themeAddIcon.innerHTML = '<path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/>';
    } else {
      themeAddBtn.classList.remove('is-edit');
      themeAddLabel.innerHTML = 'Add<br>theme';
      themeAddIcon.innerHTML = '<path d="M12 5v14M5 12h14"/>';
    }
  }

  themeAddBtn.addEventListener('click', () => {
    const entry = state.themeKey ? themeEntries().find(t => t.key === state.themeKey) : null;
    if (entry && entry.id){
      localStorage.setItem('afs_edit_seed', JSON.stringify({ id: entry.id, name: entry.name, theme: entry.theme }));
      location.href = `/frame_editor.html?themeId=${encodeURIComponent(entry.id)}`;
    } else {
      const seed = entry ? entry.name : '';
      location.href = `/frame_editor.html?theme=${encodeURIComponent(seed)}`;
    }
  });

  // Consume a just-saved custom theme when returning from frame_editor.html.
  async function consumeCustomThemeIfJustSaved(){
    if (sessionStorage.getItem('afs_custom_theme_just_saved') !== '1') return;
    sessionStorage.removeItem('afs_custom_theme_just_saved');
    const savedId = localStorage.getItem('afs_last_saved_theme_id');
    await loadSavedThemes();
    if (savedId) selectTheme('saved:' + savedId);
  }
  window.addEventListener('pageshow', consumeCustomThemeIfJustSaved);

  // ============ CONTINUE ============
  const continueBtn = document.getElementById('continueBtn');
  const continueHint = document.getElementById('continueHint');

  function updateContinueBtn(){
    const hasTheme = !!state.themeKey;
    const hasReciter = !!state.reciter;
    continueBtn.disabled = !hasTheme || !hasReciter;
    continueHint.textContent = !hasReciter
      ? 'Pick a reciter above to continue'
      : hasTheme
        ? "You'll sync recitation timing on the next step"
        : 'Pick a style above to continue';
  }

  continueBtn.addEventListener('click', () => {
    if (!state.themeKey) return;
    saveSessionState();
    location.href = `/timing.html?sessionId=${encodeURIComponent(sessionId)}`;
  });

  // ============ INIT ============
  async function init(){
    const session = await ensureSession();

    const restoredSurah = surahs.find(s => s.n === session.surah);
    if (restoredSurah){
      state.surah = restoredSurah;
      if (Number.isInteger(session.ayahStart) && Number.isInteger(session.ayahEnd) &&
          session.ayahStart >= 1 && session.ayahEnd <= restoredSurah.ayahs && session.ayahStart <= session.ayahEnd){
        state.from = session.ayahStart;
        state.to = session.ayahEnd;
      }
    }
    // Set before updateSurahDisplay() (which triggers the first
    // loadPreview()) so that preview fetch already uses the restored
    // translation instead of the default, then corrected right after.
    if (session.translation) state.translation = session.translation;
    if (session.orientation === 'horizontal' || session.orientation === 'vertical') state.orientation = session.orientation;
    document.querySelectorAll('#orientationSeg button').forEach(b => b.classList.toggle('active', b.dataset.value === state.orientation));

    updateSurahDisplay();
    updateRangeDisplay();
    updateThemeAddTile();
    updateContinueBtn();
    await loadSavedThemes();
    if (session.themeName){
      const match = themeEntries().find(t => t.name === session.themeName);
      if (match) selectTheme(match.key);
    }

    try {
      const data = await fetch('/api/reciters').then(r => r.json());
      reciters = Object.entries(data).map(([key, name]) => ({ key, name }));
    } catch (e) {
      reciters = [{ key: 'yasser_al_dossary', name: 'Yasser Al-Dossary' }];
    }
    try {
      const gaplessKeys = await fetch('/api/reciters/gapless').then(r => r.json());
      gaplessReciterKeys = new Set(gaplessKeys);
    } catch (e) {
      gaplessReciterKeys = new Set(['yasser_al_dossary']);
    }
    // A session saved before this restriction existed may still point at a
    // non-gapless reciter -- don't silently swap it out from under an
    // in-progress video, only steer NEW picks (via the sheet's click
    // handler above) away from non-gapless reciters.
    const restoredReciter = session.reciter ? reciters.find(r => r.key === session.reciter) : null;
    state.reciter = restoredReciter
      || reciters.find(r => gaplessReciterKeys.has(r.key))
      || reciters[0];
    updateReciterDisplay();
    updateContinueBtn();

    try {
      translations = await fetch('/api/translations').then(r => r.json());
      if (!Array.isArray(translations)) translations = [];
    } catch (e) {
      translations = [];
    }
    updateTranslationDisplay();

    await consumeCustomThemeIfJustSaved();
  }
  init();
</script>
