    selectedMarkerId = null;
    updateNextButtonState();
    updatePreviewAvailability();
    stopPlayback();
    seekTo(0);
    renderChips();
    renderWaveMarkers();
    renderMarkPanel();
    persistSession();
  }

  // Drops every 'break' boundary in this ayah (frames collapse back to one),
  // leaving 'merge' boundaries untouched. 'break' never affects chip
  // grouping/markerList (see toggleBoundary()'s comment), so this is just a
  // boundaryModes edit -- no marker cleanup needed.
  function clearFrameSeparators(){
    if (!boundaryModes.some(m => m === 'break')) return;
    pushUndoSnapshot();
    boundaryModes = boundaryModes.map(m => m === 'break' ? null : m);
    renderChips();
    renderWaveMarkers();
    renderMarkPanel();
    persistSession();
  }

  // Only makes sense on the FIRST or LAST ayah of the recitation -- those
  // are the only ones a range recording can start/end mid-ayah on. An
  // interior ayah is always recited in full, so trimming it would delete
  // words that genuinely belong in the video.
  function canTrimEdgeWords(){
    return ayahs.length > 0 && (ayahIndex === 0 || ayahIndex === ayahs.length - 1) && markerList.length > 0;
  }

  // Drops the leading/trailing chips that never got a marker -- the part of
  // this ayah's text the recording doesn't actually cover, for a range that
  // starts or ends mid-ayah. Only the two edges are trimmed; an unmarked gap
  // between two marked chips is left alone (nextBtn/complete-state already
  // requires every remaining chip to be marked before the ayah counts as done).
  function trimUnmarkedEdgeWords(){
    if (!canTrimEdgeWords()) return;
    const entry = currentAyah();
    const groups = computeChipGroups(entry, boundaryModes);
    const markedGroupIdx = groups
      .map((g, gi) => (markerList.some(m => m.wordIndex === g[0]) ? gi : -1))
      .filter(gi => gi >= 0);
    if (!markedGroupIdx.length) return;

    const firstGroup = groups[markedGroupIdx[0]];
    const lastGroup = groups[markedGroupIdx[markedGroupIdx.length - 1]];
    const keepStart = firstGroup[0];
    const keepEnd = lastGroup[lastGroup.length - 1];  // inclusive
    if (keepStart === 0 && keepEnd === entry.words.length - 1) return;  // nothing to trim

    const droppedCount = entry.words.length - (keepEnd - keepStart + 1);
    if (!confirm(`Delete the ${droppedCount} unmarked word(s) at the start/end of this ayah? They'll be removed from the text permanently.`)) return;

    if (previewMode) exitPreview();

    entry.words = entry.words.slice(keepStart, keepEnd + 1);
    boundaryModes = boundaryModes.slice(keepStart, keepEnd);
    markerList = markerList
      .filter(m => m.wordIndex >= keepStart && m.wordIndex <= keepEnd)
      .map(m => ({ ...m, wordIndex: m.wordIndex - keepStart }));
    selectedMarkerId = null;

    // entry.words itself isn't part of the marker undo/redo snapshots, so any
    // stale entry from before this trim would reference word indices that no
    // longer exist -- drop the whole stack rather than risk restoring into a
    // now-mismatched word list.
    undoStack = [];
    redoStack = [];
    updateUndoRedoButtons();

    updateNextButtonState();
    updatePreviewAvailability();
    stopPlayback();
    seekTo(0);
    renderChips();
    renderWaveMarkers();
    renderMarkPanel();
    persistSession();
  }

  trimEdgeWordsBtn.addEventListener('click', trimUnmarkedEdgeWords);

  // ============ REAL AUDIO PLAYBACK ============
  function startPlayback(){
    playing = true;
    audioEl.play();
    playIcon.innerHTML = '<rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/>';
    cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(tick);
  }
  function stopPlayback(){
    playing = false;
    audioEl.pause();
    cancelAnimationFrame(rafId);
    playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
  }
  function seekTo(t){
    const entry = currentAyah();
    const clamped = Math.max(0, Math.min(t, entry.duration));
    audioEl.currentTime = clamped + (entry.rangeStart || 0);
    elapsed = clamped;
    renderPlayhead();
  }
  function renderPlayhead(){
    const entry = currentAyah();
    const pct = entry.duration ? (elapsed / entry.duration) * 100 : 0;
    wavePlayheadEl.style.left = pct + '%';
    curTimeEl.textContent = elapsed.toFixed(1) + 's';
    const bars = document.querySelectorAll('.wave-bar');
    bars.forEach((bar, i) => {
      const barPct = (i / Math.max(1, bars.length - 1)) * 100;
      bar.classList.toggle('played', barPct <= pct);
    });
    if (waveFollowPlayhead) scrollWaveTrackToTime(elapsed);
    updatePreviewHighlight();
  }
  function tick(){
    if (!playing) return;
    const entry = currentAyah();
    const rangeStart = entry.rangeStart || 0;
    // A Bismillah frame's rangeEnd sits mid-file (the rest of the file is
    // the ayah that follows in the same recitation) -- stop there instead
    // of letting playback run on into the next frame's audio.
    if (entry.rangeEnd != null && audioEl.currentTime >= entry.rangeEnd){
      elapsed = entry.duration;
      renderPlayhead();
      stopPlayback();
      if (previewMode) exitPreview();
      return;
    }
    elapsed = audioEl.currentTime - rangeStart;
    renderPlayhead();
    rafId = requestAnimationFrame(tick);
  }
  audioEl.addEventListener('ended', () => {
    stopPlayback();
    if (previewMode) exitPreview();
  });

  document.getElementById('playBtn').addEventListener('click', () => {
    if (playing) stopPlayback();
    else {
      const entry = currentAyah();
      if (elapsed >= entry.duration) seekTo(0);
      startPlayback();
    }
  });
  document.getElementById('restartBtn').addEventListener('click', () => seekTo(0));
  document.getElementById('backBtn').addEventListener('click', () => seekTo(elapsed - 0.25));
  document.getElementById('fwdBtn').addEventListener('click', () => seekTo(elapsed + 0.25));

  waveTrackEl.addEventListener('click', (e) => {
    const entry = currentAyah();
    if (!entry.duration) return;
    // Use waveInner's rect, not waveTrack's -- once zoomed in, the track is
    // just a scrolled viewport onto waveInner, which is the element that
    // actually spans the ayah's full duration.
    const rect = waveInnerEl.getBoundingClientRect();
    const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
    seekTo(pct * entry.duration);
  });

  // ---------- speed (row of preset pills) ----------
  function setSpeed(v){
    speed = v;
    audioEl.playbackRate = speed;
    document.querySelectorAll('#speedRow .speed-btn').forEach(b => {
      b.classList.toggle('active', parseFloat(b.dataset.speed) === speed);
    });
  }
  document.getElementById('speedRow').addEventListener('click', (e) => {
    const btn = e.target.closest('.speed-btn');
    if (!btn) return;
    setSpeed(parseFloat(btn.dataset.speed));
  });
  setSpeed(speed);

  // ---------- word chip interaction ----------
  wordChipsEl.addEventListener('click', (e) => {
    if (previewMode) return;
    const boundary = e.target.closest('.word-boundary');
    if (boundary){
      toggleBoundary(Number(boundary.dataset.boundary));
      return;
    }
    const chip = e.target.closest('.word-chip');
    if (!chip) return;
    addMarker(Number(chip.dataset.i), elapsed);
  });

  // Clicking anywhere outside the word card and the mark panel (blank
  // space, transport, waveform, etc.) clears the current word selection.
  // Clicks on a word chip or inside the mark panel manage selection
  // themselves and are left alone.
  // Note: this uses composedPath() rather than e.target.closest(), because
  // clicking mpPrevBtn/mpNextBtn (or unmark/nudge) re-renders markPanel's
  // innerHTML *during* the same click's bubble phase -- by the time this
  // listener runs, the clicked button has already been detached from the
  // DOM, so closest('#markPanel') on it would (wrongly) find no ancestor
  // and immediately clear the selection this same click just set.
  // composedPath() reflects the path at dispatch time, before that
  // re-render happened, so it still correctly reports the click as
  // "inside" the panel.
  document.addEventListener('click', (e) => {
    if (!selectedMarkerId) return;
    const path = e.composedPath();
    if (path.some(el => el.classList && (el.classList.contains('word-chip') || el.classList.contains('word-boundary')))) return;
    if (path.includes(markPanelEl)) return;
    if (path.includes(markersToggleBtn)) return;
    selectedMarkerId = null;
    renderChips();
    renderWaveMarkers();
    renderMarkPanel();
  });

  clearAllBtn.addEventListener('click', clearAllMarks);
  clearFrameSeparatorsBtn.addEventListener('click', clearFrameSeparators);
  undoBtn.addEventListener('click', undo);
  redoBtn.addEventListener('click', redo);
  document.addEventListener('keydown', (e) => {
    if (!(e.ctrlKey || e.metaKey)) return;
    if (e.key.toLowerCase() !== 'z') return;
    e.preventDefault();
    if (e.shiftKey) redo(); else undo();
  });
  markersToggleBtn.addEventListener('click', () => {
    if (!panelOpen && previewMode) {
      const marker = getPreviewCurrentMarker(elapsed);
      if (marker) selectedMarkerId = marker.id;
      exitPreview();
    }
    panelOpen = !panelOpen;
    renderMarkPanel();
  });

  // Skip is meant for an ayah you deliberately want on automatic pacing
  // (never marked at all) -- but nothing stopped it being used mid-marking
  // too, which quietly drops whatever's already placed from the final
  // manifest (buildManifest() only ever includes a fully-marked ayah) with
  // no feedback at the time. Only warn when there's something to actually
  // lose (some, but not all, chips marked); a truly untouched ayah skips
  // silently same as before.
  document.getElementById('skipBtn').addEventListener('click', () => {
    const entry = currentAyah();
    const covered = new Set(markerList.map(m => m.wordIndex));
    const totalChips = computeChipGroups(entry, boundaryModes).length;
    if (covered.size > 0 && covered.size < totalChips){
      const goBack = confirm(`You've only marked ${covered.size} of ${totalChips} word(s) on ${entry.label} -- skipping now means it won't use your manual timing (automatic pacing instead), and these marks will be left out.\n\nOK = stay and finish marking. Cancel = skip anyway.`);
      if (goBack) return;
    }
    goNext();
  });
  nextBtn.addEventListener('click', goNext);
  prevBtn.addEventListener('click', goPrev);
  ayahDotsEl.addEventListener('click', (e) => {
    const dot = e.target.closest('.ayah-dot-hit');
    if (!dot) return;
    goToAyah(Number(dot.dataset.i));
  });

  function goToAyah(i){
    if (i < 0 || i >= ayahs.length || i === ayahIndex) return;
    persistSession();
    ayahIndex = i;
    loadAyah();
  }

  function goNext(){
    if (ayahIndex < ayahs.length - 1){
      goToAyah(ayahIndex + 1);
    } else {
      persistSession();
      finishTiming();
    }
  }
  function goPrev(){ goToAyah(ayahIndex - 1); }

  // Inverse of buildManifest(), for reopening any session (complete/
  // editOnlyMode or still in progress) whose server-saved timing has no
  // matching local draft: rebuilds each ayah's markerList AND boundaryModes
  // from the manifest's frames, shifted back to this frame's own phase-
  // relative clock (rangeStart is 0 for every entry except the Bismillah/
  // ayah-1 split pair). Walks every frame (not just the first), inferring
  // where each ends by counting its own text's words -- a raw-word offset
  // running across frames. A frame boundary past the first becomes a
  // 'break'; a highlight_words entry whose index is a multi-element list
  // becomes a 'merge' across the raw words it spans. This reliably round-
  // trips a manifest THIS editor produced; a hand-authored manifest whose
  // frame text doesn't slice entry.words in order won't necessarily line
  // up, same caveat buildManifest()'s "combine or split however you like"
  // always carried -- not a regression, just not something this editor can
  // faithfully re-display.
  function hydrateAyahStatesFromManifest(manifest){
    const manifestAyahs = (manifest && manifest.ayahs) || {};
    ayahs.forEach((entry, i) => {
      const stored = manifestAyahs[String(entry.ayahNumber)];
      const frames = stored && Array.isArray(stored.frames) ? stored.frames : [];
      if (!frames.length) return;

      // Sized from the manifest's OWN frame texts, not entry.words -- this
      // runs during init(), before any ayah's real text/audio has been
      // fetched (see ensureLoaded()), so entry.words doesn't exist yet.
      const rangeStart = entry.rangeStart || 0;

      // A REPEATED frame (the reciter backtracking over an already-recited
      // phrase -- see buildManifest()'s run-based grouping, which is what
      // can now emit one) re-shows an earlier frame's exact word range
      // rather than introducing new raw words. Detected here by an exact
      // text match against a frame already seen in this ayah, so its
      // markers reuse that earlier offset instead of being double-counted
      // into the reconstructed word list -- counting them fresh would
      // inflate totalWords and misplace every later frame's boundaries and
      // marker positions.
      const offsetByText = new Map();
      let totalWords = 0;
      frames.forEach(frame => {
        if (offsetByText.has(frame.text)) return;
        offsetByText.set(frame.text, totalWords);
        totalWords += (frame.text || '').split(' ').filter(Boolean).length;
      });

      const boundaryModes = new Array(Math.max(0, totalWords - 1)).fill(null);
      const markerList = [];
      let any = false;

      frames.forEach(frame => {
        const frameOffset = offsetByText.get(frame.text);
        // Restore the break that precedes this range -- a no-op (already
        // 'break') on a repeat visit of the same range.
        if (frameOffset > 0) boundaryModes[frameOffset - 1] = 'break';

        (frame.highlight_words || []).forEach(hw => {
          any = true;
          const idxList = Array.isArray(hw.index) ? hw.index : [hw.index];
          for (let k = 0; k < idxList.length - 1; k++){
            const b = frameOffset + idxList[k];
            if (b >= 0 && b < boundaryModes.length) boundaryModes[b] = 'merge';
          }
          markerList.push({ id: markerList.length + 1, wordIndex: frameOffset + idxList[0], time: hw.start - rangeStart });
        });
      });

      if (!any) return;

      // A manifest frame is allowed to carry no highlight_words at all
      // (quran_lib/timing.py treats it as optional, and video_build.py
      // renders it as a plain, nothing-highlighted frame) -- so a saved
      // manifest can legitimately come back with some chip never marked.
      // Recomputing completeness here (instead of the old hard-coded
      // `true`) is what makes the editor correctly re-flag that ayah as
      // needing more marking rather than silently trusting stale state --
      // trusting it was letting buildManifest() (which only ever emits a
      // frame instance for a chip range that actually has a marker) drop
      // that chip's words and frame split entirely on the next Generate.
      const chipGroups = computeChipGroupsForWordCount(totalWords, boundaryModes);
      const covered = new Set(markerList.map(m => m.wordIndex));
      ayahStates[i] = {
        markerList, markIdCounter: markerList.length, boundaryModes,
        complete: covered.size === chipGroups.length,
      };
    });
  }

  // ============ MANIFEST + GENERATE ============
  function buildManifest(){
    const manifest = { ayahs: {} };
    ayahStates.forEach((state, i) => {
      if (!state || !state.complete || !state.markerList.length){
        console.log(`[timing] buildManifest(): skipping ayah index ${i} (${ayahs[i] ? ayahs[i].label : '?'}) --`,
          !state ? 'no state saved' : !state.complete ? 'not marked complete' : 'no markers');
        return;
      }
      const entry = ayahs[i];
      const modes = state.boundaryModes || [];
      // Marker times are recorded phase-relative (0 at this frame's own
      // start, elapsed/seekTo handle the translation to/from the shared
      // audio element's absolute time -- see loadAyah()/seekTo()/tick()).
      // The manifest needs them shifted back to rangeStart-relative-to-the-
      // undivided-file ("absolute") values: when this ayah is a Bismillah
      // paired with an ayah frame off the same file (see
      // detect_basmala_split()), both frames' times must share one clock so
      // build_video() can play them from a single audio subclip instead of
      // a split file.
      const rangeStart = entry.rangeStart || 0;
      const chipGroups = computeChipGroups(entry, modes);
      const frameRanges = computeFrameGroups(entry, modes);
      const sortedMarks = [...state.markerList].sort((a, b) => a.time - b.time);

      const frameIndexForWord = (wordIndex) => frameRanges.findIndex(r => wordIndex >= r.start && wordIndex < r.end);

      // Walk every marker in chronological order and run-length-encode them
      // into frame INSTANCES: a maximal run of consecutive-in-time markers
      // that all land in the same configured frame range becomes one
      // instance. With a normal forward tap-along, this produces exactly
      // one instance per configured range, in order -- identical to before.
      // But addMarker()/renderChips() already let a word be marked more
      // than once (comma-separated order numbers on a "marked" chip), for
      // exactly the case a reciter stops and repeats a phrase -- and once a
      // later marker lands back on an earlier frame's word, bucketing
      // markers by word-index range FIRST (the old approach) stretches
      // that earlier frame's own end past the next frame's start, which is
      // the TimingManifestError this replaces. Grouping by TIME first
      // instead means a backtracked marker simply starts a NEW run/instance
      // reusing that earlier frame's word range, so the video re-shows that
      // frame and re-highlights the repeated word at the right, later time.
      const runs = [];
      sortedMarks.forEach(m => {
        const fi = frameIndexForWord(m.wordIndex);
        const lastRun = runs[runs.length - 1];
        if (lastRun && lastRun.frameIdx === fi) lastRun.marks.push(m);
        else runs.push({ frameIdx: fi, marks: [m] });
      });

      const frames = [];
      runs.forEach((run, ri) => {
        const range = frameRanges[run.frameIdx];
        const frameStart = ri === 0 ? rangeStart : frames[ri - 1].end;
        const frameEnd = ri < runs.length - 1
          ? rangeStart + runs[ri + 1].marks[0].time
          : rangeStart + entry.duration;

        const highlightWords = run.marks.map((m, j) => {
          const group = chipGroups.find(g => g[0] === m.wordIndex) || [m.wordIndex];
          const localIdx = group.map(gi => gi - range.start);
          return {
            index: localIdx.length === 1 ? localIdx[0] : localIdx,
            start: rangeStart + m.time,
            end: j + 1 < run.marks.length ? rangeStart + run.marks[j + 1].time : frameEnd,
          };
        });

        frames.push({
          start: frameStart,
          end: frameEnd,
          text: entry.words.slice(range.start, range.end).join(' '),
          highlight_words: highlightWords,
        });
      });

      manifest.ayahs[String(entry.ayahNumber)] = { frames };
    });
    return manifest;
  }

  // Phase 3: {"ayahs": {"<realAyah>": {"filename", "crop_start", "crop_end"}}}
  // -- see quran_lib/audio_sources.py. Only ayahs actually replaced with a
  // custom upload are included; everything else keeps using the reciter.
  function buildCustomAudioManifest(){
    const manifest = { ayahs: {} };
    Object.entries(customAudioByRealAyah).forEach(([realAyah, custom]) => {
      manifest.ayahs[realAyah] = {
        filename: custom.filename,
        crop_start: custom.cropStart || 0,
        crop_end: custom.cropEnd,
      };
    });
    return manifest;
  }

  // "Done" no longer generates inline -- it persists the timing (and, for a
  // brand new session, hands off to select_style.html to pick a look before
  // generating). Style-picking, progress, cancel, and the finished-video
  // screen now live on their own pages (select_style.html/generating.html/
  // video_ready.html) so generation can be cancelled and the result gets a
  // dedicated screen instead of this page's old inline overlay.
  async function finishTiming(){
    stopPlayback();

    const manifest = buildManifest();
    const customAudioManifest = buildCustomAudioManifest();
    const timing = Object.keys(manifest.ayahs).length ? manifest : undefined;
    const customAudio = Object.keys(customAudioManifest.ayahs).length ? customAudioManifest : undefined;
    console.log(`[timing] finishTiming(): ayahStates=${ayahStates.map(s => s ? (s.complete ? 'complete' : 'incomplete') : 'empty').join(',')}`);
    console.log(`[timing] finishTiming(): built manifest for ${Object.keys(manifest.ayahs).length}/${ayahStates.length} ayah(s)`, timing);

    // Safety net: buildManifest() silently drops any ayah whose saved state
    // isn't (still) exactly "complete" -- if that ends up excluding marks
    // the user can see they placed (markerList non-empty), don't let this
    // proceed to overwrite/clear anything without the user knowing. Without
    // this check, a stale/mismatched ayahStates entry (e.g. this ayah's
    // word count shifted between the marking session and now) would
    // silently generate with automatic pacing AND wipe the local draft on
    // the way out, losing the marks for good with zero warning.
    const excludedButMarked = ayahStates
      .map((s, i) => ({ s, i }))
      .filter(({ s }) => s && s.markerList && s.markerList.length && !s.complete);
    if (excludedButMarked.length){
      console.warn('[timing] finishTiming(): these ayahs have marks but are NOT complete, so they will be EXCLUDED from what gets saved/generated:',
        excludedButMarked.map(({ s, i }) => `${ayahs[i] ? ayahs[i].label : `#${i}`} (${s.markerList.length} mark(s), ${s.complete})`));
      const names = excludedButMarked.map(({ i }) => ayahs[i] ? ayahs[i].label : `ayah index ${i}`).join(', ');
      const goBack = confirm(`${names} still ${excludedButMarked.length === 1 ? 'has' : 'have'} unfinished word marking -- ${excludedButMarked.length === 1 ? "it won't" : "they won't"} use your manual timing (automatic pacing instead), and continuing may lose those marks.\n\nOK = go back and finish marking. Cancel = continue anyway (marks for ${excludedButMarked.length === 1 ? 'it' : 'them'} will be dropped).`);
      if (goBack) return;
    }

    if (editOnlyMode){
      // Already a complete/locked session with its own theme -- this is
      // just a word-timing correction, so re-run the generator directly
      // instead of going through the style picker again.
      try {
        const res = await fetch('/api/generate', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sessionId: draft.id, timing }),
        });
        const json = await res.json();
        if (!res.ok) throw new Error(json.error || "Couldn't start the job.");
        console.log('[timing] editOnlyMode generate request accepted, jobId=', json.jobId);
        clearSavedSession();
        location.href = `/generating.html?jobId=${encodeURIComponent(json.jobId)}&sessionId=${encodeURIComponent(draft.id)}`;
      } catch (e) {
        console.error('[timing] editOnlyMode generate FAILED:', e);
        alert(e.message);
      }
      return;
    }

    try {
      const res = await fetch(`/api/sessions/${encodeURIComponent(draft.id)}`, {
        method: 'PUT', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ timing, customAudio }),
      });
      if (!res.ok) throw new Error('Failed to save your timing.');
      console.log('[timing] session PUT ok -- server session now:', await res.clone().json());
    } catch (e) {
      console.error('[timing] session PUT FAILED:', e);
      alert("Couldn't save your timing. Please try again.");
      return;
    }
    console.log('[timing] clearing local draft, handing off to select_style.html');
    clearSavedSession();
    location.href = `/select_style.html?sessionId=${encodeURIComponent(draft.id)}`;
  }

  // ============ INIT ============
  (async function init(){
    const res = await fetch(`/api/sessions/${encodeURIComponent(sessionId)}`);
    if (!res.ok){ location.href = '/new_video.html'; return; }
    const session = await res.json();
    if (session.status === 'complete' && !editOnlyMode){
      // Shouldn't be reachable from the UI outside the "Edit word timing"
      // entry point (completed sessions otherwise can't be re-edited), but
      // guard anyway rather than letting this page run with a locked
      // session's config.
      location.href = '/';
      return;
    }
    draft = {
      id: session.id,
      surah: session.surah,
      from: session.ayahStart,
      to: session.ayahEnd,
      // A custom-audio session (session.entry === 'custom') never has a
      // reciter picked -- reciterKey below is only ever used as the fallback
      // source for an ayah in range that has no custom mark, same default
      // app.py's /api/generate and /api/timing/audio already fall back to.
      // hasReciter tracks whether that's a REAL user choice or just this
      // silent fallback, so the UI (renderAudioSourceRow()) can avoid
      // implying a reciter was picked when one wasn't.
      hasReciter: !!session.reciter,
      reciterKey: session.reciter || 'yasser_al_dossary',
      translation: session.translation || 'en.sahih',
      theme: session.theme,
      themeLabel: session.themeName,
    };
    if (!draft.surah || !draft.from || !draft.to){
      // Incomplete draft (skipped straight here without finishing
      // new_video.html/custom_audio.html) -- go finish it on whichever
      // entry screen this session started from.
      const backTo = session.entry === 'custom' ? 'custom_audio.html' : 'new_video.html';
      location.href = `/${backTo}?sessionId=${encodeURIComponent(sessionId)}`;
      return;
    }
    document.getElementById('backBtnTop').setAttribute('onclick',
      editOnlyMode ? "location.href='/'"
        : `location.href='/${session.entry === 'custom' ? 'custom_audio.html' : 'new_video.html'}?sessionId=${encodeURIComponent(sessionId)}'`);

    try {
      const res = await fetch('/api/reciters');
      if (res.ok) reciterNames = await res.json();
    } catch (e) { /* non-fatal -- falls back to showing the raw reciter key */ }

    // Loaded BEFORE buildAyahSkeleton() so a previously-uploaded/cropped
    // ayah's audio (if any) is what gets fetched on the very first load,
    // not the reciter's -- audioUrl()/fetchBasmalaSplit() both read
    // customAudioByRealAyah via audioSourceParams().
    const preSkeletonSaved = loadSavedSession();
    if (preSkeletonSaved){
      customAudioByRealAyah = preSkeletonSaved.customAudioByRealAyah || {};
      rangeAudioInfo = preSkeletonSaved.rangeAudioInfo || null;
    } else if (session.customAudio && session.customAudio.ayahs){
      // Reopening a session that already has saved custom audio but no local
      // draft (e.g. a different browser/device, or the global localStorage
      // key got clobbered by working on a different timing session) -- not
      // just editOnlyMode: without this, every ayah silently falls back to
      // the plain reciter download instead of the audio the user uploaded.
      Object.entries(session.customAudio.ayahs).forEach(([realAyah, custom]) => {
        customAudioByRealAyah[realAyah] = {
          filename: custom.filename, cropStart: custom.crop_start || 0, cropEnd: custom.crop_end != null ? custom.crop_end : null,
        };
      });
    }

    try {
      ayahs = await buildAyahSkeleton();
    } catch (e) {
      wordChipsEl.innerHTML = `<div class="word-card-loading">${e.message}</div>`;
      return;
    }
    ayahStates = ayahs.map(() => null);

    const saved = loadSavedSession();
    console.log('[timing] init(): server session.timing =', session.timing, '| local draft =', saved);
    if (saved && Array.isArray(saved.ayahStates) && saved.ayahStates.length !== ayahs.length){
      console.warn(`[timing] init(): local draft has ${saved.ayahStates.length} ayah state(s) but this load built ${ayahs.length} -- draft REJECTED (length mismatch), falling through to server timing / blank`);
    }
    if (saved && Array.isArray(saved.ayahStates) && saved.ayahStates.length === ayahs.length){
      ayahStates = saved.ayahStates;
      ayahIndex = Math.max(0, Math.min(saved.ayahIndex || 0, ayahs.length - 1));
      console.log('[timing] init(): restored from local draft (in-browser autosave)');
    } else if (session.timing){
      // Reopening a session that already has saved word timing but no local
      // draft (e.g. finishTiming() cleared it, or a different browser/device)
      // -- not just editOnlyMode: without this, every ayah's marks come back
      // blank and the next Done silently drops whatever isn't re-marked,
      // overwriting the server's good manifest with an incomplete one.
      hydrateAyahStatesFromManifest(session.timing);
      console.log('[timing] init(): rehydrated from server-saved timing --',
        ayahStates.filter(s => s && s.complete).length, '/', ayahStates.length, 'ayah(s) restored complete');
    } else {
      console.log('[timing] init(): no local draft and no server timing -- starting blank');
    }

    await loadAyah();
  })();
</script>

</body>
