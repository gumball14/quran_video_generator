<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F1E4">
<title>Timing — Ayah Frame Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Manrope:wght@400;500;600;700;800&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>

  :root{
    --bg:#F6F1E4;
    --surface:#FFFDF6;
    --surface-2:#ECE3CC;
    --ink:#14183A;
    --ink-mute:#6C7094;
    --gold:#AD8226;
    --gold-soft:#C9973A;
    --line:rgba(20,24,58,.14);
    --line-soft:rgba(20,24,58,.07);
    --success:#2F8F6A;
    --danger:#B23B3B;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; height:100%; overflow:hidden; }
  body{
    background:
      radial-gradient(120% 45% at 50% -8%, rgba(173,130,38,.09), transparent 60%),
      var(--bg);
    color:var(--ink);
    font-family:'Manrope', sans-serif;
    height:100dvh;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:none;
  }
  button{ font-family:inherit; }

  .screen{
    height:100dvh;
    display:flex; flex-direction:column;
    max-width:480px; margin:0 auto;
    padding-top:env(safe-area-inset-top,0px);
    overflow:hidden;
    position:relative;
  }

  /* ---------- topbar ---------- */
  .topbar{ display:flex; align-items:center; justify-content:space-between; padding:14px 14px 4px; gap:8px; }
  .topbar-left{ display:flex; align-items:center; gap:11px; min-width:0; }
  .topbar-right{ display:flex; align-items:center; gap:8px; flex-shrink:0; }
  .topbar{ flex-shrink:0; }
  .ayah-dots{ flex-shrink:0; }
  .icon-btn{
    width:38px; height:38px; border-radius:12px;
    background:var(--surface); border:1px solid var(--line);
    box-shadow:0 2px 6px rgba(20,24,58,.06);
    display:flex; align-items:center; justify-content:center; flex-shrink:0; cursor:pointer;
  }
  .icon-btn svg{ width:16px; height:16px; }
  .icon-btn:active{ transform:scale(.94); }
  .topbar-title{ font-family:'Fraunces', serif; font-weight:600; font-size:15.5px; white-space:nowrap; }
  .progress-pill{
    display:flex; align-items:center; gap:5px;
    background:var(--surface); border:1px solid var(--line); border-radius:100px;
    padding:6px 11px; font-size:11px; font-weight:800; color:var(--ink-mute); white-space:nowrap;
  }

  .ayah-dots{ display:flex; justify-content:center; gap:0; padding:0 4px 8px; }
  .ayah-dot-hit{
    border:none; background:none; padding:7px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .ayah-dot-hit:active{ transform:scale(.85); }
  .ayah-dot{ width:6px; height:6px; border-radius:50%; background:var(--line); transition:background .2s ease, transform .2s ease; }
  .ayah-dot.done{ background:var(--success); }
  .ayah-dot.current{ background:var(--gold); transform:scale(1.35); }

  /* ---------- body ---------- */
  .body{
    flex:1; min-height:0; overflow:hidden; padding:10px 20px 14px;
    display:flex; flex-direction:column;
  }

  /* ---------- audio source (Phase 3: custom upload + crop) ---------- */
  .audio-source-row{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    margin-bottom:10px; flex-wrap:wrap;
  }
  .audio-source-label{ display:flex; align-items:center; gap:7px; min-width:0; }
  .audio-source-label svg{ width:13px; height:13px; color:var(--ink-mute); flex-shrink:0; }
  .audio-source-text{ font-size:11.5px; font-weight:700; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .audio-source-actions{ display:flex; align-items:center; gap:6px; flex-shrink:0; }
  .as-btn{
    border:none; cursor:pointer; border-radius:9px; padding:6px 10px;
    font-size:10.5px; font-weight:800; letter-spacing:.2px;
    background:var(--surface-2); color:var(--ink);
    display:flex; align-items:center; gap:5px;
    transition:transform .1s ease, background .12s ease, opacity .12s ease;
  }
  .as-btn svg{ width:11px; height:11px; }
  .as-btn:active{ transform:scale(.95); }
  .as-btn:disabled{ opacity:.4; pointer-events:none; }
  .as-btn.danger{ color:var(--danger); }
  .as-status{ font-size:10.5px; font-weight:700; color:var(--ink-mute); }
  .as-status.error{ color:var(--danger); }

  /* ---------- waveform ---------- */
  .wave-card{
    margin-top:4px; padding:12px 12px 10px; border-radius:16px;
    background:var(--surface); border:1px solid var(--line);
    box-shadow:0 2px 6px rgba(20,24,58,.05);
    flex-shrink:0;
  }
  /* ---------- waveform zoom row (matches custom_audio.html's track-wrap zoom controls) ---------- */
  .zoom-row{ display:flex; align-items:center; justify-content:flex-end; gap:6px; margin-bottom:6px; }
  .zoom-btn{
    width:22px; height:22px; border-radius:7px; border:none; cursor:pointer;
    background:var(--surface-2); color:var(--ink); font-weight:800; font-size:13px; line-height:1;
    display:flex; align-items:center; justify-content:center;
  }
  .zoom-btn:active{ transform:scale(.9); }
  .zoom-btn:disabled{ opacity:.35; pointer-events:none; }
  .zoom-label{ font-size:10px; font-weight:800; color:var(--ink-mute); min-width:26px; text-align:center; }
  .wave-track{
    position:relative; height:44px; border-radius:9px; overflow-x:auto; overflow-y:hidden;
    background:var(--surface-2); cursor:pointer; touch-action:pan-x; -webkit-overflow-scrolling:touch;
  }
  .wave-inner{ position:relative; height:100%; min-width:100%; }
  .wave-bars{
    position:absolute; inset:0; display:flex; align-items:center; gap:2px; padding:0 4px;
  }
  .wave-bar{ flex:1; border-radius:2px; background:rgba(20,24,58,.18); transition:background .15s ease; }
  .wave-bar.played{ background:var(--gold-soft); }
  .wave-playhead{
    position:absolute; top:0; bottom:0; width:2px; background:var(--ink);
    left:0; pointer-events:none;
  }
  .wave-playhead::before{
    content:""; position:absolute; top:-3px; left:50%; transform:translateX(-50%);
    width:8px; height:8px; border-radius:50%; background:var(--ink);
  }
  .wave-marker{
    position:absolute; top:0; bottom:0; width:2px; background:var(--success);
    opacity:.75; pointer-events:none;
  }
  .wave-marker.sel{ background:var(--gold); opacity:1; width:2.5px; }
  .frame-divider{
    position:absolute; top:0; bottom:0; width:3px; margin-left:-1.5px;
    background:repeating-linear-gradient(180deg, var(--ink) 0 3px, transparent 3px 6px);
    opacity:.6; pointer-events:none;
  }
  .wave-time{
    display:flex; justify-content:space-between; margin-top:5px;
    font-size:10px; color:var(--ink-mute); font-weight:700; font-variant-numeric:tabular-nums;
  }

  /* ---------- transport ---------- */
  .transport{ display:flex; align-items:center; justify-content:center; gap:8px; margin-top:8px; }
  /* when the mark panel is open, hide the transport controls to give word-card more room */
  body.mark-panel-open .transport{ display:none; }
  body.mark-panel-open .speed-row{ display:none; }
  body.mark-panel-open .wave-card{ padding-bottom:8px; }
  .t-btn{
    width:34px; height:34px; border-radius:50%; flex-shrink:0;
    background:var(--surface-2); border:none; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:transform .1s ease, background .12s ease;
  }
  .t-btn svg{ width:13px; height:13px; }
  .t-btn:active{ transform:scale(.92); background:var(--line); }
  .t-play{
    width:46px; height:46px; background:var(--ink);
    box-shadow:0 12px 22px -12px rgba(20,24,58,.5);
  }
  .t-play svg{ width:17px; height:17px; }
  .t-play:active{ background:#0c0f28; }
  .t-btn:disabled{ opacity:.4; pointer-events:none; }
  .t-btn.lock-btn.active{ background:var(--gold); color:#2B2004; }

  /* ---------- speed control (row of preset pills, matches custom_audio.html) ---------- */
  .speed-row{ display:flex; align-items:center; justify-content:center; gap:6px; margin-top:10px; }
  .speed-btn{
    padding:5px 11px; border-radius:20px; border:none; cursor:pointer;
    background:var(--surface-2); color:var(--ink-mute); font-weight:800; font-size:11px;
    font-variant-numeric:tabular-nums;
  }
  .speed-btn.active{ background:var(--ink); color:#FFFDF6; }
  .speed-btn:active{ transform:scale(.94); }

  /* ---------- ayah word chips ---------- */
  .word-card{
    margin-top:14px;
    padding:15px 16px 0; border-radius:18px;
    background:var(--surface); border:1px solid var(--line);
    box-shadow:0 2px 6px rgba(20,24,58,.05);
    flex:1; min-height:0;
    display:flex; flex-direction:column;
    overflow:hidden;
  }
  .word-card-head{
    display:flex; align-items:center; justify-content:flex-end;
    margin-bottom:0px; padding-bottom:10px; gap:10px; flex-shrink:0;
    border-bottom:1px solid var(--line-soft);
    overflow-x:auto; overflow-y:hidden;
    scrollbar-width:none;
  }
  .word-card-head::-webkit-scrollbar{ display:none; }
  .word-card-label{
    font-size:10.5px; font-weight:800; letter-spacing:1.2px; text-transform:uppercase;
    color:var(--ink-mute); flex-shrink:0;
  }
  .wc-btn-group{ display:flex; align-items:center; gap:6px; flex-shrink:0; }
  .wc-icon-btn{
    position:relative;
    display:flex; align-items:center; justify-content:center; border:none; cursor:pointer;
    width:30px; height:30px; border-radius:50%; flex-shrink:0;
    background:var(--ink); color:#F6F1E4;
    box-shadow:0 8px 16px -10px rgba(20,24,58,.5);
    transition:transform .12s ease, background .15s ease, opacity .12s ease;
  }
  .wc-icon-btn svg{ width:13px; height:13px; }
  .wc-icon-btn:active{ transform:scale(.9); }
  .wc-icon-btn:disabled{ opacity:.4; pointer-events:none; box-shadow:none; }
  .wc-icon-btn.on{ background:var(--gold); color:#2B2004; }
  .wc-icon-btn.danger{ background:var(--danger); color:#FFFDF6; }
  .wc-icon-btn.busy{ opacity:.6; pointer-events:none; }
  .wc-icon-btn.busy svg{ animation:wc-spin 1s linear infinite; }
  .wc-icon-btn[data-badge]::after{
    content: attr(data-badge);
    position:absolute; top:-4px; right:-4px;
    min-width:16px; height:16px; padding:0 3px; border-radius:100px; background:var(--success);
    display:flex; align-items:center; justify-content:center;
    font-family:'Manrope', sans-serif; font-size:9px; font-weight:800; color:#FFFDF6;
    box-shadow:0 0 0 2px var(--surface);
  }
  @keyframes wc-spin{ to{ transform:rotate(360deg); } }
  .word-chips{
    display:flex; flex-wrap:wrap; gap:8px; direction:rtl; justify-content:center;
    align-content:center;
    flex:1; min-height:0; overflow-y:auto;
    padding:14px 4px 18px;
  }
  /* content taller than the card: top-align instead of centering, otherwise
     centering pushes the overflow above scrollTop:0 where it can never be
     scrolled to (see updateWordChipsOverflow()) */
  .word-chips.overflowing{ align-content:flex-start; }
  .word-chip{
    font-family:'Amiri', serif; font-weight:700; font-size:19px;
    padding:8px 14px; border-radius:12px;
    background:var(--surface-2); border:1.5px solid transparent; color:var(--ink);
    cursor:pointer; position:relative; transition:background .15s ease, border-color .15s ease, transform .1s ease, box-shadow .15s ease;
  }
  .word-chip.marked{ background:rgba(47,143,106,.14); color:#1E5E45; }
  .word-chip.marked.selected{ box-shadow:0 0 0 3px rgba(173,130,38,.22); border-color:var(--gold-soft); }
  .word-chip.marked::after{
    content: attr(data-order);
    position:absolute; top:-7px; right:-7px;
    min-width:17px; height:17px; padding:0 4px; border-radius:100px; background:var(--success);
    display:flex; align-items:center; justify-content:center;
    font-family:'Manrope', sans-serif; font-size:9px; font-weight:800; color:#FFFDF6;
    letter-spacing:-.2px; white-space:nowrap;
    box-shadow:0 0 0 2px var(--surface);
  }
  .word-chip:active{ transform:scale(.95); }

  /* ---------- boundary handles: sit between two chips, toggling whether
     the words on either side are merged into one beat, split into a new
     frame, or (default) just two separate words in the same frame ---------- */
  .word-boundary{
    display:inline-flex; align-items:center; justify-content:center;
    width:26px; align-self:stretch; flex-shrink:0;
    border:none; background:none; cursor:pointer; padding:0;
    position:relative; color:var(--ink-mute); opacity:.55;
    transition:opacity .12s ease, color .12s ease;
  }
  .word-boundary::before{
    content:""; width:8px; height:8px; border-radius:50%; background:currentColor;
  }
  .word-boundary:active{ transform:scale(.85); }
  .word-boundary.merge{
    opacity:1; color:var(--gold); font-size:22px; font-weight:800; line-height:1;
  }
  .word-boundary.merge::before{ content:"⊕"; width:auto; height:auto; border-radius:0; background:none; }
  .word-boundary.break{ opacity:1; color:var(--danger); }
  .word-boundary.break::before, .word-boundary.break::after{
    content:""; position:absolute; left:50%; width:2.5px; height:12px;
    background:currentColor; border-radius:1px;
  }
  .word-boundary.break::before{ top:-7px; }
  .word-boundary.break::after{ bottom:-7px; }
  /* a 'merge' handle nested inside a chip (joining two of ITS OWN words)
     needs to sit inline with the chip's text, not stretch to its own
     flex-item height like the between-chip handles do */
  .word-chip .word-boundary{ width:16px; height:auto; align-self:auto; vertical-align:-2px; opacity:1; }
  .word-chip .word-boundary.merge{ font-size:16px; }
  .word-chip-word{ display:inline; }

  .word-chips.previewing .word-chip{ cursor:default; opacity:.55; transition:none; }
  .word-chip.preview-current{
    background:var(--ink); color:#F6F1E4; opacity:1;
    transform:scale(1.06);
    box-shadow:0 10px 20px -10px rgba(20,24,58,.5);
  }
  .word-card-loading{ margin:auto; text-align:center; color:var(--ink-mute); font-size:12.5px; font-weight:700; }

  /* ---------- mark panel ---------- */
  .mark-panel{
    margin-top:12px; padding:14px 16px; border-radius:18px;
    background:var(--surface); border:1px solid var(--line);
    box-shadow:0 2px 6px rgba(20,24,58,.05);
    flex-shrink:0;
  }
  .mark-panel:empty{ display:none; margin-top:0; padding:0; border:none; box-shadow:none; }

  .mp-nav-row{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .mp-nav-row.mp-nav-row--bottom{ margin-top:14px; padding-top:14px; border-top:1px solid var(--line-soft); }
  .mp-navbtn{
    display:flex; align-items:center; gap:5px; border:none; cursor:pointer;
    background:var(--surface-2); color:var(--ink); font-weight:800; font-size:11.5px;
    padding:8px 12px; border-radius:10px; transition:transform .1s ease, background .12s ease;
  }
  .mp-navbtn svg{ width:11px; height:11px; }
  .mp-navbtn:active{ transform:scale(.95); background:var(--line); }
  .mp-navbtn:disabled{ opacity:.4; pointer-events:none; }
  .mp-nav-count{ font-size:10.5px; font-weight:800; color:var(--ink-mute); white-space:nowrap; }

  .mp-adjust-head{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:12px;
  }
  .mp-word{ display:flex; align-items:center; gap:9px; }
  .mp-word-ar{ font-family:'Amiri', serif; font-weight:700; font-size:20px; }
  .mp-word-time{ font-size:11px; font-weight:700; color:var(--ink-mute); font-variant-numeric:tabular-nums; }
  .mp-order-badge{
    flex-shrink:0; width:20px; height:20px; border-radius:50%; background:var(--success); color:#FFFDF6;
    font-size:10.5px; font-weight:800; display:flex; align-items:center; justify-content:center;
  }
  .mp-unmark{
    border:none; background:none; cursor:pointer; padding:6px; border-radius:9px;
    color:var(--danger); display:flex; align-items:center; justify-content:center;
  }
  .mp-unmark svg{ width:15px; height:15px; }
  .mp-unmark:active{ background:rgba(178,59,59,.1); }

  .mp-nudge-row{ display:flex; align-items:center; gap:8px; }
  .mp-nudge{
    flex:1; height:46px; border-radius:13px; border:none; cursor:pointer;
    background:var(--surface-2); color:var(--ink); font-weight:800; font-size:13px;
    display:flex; align-items:center; justify-content:center; gap:6px;
    transition:transform .1s ease, background .12s ease;
  }
  .mp-nudge svg{ width:13px; height:13px; }
  .mp-nudge:active{ transform:scale(.96); background:var(--line); }
  .mp-playfrom{
    width:46px; height:46px; flex-shrink:0; border-radius:13px; border:none; cursor:pointer;
    background:var(--ink); display:flex; align-items:center; justify-content:center;
    box-shadow:0 10px 18px -10px rgba(20,24,58,.5);
  }
  .mp-playfrom svg{ width:15px; height:15px; }
  .mp-playfrom:active{ transform:scale(.94); }

  /* ---------- sticky footer (ayah label + dots share one row here, below
     the word-card, instead of each claiming their own strip) ---------- */
  .footbar{
    flex-shrink:0;
    padding:0 20px calc(env(safe-area-inset-bottom,0px) + 14px);
    background:linear-gradient(180deg, rgba(246,241,228,0), var(--bg) 30%);
    display:flex; flex-direction:column; gap:4px;
  }
  .ayah-progress-row{ display:flex; align-items:center; gap:10px; padding:0 4px 6px; }
  .ayah-progress-row .word-card-label{ flex-shrink:0; }
  .ayah-progress-row .ayah-dots{
    flex:1; min-width:0; justify-content:flex-end; gap:0; padding:0;
    overflow-x:auto; scrollbar-width:none;
  }
  .ayah-progress-row .ayah-dots::-webkit-scrollbar{ display:none; }
  .footbar-row{ display:flex; align-items:center; gap:10px; }
  .foot-icon-btn{
    flex-shrink:0; width:54px; height:54px; border-radius:16px;
    background:var(--surface); border:1px solid var(--line); cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:transform .12s ease, opacity .12s ease;
  }
  .foot-icon-btn svg{ width:16px; height:16px; }
  .foot-icon-btn:active{ transform:scale(.94); }
  .foot-icon-btn:disabled{ opacity:.35; pointer-events:none; }
  .continue-btn{
    flex:1; height:54px; border-radius:16px; border:none; cursor:pointer;
    background:var(--ink); color:#F6F1E4; font-weight:800; font-size:14px;
    display:flex; align-items:center; justify-content:center; gap:8px;
    box-shadow:0 16px 28px -16px rgba(20,24,58,.45);
    transition:transform .12s ease, opacity .12s ease;
  }
  .continue-btn:active{ transform:scale(.97); }
  .continue-btn:disabled{ opacity:.4; box-shadow:none; }
  .continue-btn svg{ width:14px; height:14px; }

  /* ---------- crop modal (Phase 3) ---------- */
  .crop-overlay{
    position:fixed; inset:0; background:rgba(20,24,58,.5); z-index:70;
    display:none; align-items:flex-end; justify-content:center;
  }
  .crop-overlay.open{ display:flex; }
  .crop-sheet{
    width:100%; max-width:480px; background:var(--bg);
    border-radius:22px 22px 0 0; padding:20px 20px calc(env(safe-area-inset-bottom,0px) + 20px);
  }
  .crop-title{ font-family:'Fraunces', serif; font-weight:600; font-size:16.5px; margin-bottom:4px; }
  .crop-hint{ font-size:11.5px; color:var(--ink-mute); line-height:1.5; margin-bottom:14px; }
  .crop-track{
    position:relative; height:52px; border-radius:10px; overflow:hidden;
    background:var(--surface-2);
  }
  .crop-bars{ position:absolute; inset:0; display:flex; align-items:center; gap:2px; padding:0 4px; }
  .crop-bar{ flex:1; border-radius:2px; background:rgba(20,24,58,.18); }
  .crop-mask{ position:absolute; top:0; bottom:0; background:rgba(20,24,58,.45); pointer-events:none; }
  .crop-handle{
    position:absolute; top:0; bottom:0; width:14px; margin-left:-7px;
    display:flex; align-items:center; justify-content:center; cursor:ew-resize; touch-action:none;
  }
  .crop-handle::before{ content:""; width:3px; height:100%; background:var(--gold); border-radius:2px; }
  .crop-handle::after{
    content:""; position:absolute; width:16px; height:16px; border-radius:50%;
    background:var(--gold); box-shadow:0 0 0 3px var(--bg);
  }
  .crop-times{ display:flex; justify-content:space-between; margin-top:8px; font-size:11px; font-weight:800; color:var(--ink); font-variant-numeric:tabular-nums; }
  .crop-snap-row{ display:flex; gap:8px; margin-top:10px; }
  .crop-snap-btn{
    flex:1; height:34px; border-radius:10px; border:1px solid var(--line);
    background:var(--surface); color:var(--ink); font-weight:700; font-size:11px; cursor:pointer;
  }
  .crop-snap-btn:active{ transform:scale(.97); }
  .crop-actions{ display:flex; gap:10px; margin-top:16px; }
  .crop-cancel-btn, .crop-apply-btn{
    flex:1; height:48px; border-radius:14px; border:none; cursor:pointer;
    font-weight:800; font-size:13px; display:flex; align-items:center; justify-content:center;
    transition:transform .12s ease;
  }
  .crop-cancel-btn{ background:var(--surface-2); color:var(--ink); }
  .crop-apply-btn{ background:var(--ink); color:#F6F1E4; }
  .crop-cancel-btn:active, .crop-apply-btn:active{ transform:scale(.97); }
  .crop-apply-btn:disabled{ opacity:.4; pointer-events:none; }

</style>

<body>

<audio id="ayahAudio" preload="auto"></audio>

<script>
  // ============ SESSION (server-side video-creation project; see sessions-refactor-progress.md) ============
  const sessionId = new URLSearchParams(location.search).get('sessionId');
  if (!sessionId){ location.href = '/new_video.html'; throw new Error('no sessionId'); }
  // Reopening a completed session's word timing (see the "Edit word timing"
  // entry point on the library card): surah/ayah-range/reciter/audio stay
  // locked server-side (see app.py's /api/generate "locked" handling) --
  // this flag only changes what the EDITOR shows/allows, the backend is
  // the actual enforcement.
  const editOnlyMode = new URLSearchParams(location.search).get('editTiming') === '1';
  // Wired for real once init() knows session.entry (custom vs reciter flow)
  // -- see below. Defaulted here only so the button isn't briefly dead
  // before that fetch resolves.
  document.getElementById('backBtnTop').setAttribute('onclick',
    editOnlyMode ? "location.href='/'" : `location.href='/new_video.html?sessionId=${encodeURIComponent(sessionId)}'`);

  let draft = null;  // populated in init() from GET /api/sessions/<id>; shaped like the old localStorage draft for minimal diff below

  const audioEl = document.getElementById('ayahAudio');
  let audioCtx = null;

  let ayahs = [];          // skeleton built in buildAyahSkeleton(), filled in lazily by ensureLoaded()
  let ayahIndex = 0;
  let markerList = [];
  let markIdCounter = 0;
  // boundaryModes[i] describes the gap between raw word i and i+1:
  // null (default: separate chips, same frame) | 'merge' (one highlighted
  // beat, e.g. two words recited too fast to tell apart) | 'break' (starts
  // a new displayed frame -- for a long ayah recited in parts). Derived,
  // never-stored views of this: computeChipGroups() (which raw words share
  // one markable/highlightable chip) and computeFrameGroups() (which raw
  // words make up one frame) -- see buildManifest() for how both turn into
  // the timing manifest's frames/highlight_words.
  let boundaryModes = [];
  let selectedMarkerId = null;
  let panelOpen = false;
  let speed = 1;
  let playing = false;
  let elapsed = 0;
  let rafId = null;
  let previewMode = false;
  let lastPreviewIdx = undefined;
  let ayahStates = [];      // per-ayah snapshot: null (untouched), or { markerList, markIdCounter, complete }

  // ============ PHASE 3: custom audio upload + crop ============
  // Keyed by REAL ayah number (not entry index) since a Bismillah/ayah-1
  // pair shares one underlying file/upload -- see quran_lib/audio_sources.py.
  // { filename, duration (of the RAW upload), cropStart, cropEnd (null = to
  // the end of the file) }.
  let customAudioByRealAyah = {};
  let reciterNames = {};   // filled from /api/reciters, for the "Reciter: X" label

  // ============ PHASE 3.1: one recording, split into ayahs ============
  // { filename, duration } for uploads/<session_id>/range.<ext> -- the raw
  // whole-range file itself. Which ayah gets which slice of it lives in
  // customAudioByRealAyah (same shape as any other custom-audio entry,
  // just with several ayahs sharing this one filename under different
  // crop windows). Set up via custom_audio.html (reached from the reciter
  // selector on new_video.html) -- this screen only reads it to label
  // audio that already came from a split range recording.
  let rangeAudioInfo = null;

  const wordChipsEl = document.getElementById('wordChips');
  const waveBarsEl = document.getElementById('waveBars');
  const waveMarkersEl = document.getElementById('waveMarkers');
  const wavePlayheadEl = document.getElementById('wavePlayhead');
  const waveTrackEl = document.getElementById('waveTrack');
  const waveInnerEl = document.getElementById('waveInner');
  const markPanelEl = document.getElementById('markPanel');
  const nextBtn = document.getElementById('nextBtn');
  const prevBtn = document.getElementById('prevBtn');
  const progressPill = document.getElementById('progressPill');
  const wordCardLabel = document.getElementById('wordCardLabel');
  const ayahDotsEl = document.getElementById('ayahDots');
  const curTimeEl = document.getElementById('curTime');
  const totalTimeEl = document.getElementById('totalTime');
  const playIcon = document.getElementById('playIcon');
  const clearAllBtn = document.getElementById('clearAllBtn');
  const clearFrameSeparatorsBtn = document.getElementById('clearFrameSeparatorsBtn');
  const trimEdgeWordsBtn = document.getElementById('trimEdgeWordsBtn');
  const markersToggleBtn = document.getElementById('markersToggleBtn');
  const undoBtn = document.getElementById('undoBtn');
  const redoBtn = document.getElementById('redoBtn');
  let undoStack = [];
  let redoStack = [];

  // Partitions entry.words into chips (maximal runs joined by 'merge'
  // boundaries) -- each chip is the unit a marker/highlight addresses. A
  // chip is identified by the raw index of its FIRST word (its "lead"),
  // which is what markerList[].wordIndex actually stores.
  function computeChipGroups(entry, modes){
    return computeChipGroupsForWordCount(entry.words.length, modes);
  }

  // Same partitioning, but off a raw word COUNT instead of a loaded entry --
  // needed by hydrateAyahStatesFromManifest(), which reconstructs chip
  // coverage from a saved manifest's frame texts before entry.words exists
  // (see ensureLoaded()).
  function computeChipGroupsForWordCount(wordCount, modes){
    const groups = [];
    let current = [0];
    for (let i = 0; i < wordCount - 1; i++){
      if (modes[i] === 'merge') current.push(i + 1);
      else { groups.push(current); current = [i + 1]; }
    }
    groups.push(current);
    return groups;
  }

  // Partitions entry.words into frames (maximal runs with no 'break'
  // boundary inside them) -- each becomes one manifest frame. A 'break'
  // can only ever fall between two chips (never inside a merged one, since
  // one boundary index can't be both 'merge' and 'break' at once), so this
  // never splits a chip computeChipGroups() would keep together.
  function computeFrameGroups(entry, modes){
    const frames = [];
    let start = 0;
    for (let i = 0; i < entry.words.length - 1; i++){
      if (modes[i] === 'break'){ frames.push({ start, end: i + 1 }); start = i + 1; }
    }
    frames.push({ start, end: entry.words.length });
    return frames;
  }

  function chipGroupForLead(entry, modes, lead){
    return computeChipGroups(entry, modes).find(g => g[0] === lead) || [lead];
  }

  function snapshotMarkerState(){
    return {
      markerList: markerList.map(m => ({ ...m })),
      markIdCounter,
      selectedMarkerId,
      boundaryModes: boundaryModes.slice(),
    };
  }

  function restoreMarkerState(snap){
    markerList = snap.markerList.map(m => ({ ...m }));
    markIdCounter = snap.markIdCounter;
    selectedMarkerId = snap.selectedMarkerId;
    boundaryModes = (snap.boundaryModes || []).slice();
    updateNextButtonState();
    updatePreviewAvailability();
    renderChips();
    renderWaveMarkers();
    renderMarkPanel();
    persistSession();
  }

  function updateUndoRedoButtons(){
    undoBtn.disabled = undoStack.length === 0;
    redoBtn.disabled = redoStack.length === 0;
  }

  function pushUndoSnapshot(){
    undoStack.push(snapshotMarkerState());
    redoStack = [];
    updateUndoRedoButtons();
  }

  function undo(){
    if (!undoStack.length) return;
    redoStack.push(snapshotMarkerState());
    const snap = undoStack.pop();
    restoreMarkerState(snap);
    updateUndoRedoButtons();
  }

  function redo(){
    if (!redoStack.length) return;
    undoStack.push(snapshotMarkerState());
    const snap = redoStack.pop();
    restoreMarkerState(snap);
    updateUndoRedoButtons();
  }
  const previewBtn = document.getElementById('previewBtn');
  const previewBtnIcon = document.getElementById('previewBtnIcon');
  const playFromStartBtn = document.getElementById('playFromStartBtn');
  const playFromStartBtnIcon = document.getElementById('playFromStartBtnIcon');
  const autoAlignBtn = document.getElementById('autoAlignBtn');

  const PLAY_ICON_PATH = '<path d="M8 5v14l11-7z"/>';
  const STOP_ICON_PATH = '<rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/>';
  // playFromStartBtnIcon's <svg> has fill="none"/stroke="currentColor" (for
  // its stroked "restart" glyph) -- the stop swap needs its own fill set
  // explicitly, or it would render as hollow outlined bars instead of solid ones.
  const STOP_ICON_PATH_STROKED_SVG = '<rect x="6" y="5" width="4" height="14" rx="1" fill="currentColor" stroke="none"/><rect x="14" y="5" width="4" height="14" rx="1" fill="currentColor" stroke="none"/>';
  const RESTART_ICON_PATH = '<path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/>';

  // Both the "preview from selection" and "play from start" buttons drive
  // the same previewMode -- clicking either one while it's already running
  // stops it, so both need to reflect the running state, not just the one
  // that started it.
  function setPreviewButtonsRunning(running){
    previewBtn.classList.toggle('on', running);
    playFromStartBtn.classList.toggle('on', running);
    previewBtnIcon.innerHTML = running ? STOP_ICON_PATH : PLAY_ICON_PATH;
    playFromStartBtnIcon.innerHTML = running ? STOP_ICON_PATH_STROKED_SVG : RESTART_ICON_PATH;
  }

  function currentAyah(){ return ayahs[ayahIndex]; }

  // Every entry sharing this real ayah number (a Bismillah/ayah-1 pair
  // shares one underlying file) must be re-fetched after its audio source
  // changes -- clears the cached blob/buffer/duration so ensureLoaded()
  // does real work again, and drops any markers timed against the old audio.
  //
  // If this ayah currently has a Bismillah/ayah split pair (only ever
  // possible for realAyah 1, always the first two entries), collapse it
  // into one "full" entry: rangeStart/rangeEnd were computed against the
  // ORIGINAL reciter audio's detected silence gap, and there's no reliable
  // way to re-detect a Bismillah pause in an arbitrary user recording, so
  // treating the whole upload as one frame is the only choice that can't
  // silently play/mark the wrong slice of the new audio. This is a one-way
  // simplification for the editor's word-marking UI only -- removing the
  // upload later does NOT restore the split (the ayah stays a single "full"
  // entry); this has no effect on generation itself unless that ayah was
  // actually hand-marked, since automatic pacing re-detects the Bismillah
  // split fresh at render time regardless of what the editor shows.
  function invalidateEntriesForRealAyah(realAyah){
    const indices = ayahs.map((_, i) => i).filter(i => ayahs[i].realAyah === realAyah);
    if (indices.length > 1){
      const removeIdx = indices[0], keepIdx = indices[1];
      Object.assign(ayahs[keepIdx], { part: 'full', rangeStart: 0, rangeEnd: null, label: `Ayah ${realAyah}` });
      ayahs.splice(removeIdx, 1);
      ayahStates.splice(removeIdx, 1);
      if (ayahIndex > removeIdx) ayahIndex -= 1;
    }
    ayahs.forEach((entry, i) => {
      if (entry.realAyah !== realAyah) return;
      entry.loaded = false;
      entry.audioBlob = null;
      entry.audioBuffer = null;
      entry.duration = undefined;
      ayahStates[i] = null;
    });
  }

  // ============ BUILD AYAH LIST (real surah/range from the draft) ============
  async function fetchText(surah, ayah){
    const res = await fetch(`/api/timing/text?surah=${surah}&ayah=${ayah}&translation=${encodeURIComponent(draft.translation || 'en.sahih')}`);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || `Couldn't fetch ayah ${ayah}.`);
    return data;
  }

  // Phase 3: sessionId is always passed so the backend can serve a
  // per-ayah custom upload instead of the reciter download when one
  // exists (see app.py's _resolve_ayah_audio()) -- harmless when there is
  // no upload for this ayah, it just falls back to the reciter as before.
  // customFilename is always passed too once a custom source exists,
  // addressing the upload directly by name instead of relying on the
  // "<ayah>.<ext>" naming convention -- this is what lets several ayahs
  // share ONE uploaded "range" file, each with its own crop window (see
  // the "split your recording" flow below). cropStart/cropEnd
  // (raw-upload-relative seconds) are only added once a crop has actually
  // been committed for this ayah.
  function audioSourceParams(realAyah){
    let extra = `&sessionId=${encodeURIComponent(sessionId)}`;
    const custom = customAudioByRealAyah[realAyah];
    if (custom){
      extra += `&customFilename=${encodeURIComponent(custom.filename)}`;
      if (custom.cropStart > 0 || custom.cropEnd != null){
        extra += `&cropStart=${custom.cropStart}`;
        if (custom.cropEnd != null) extra += `&cropEnd=${custom.cropEnd}`;
      }
    }
    return extra;
  }

  function audioUrl(realAyah){
    return `/api/timing/audio?surah=${draft.surah}&ayah=${realAyah}&reciter=${draft.reciterKey}${audioSourceParams(realAyah)}`;
  }

  // Detects (never cuts) the Bismillah/ayah boundary in ayah 1's audio, as a
  // timestamp within that one undivided file -- see detect_basmala_split()
  // in quran_lib/audio.py. Returns null if no confident boundary was found.
  async function fetchBasmalaSplit(surah, ayah){
    const res = await fetch(`/api/timing/basmala-split?surah=${surah}&ayah=${ayah}&reciter=${encodeURIComponent(draft.reciterKey)}${audioSourceParams(ayah)}`);
    if (!res.ok) return null;
    const data = await res.json();
    return typeof data.splitAt === 'number' ? data.splitAt : null;
  }

  async function buildAyahSkeleton(){
    const entries = [];
    if (draft.from === 1){
      const textData = await fetchText(draft.surah, 1);
      const splitAt = textData.basmalaArabic ? await fetchBasmalaSplit(draft.surah, 1) : null;
      if (splitAt != null){
        // Bismillah and ayah 1 are two frames of the SAME audio file, not two
        // clips -- fetch it once and give both entries the same blob, each
        // scoped to its own [rangeStart, rangeEnd] window of it.
        const fullBlob = await (await fetch(audioUrl(1))).blob();
        entries.push({ ayahNumber: 0, realAyah: 1, part: 'basmala', textData, audioBlob: fullBlob, rangeStart: 0, rangeEnd: splitAt, label: 'Bismillah', loaded: false });
        entries.push({ ayahNumber: 1, realAyah: 1, part: 'ayah', textData, audioBlob: fullBlob, rangeStart: splitAt, rangeEnd: null, label: 'Ayah 1', loaded: false });
      } else {
        entries.push({ ayahNumber: 1, realAyah: 1, part: 'full', textData, rangeStart: 0, rangeEnd: null, label: 'Ayah 1', loaded: false });
      }
      for (let n = 2; n <= draft.to; n++){
        entries.push({ ayahNumber: n, realAyah: n, part: 'full', rangeStart: 0, rangeEnd: null, label: `Ayah ${n}`, loaded: false });
      }
    } else {
      for (let n = draft.from; n <= draft.to; n++){
        entries.push({ ayahNumber: n, realAyah: n, part: 'full', rangeStart: 0, rangeEnd: null, label: `Ayah ${n}`, loaded: false });
      }
    }
    return entries;
  }

  async function ensureLoaded(entry){
    if (entry.loaded) return;
    let textData = entry.textData;
    if (!textData) textData = await fetchText(draft.surah, entry.realAyah);
    const words = (entry.part === 'basmala' ? textData.basmalaArabic : textData.arabic).split(' ').filter(Boolean);

    let blob = entry.audioBlob;
    if (!blob){
      const res = await fetch(audioUrl(entry.realAyah));
      if (!res.ok){
        const err = await res.json().catch(() => ({}));
        throw new Error(err.error || `Couldn't fetch audio for ${entry.label}.`);
      }
      blob = await res.blob();
    }

    entry.textData = textData;
    entry.words = words;
    entry.audioBlob = blob;
    entry.loaded = true;
  }

  // ============ WAVEFORM (real, decoded from the ayah's actual audio) ============
  // startSec/endSec scope the drawn waveform to one frame's window of a
  // shared audio buffer (e.g. just the Bismillah portion, or just the ayah
  // portion) -- the buffer itself is always the one undivided file's full
  // decode, never a separately-decoded split clip.
  function buildBarsFromBuffer(audioBuffer, n, startSec = 0, endSec = null, targetEl = waveBarsEl, barClass = 'wave-bar'){
    const data = audioBuffer.getChannelData(0);
    const sr = audioBuffer.sampleRate;
    const startSample = Math.max(0, Math.floor(startSec * sr));
    const endSample = Math.min(data.length, endSec == null ? data.length : Math.floor(endSec * sr));
    const rangeLen = Math.max(1, endSample - startSample);
    const step = Math.floor(rangeLen / n) || 1;
    let bars = '';
    for (let i = 0; i < n; i++){
      let min = 1.0, max = -1.0;
      for (let j = 0; j < step; j++){
        const v = data[startSample + i * step + j] || 0;
        if (v < min) min = v;
        if (v > max) max = v;
      }
      const h = Math.max(6, Math.round((max - min) * 100));
      bars += `<div class="${barClass}" style="height:${h}%"></div>`;
    }
    targetEl.innerHTML = bars;
  }

  // ============ WAVEFORM ZOOM (mirrors custom_audio.html's main-track zoom) ============
  const WAVE_ZOOM_LEVELS = [1, 2, 4, 8, 16, 32];
  let waveZoomIdx = 0;
  const waveZoomLabelEl = document.getElementById('waveZoomLabel');
  const waveZoomOutBtn = document.getElementById('waveZoomOut');
  const waveZoomInBtn = document.getElementById('waveZoomIn');

  function renderMainWaveBars(){
    const entry = currentAyah();
    if (!entry || !entry.audioBuffer) return;
    const zoom = WAVE_ZOOM_LEVELS[waveZoomIdx];
    const baseN = entry.words && entry.words.length > 12 ? 72 : 46;
    const n = Math.min(1200, Math.round(baseN * zoom));
    buildBarsFromBuffer(entry.audioBuffer, n, entry.rangeStart || 0, entry.rangeEnd);
  }

  // Scrolls the main wave track so `t` (seconds, relative to this frame's own
  // window) sits centered in the viewport -- used after a zoom change to keep
  // the same part of the recitation in view, and (when the lock is on)
  // continuously during playback.
  function scrollWaveTrackToTime(t){
    const entry = currentAyah();
    if (!entry || !entry.duration) return;
    const pct = Math.max(0, Math.min(1, t / entry.duration));
    const targetLeft = pct * waveInnerEl.clientWidth - waveTrackEl.clientWidth / 2;
    waveTrackEl.scrollLeft = Math.max(0, targetLeft);
  }

  function applyWaveZoom(idx){
    waveZoomIdx = Math.max(0, Math.min(idx, WAVE_ZOOM_LEVELS.length - 1));
    const zoom = WAVE_ZOOM_LEVELS[waveZoomIdx];
    waveInnerEl.style.width = (zoom * 100) + '%';
    waveZoomLabelEl.textContent = zoom + '×';
    waveZoomOutBtn.disabled = waveZoomIdx === 0;
    waveZoomInBtn.disabled = waveZoomIdx === WAVE_ZOOM_LEVELS.length - 1;
    renderMainWaveBars();
    scrollWaveTrackToTime(elapsed);
  }
  waveZoomOutBtn.addEventListener('click', () => applyWaveZoom(waveZoomIdx - 1));
  waveZoomInBtn.addEventListener('click', () => applyWaveZoom(waveZoomIdx + 1));

  // ============ WAVEFORM FOLLOW-LOCK (mirrors custom_audio.html's lockBtn) ============
  // When on, the main track auto-scrolls to keep the playhead in view as
  // audio plays (useful once zoomed in past the point where the whole
  // frame fits on screen). Only turned back off by a genuine MANUAL scroll
  // (drag/swipe/wheel on the track), never by the programmatic scrollLeft
  // writes above (playback follow, zoom-change recentering).
  let waveFollowPlayhead = false;
  const waveLockBtn = document.getElementById('waveLockBtn');
  const waveLockIcon = document.getElementById('waveLockIcon');

  function setWaveFollowPlayhead(active){
    waveFollowPlayhead = active;
    waveLockBtn.classList.toggle('active', active);
    waveLockIcon.innerHTML = active
      ? '<rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/>'
      : '<rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 019.9-1"/>';
  }
  waveLockBtn.addEventListener('click', () => {
    setWaveFollowPlayhead(!waveFollowPlayhead);
    if (waveFollowPlayhead) scrollWaveTrackToTime(elapsed);
  });
  waveTrackEl.addEventListener('wheel', () => { if (waveFollowPlayhead) setWaveFollowPlayhead(false); }, { passive: true });
  waveTrackEl.addEventListener('touchmove', () => { if (waveFollowPlayhead) setWaveFollowPlayhead(false); }, { passive: true });

  // ============ LOADING AN AYAH ============
  function setControlsEnabled(enabled){
    document.querySelectorAll('.transport .t-btn, #previewBtn, #playFromStartBtn, #autoAlignBtn, #waveZoomOut, #waveZoomIn').forEach(b => b.disabled = !enabled || b.disabled === 'force');
  }

  async function loadAyah(){
    cancelAnimationFrame(rafId);
    playing = false;
    audioEl.pause();

    const entry = currentAyah();
    const saved = ayahStates[ayahIndex];
    if (saved){
      markerList = saved.markerList.map(m => ({ ...m }));
      markIdCounter = saved.markIdCounter;
      boundaryModes = (saved.boundaryModes || []).slice();
    } else {
      markerList = [];
      markIdCounter = 0;
      boundaryModes = [];
    }
    selectedMarkerId = null;
    undoStack = [];
    redoStack = [];
    updateUndoRedoButtons();
    panelOpen = false;
    elapsed = 0;
    playIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
    previewMode = false;
    lastPreviewIdx = undefined;
    setPreviewButtonsRunning(false);

    progressPill.textContent = `Ayah ${ayahIndex + 1}/${ayahs.length}`;
    prevBtn.disabled = ayahIndex === 0;
    renderDots();
    renderAudioSourceRow();

    wordCardLabel.textContent = entry.ayahNumber === 0 ? 'Bismillah' : `Ayah ${entry.ayahNumber}`;
    wordChipsEl.innerHTML = '<div class="word-card-loading">Loading recitation…</div>';
    setControlsEnabled(false);
    nextBtn.disabled = true;
    curTimeEl.textContent = '0.0s';
    totalTimeEl.textContent = '…';
    wavePlayheadEl.style.left = '0%';
    waveBarsEl.innerHTML = '';
    waveMarkersEl.innerHTML = '';

    try {
      await ensureLoaded(entry);

      if (audioEl.src) URL.revokeObjectURL(audioEl.src);
      audioEl.src = URL.createObjectURL(entry.audioBlob);
      audioEl.playbackRate = speed;
      await new Promise((resolve, reject) => {
        audioEl.addEventListener('loadedmetadata', resolve, { once: true });
        audioEl.addEventListener('error', () => reject(new Error('Audio failed to load.')), { once: true });
      });
      // entry.duration is this FRAME's own length -- for a Bismillah/ayah
      // pair sharing one file, that's just its [rangeStart, rangeEnd)
      // window, not the whole file's duration. Seek to rangeStart so
      // playback/markers for this frame start at its own beginning, not the
      // absolute start of the underlying shared file.
      const rangeStart = entry.rangeStart || 0;
      const rangeEnd = entry.rangeEnd != null ? entry.rangeEnd : audioEl.duration;
      entry.duration = rangeEnd - rangeStart;
      audioEl.currentTime = rangeStart;

      if (!entry.audioBuffer){
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        entry.audioBuffer = await audioCtx.decodeAudioData(await entry.audioBlob.arrayBuffer());
      }
    } catch (e) {
      wordChipsEl.innerHTML = `<div class="word-card-loading">${e.message}</div>`;
      return;
    }

    setControlsEnabled(true);
    totalTimeEl.textContent = `${entry.duration.toFixed(1)}s`;
    renderAudioSourceRow();  // re-render now that entry.duration is known (the earlier call above ran before it was set)
    applyWaveZoom(0);  // fresh ayah: back to 1x, same as custom_audio.html on a new load
    updatePreviewAvailability();

    renderChips();
    wordChipsEl.scrollTop = 0;  // fresh ayah: don't inherit the previous ayah's scroll offset
    renderWaveMarkers();
    updateNextButtonState();
    nextBtn.innerHTML = (ayahIndex === ayahs.length - 1)
      ? 'Done <svg viewBox="0 0 24 24" fill="none" stroke="#F6F1E4" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>'
      : 'Continue <svg viewBox="0 0 24 24" fill="none" stroke="#F6F1E4" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>';

    renderMarkPanel();
  }

  // ============ PHASE 3: audio source row (upload / crop / remove) ============
  const audioSourceText = document.getElementById('audioSourceText');
  const audioSourceActions = document.getElementById('audioSourceActions');
  const audioSourceStatus = document.getElementById('audioSourceStatus');

  function showAudioSourceStatus(message, isError){
    audioSourceStatus.textContent = message;
    audioSourceStatus.style.display = message ? 'block' : 'none';
    audioSourceStatus.classList.toggle('error', !!isError);
  }

  function renderAudioSourceRow(){
    const entry = currentAyah();
    const custom = customAudioByRealAyah[entry.realAyah];
    showAudioSourceStatus('', false);

    if (editOnlyMode){
      // Audio can't be changed once a video is complete -- only the word
      // timing marked against it. Show what's playing, no actions.
      if (custom){
        const cropped = custom.cropStart > 0 || custom.cropEnd != null;
        const shownDuration = entry.duration;
        audioSourceText.textContent = `Your recording${shownDuration != null ? ` — ${shownDuration.toFixed(1)}s` : ''}${cropped ? ' (cropped)' : ''}`;
      } else if (draft.hasReciter){
        const reciterLabel = reciterNames[draft.reciterKey] || draft.reciterKey;
        audioSourceText.textContent = `Reciter — ${reciterLabel}`;
      } else {
        audioSourceText.textContent = 'No audio uploaded';
      }
      audioSourceActions.innerHTML = '';
      return;
    }

    if (custom){
      const cropped = custom.cropStart > 0 || custom.cropEnd != null;
      const shownDuration = entry.duration != null ? entry.duration : custom.duration;
      const fromRange = rangeAudioInfo && custom.filename === rangeAudioInfo.filename;
      const sourceLabel = fromRange ? 'From full recording' : 'Your recording';
      audioSourceText.textContent = `${sourceLabel} — ${shownDuration.toFixed(1)}s${cropped ? ' (cropped)' : ''}`;
      audioSourceActions.innerHTML = `
        <button class="as-btn" id="asCropBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2v14a2 2 0 002 2h14"/><path d="M18 22V8a2 2 0 00-2-2H2"/></svg>
          Crop
        </button>
        <button class="as-btn danger" id="asRemoveBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V5a1 1 0 011-1h4a1 1 0 011 1v2m2 0v13a1 1 0 01-1 1H8a1 1 0 01-1-1V7h10z"/></svg>
          Remove
        </button>
      `;
      document.getElementById('asCropBtn').addEventListener('click', () => openCropModal(entry.realAyah));
      document.getElementById('asRemoveBtn').addEventListener('click', () => removeCustomAudio(entry.realAyah));
    } else if (draft.hasReciter){
      const reciterLabel = reciterNames[draft.reciterKey] || draft.reciterKey;
      audioSourceText.textContent = `Reciter — ${reciterLabel}`;
      audioSourceActions.innerHTML = '';
    } else {
      audioSourceText.textContent = 'No audio uploaded';
      audioSourceActions.innerHTML = '';
    }
  }

  async function removeCustomAudio(realAyah){
    if (!confirm('Remove your uploaded audio and use the reciter recording instead? Any word markers for this ayah will be cleared.')) return;
    showAudioSourceStatus('Removing…', false);
    try {
      await fetch(`/api/timing/upload-audio?sessionId=${encodeURIComponent(sessionId)}&ayah=${realAyah}`, { method: 'DELETE' });
    } catch (e) { /* best-effort -- fall through and clear local state regardless */ }
    delete customAudioByRealAyah[realAyah];
    invalidateEntriesForRealAyah(realAyah);
    if (currentAyah().realAyah === realAyah) await loadAyah();
    else renderAudioSourceRow();
    persistSession();
  }

  // ============ PHASE 3: crop modal ============
  const cropOverlay = document.getElementById('cropOverlay');
  const cropBody = document.getElementById('cropBody');
  const cropApplyBtn = document.getElementById('cropApplyBtn');
  const cropCancelBtn = document.getElementById('cropCancelBtn');
  const CROP_MIN_WINDOW = 0.2;  // seconds -- smallest allowed crop window

  let cropState = null;  // { realAyah, rawDuration, rawBuffer, start, end }

  function cropPctFromTime(t){ return (t / cropState.rawDuration) * 100; }

  function renderCropUI(){
    const trackEl = document.getElementById('cropTrack');
    const startMask = document.getElementById('cropMaskStart');
    const endMask = document.getElementById('cropMaskEnd');
    const startHandle = document.getElementById('cropHandleStart');
    const endHandle = document.getElementById('cropHandleEnd');
    const startPct = cropPctFromTime(cropState.start);
    const endPct = cropPctFromTime(cropState.end);
    startMask.style.left = '0%';
    startMask.style.width = startPct + '%';
    endMask.style.left = endPct + '%';
    endMask.style.width = (100 - endPct) + '%';
    startHandle.style.left = startPct + '%';
    endHandle.style.left = endPct + '%';
    document.getElementById('cropStartLabel').textContent = cropState.start.toFixed(2) + 's';
    document.getElementById('cropEndLabel').textContent = cropState.end.toFixed(2) + 's';
    cropApplyBtn.disabled = false;
  }

  function attachCropDrag(handleEl, which){
    handleEl.addEventListener('pointerdown', (e) => {
      handleEl.setPointerCapture(e.pointerId);
      const trackEl = document.getElementById('cropTrack');
      const onMove = (ev) => {
        const rect = trackEl.getBoundingClientRect();
        const pct = Math.max(0, Math.min(1, (ev.clientX - rect.left) / rect.width));
        const t = pct * cropState.rawDuration;
        if (which === 'start'){
          cropState.start = Math.max(0, Math.min(t, cropState.end - CROP_MIN_WINDOW));
        } else {
          cropState.end = Math.min(cropState.rawDuration, Math.max(t, cropState.start + CROP_MIN_WINDOW));
        }
        renderCropUI();
      };
      const onUp = () => {
        window.removeEventListener('pointermove', onMove);
        window.removeEventListener('pointerup', onUp);
      };
      window.addEventListener('pointermove', onMove);
      window.addEventListener('pointerup', onUp);
    });
  }

  async function openCropModal(realAyah){
    cropOverlay.classList.add('open');
    cropApplyBtn.disabled = true;
    cropBody.innerHTML = '<div class="crop-loading">Loading your recording…</div>';

    try {
      // The RAW upload, never a crop window -- this modal is where the crop
      // window itself gets (re-)defined, so it always starts from the full
      // file regardless of any previously-committed crop.
      const res = await fetch(`/api/timing/audio?surah=${draft.surah}&ayah=${realAyah}&reciter=${draft.reciterKey}&sessionId=${encodeURIComponent(sessionId)}`);
      if (!res.ok) throw new Error("Couldn't load your recording.");
      const blob = await res.blob();
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const rawBuffer = await audioCtx.decodeAudioData(await blob.arrayBuffer());

      const existing = customAudioByRealAyah[realAyah];
      cropState = {
        realAyah,
        rawDuration: rawBuffer.duration,
        start: existing && existing.cropStart ? existing.cropStart : 0,
        end: existing && existing.cropEnd != null ? existing.cropEnd : rawBuffer.duration,
      };

      cropBody.innerHTML = `
        <div class="crop-track" id="cropTrack">
          <div class="crop-bars" id="cropBars"></div>
          <div class="crop-mask" id="cropMaskStart"></div>
          <div class="crop-mask" id="cropMaskEnd"></div>
          <div class="crop-handle" id="cropHandleStart"></div>
          <div class="crop-handle" id="cropHandleEnd"></div>
        </div>
        <div class="crop-times">
          <span id="cropStartLabel">0.00s</span>
          <span id="cropEndLabel">0.00s</span>
        </div>
        <div class="crop-snap-row" id="cropSnapRow" style="display:none;">
          <button class="crop-snap-btn" id="cropSnapStartBtn" type="button">Snap start to mark</button>
          <button class="crop-snap-btn" id="cropSnapEndBtn" type="button">Snap end to mark</button>
        </div>
      `;
      buildBarsFromBuffer(rawBuffer, 60, 0, rawBuffer.duration, document.getElementById('cropBars'), 'crop-bar');
      attachCropDrag(document.getElementById('cropHandleStart'), 'start');
      attachCropDrag(document.getElementById('cropHandleEnd'), 'end');
      renderCropUI();

      // Word marks (if this ayah has any) are timed against the CURRENTLY
      // cropped audio, not this modal's raw file -- shift by the existing
      // crop's start to land on the same real-world instant. Only offered
      // when marking this ayah is what the crop applies to (always true
      // today: openCropModal() is only ever called for the ayah on screen).
      if (realAyah === currentAyah().realAyah && markerList.length){
        const rawOffset = existing && existing.cropStart ? existing.cropStart : 0;
        const markerRawTime = (m) => rawOffset + m.time;
        document.getElementById('cropSnapRow').style.display = 'flex';
        document.getElementById('cropSnapStartBtn').addEventListener('click', () => {
          const sorted = [...markerList].sort((a, b) => a.time - b.time);
          const m = sorted.find(mk => mk.id === selectedMarkerId) || sorted[0];
          cropState.start = Math.max(0, Math.min(markerRawTime(m), cropState.end - CROP_MIN_WINDOW));
          renderCropUI();
        });
        document.getElementById('cropSnapEndBtn').addEventListener('click', () => {
          const sorted = [...markerList].sort((a, b) => a.time - b.time);
          const m = sorted.find(mk => mk.id === selectedMarkerId) || sorted[sorted.length - 1];
          cropState.end = Math.min(cropState.rawDuration, Math.max(markerRawTime(m), cropState.start + CROP_MIN_WINDOW));
          renderCropUI();
        });
      }
    } catch (e) {
      cropBody.innerHTML = `<div class="crop-loading">${e.message}</div>`;
    }
  }

  function closeCropModal(){
    cropOverlay.classList.remove('open');
    cropState = null;
  }

  cropCancelBtn.addEventListener('click', closeCropModal);

  cropApplyBtn.addEventListener('click', async () => {
    if (!cropState) return;
    const { realAyah, start, end } = cropState;
    const existing = customAudioByRealAyah[realAyah];
    customAudioByRealAyah[realAyah] = {
      filename: existing.filename,
      duration: existing.duration,
      cropStart: start,
      cropEnd: end >= cropState.rawDuration - 0.01 ? null : end,
    };
    invalidateEntriesForRealAyah(realAyah);
    closeCropModal();
    // See the upload handler's comment: loadAyah() must run before
    // persistSession() so it doesn't re-save the pre-crop marker list.
    if (currentAyah().realAyah === realAyah) await loadAyah();
    else renderAudioSourceRow();
    persistSession();
  });

  function renderDots(){
    ayahDotsEl.innerHTML = ayahs.map((_, i) => {
      let cls = 'ayah-dot';
      if (i < ayahIndex) cls += ' done';
      else if (i === ayahIndex) cls += ' current';
      return `<button class="ayah-dot-hit" data-i="${i}" aria-label="Go to ayah ${i + 1}"><span class="${cls}"></span></button>`;
    }).join('');
  }

  function updateNextButtonState(){
    const entry = currentAyah();
    const covered = new Set(markerList.map(m => m.wordIndex));
    nextBtn.disabled = covered.size !== computeChipGroups(entry, boundaryModes).length;
  }

  function saveCurrentAyahState(){
    const entry = currentAyah();
    const covered = new Set(markerList.map(m => m.wordIndex));
    ayahStates[ayahIndex] = {
      markerList: markerList.map(m => ({ ...m })),
      markIdCounter,
      boundaryModes: boundaryModes.slice(),
      complete: entry.words && covered.size === computeChipGroups(entry, boundaryModes).length,
    };
  }

  // ============ SESSION PERSISTENCE (resume after closing the browser mid-ayah) ============
  // Keyed to the draft's identifying fields, not the draft object as a whole, so
  // switching only the theme (regenerate-with-new-theme) doesn't discard progress,
  // but picking a different surah/range/reciter/translation correctly starts fresh.
  const SESSION_KEY = 'afs_timing_session';
  function sessionKeyFor(d){ return [d.surah, d.from, d.to, d.reciterKey, d.translation].join('|'); }

  function persistSession(){
    saveCurrentAyahState();
    localStorage.setItem(SESSION_KEY, JSON.stringify({
      key: sessionKeyFor(draft), ayahIndex, ayahStates, customAudioByRealAyah, rangeAudioInfo,
    }));
    const completeCount = ayahStates.filter(s => s && s.complete).length;
    console.log(`[timing] local draft saved -- ayah ${ayahIndex + 1}/${ayahs.length}, ${completeCount}/${ayahStates.length} ayah(s) marked complete`);
    scheduleServerAutosave();
  }

  function loadSavedSession(){
    let saved;
    try { saved = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null'); }
    catch (e) { return null; }
    if (!saved || saved.key !== sessionKeyFor(draft)) return null;
    return saved;
  }

  function clearSavedSession(){ localStorage.removeItem(SESSION_KEY); }

  // ============ SERVER AUTOSAVE (don't rely on the browser-only local
  // draft above to survive an exit -- push progress to the session on the
  // server too, so closing the tab, hitting the browser/OS back button, or
  // switching devices mid-marking doesn't leave the server's copy stale or
  // empty until the very end). Skipped in editOnlyMode: that session is
  // locked server-side, a plain PUT would 409 -- Done's own POST
  // /api/generate is the only write path allowed there. ============
  let serverAutosaveTimer = null;
  function scheduleServerAutosave(){
    if (editOnlyMode || !draft) return;
    clearTimeout(serverAutosaveTimer);
    serverAutosaveTimer = setTimeout(runServerAutosave, 800);
  }
  function runServerAutosave(){
    if (editOnlyMode || !draft) return;
    const manifest = buildManifest();
    const customAudioManifest = buildCustomAudioManifest();
    const timing = Object.keys(manifest.ayahs).length ? manifest : undefined;
    const customAudio = Object.keys(customAudioManifest.ayahs).length ? customAudioManifest : undefined;
    fetch(`/api/sessions/${encodeURIComponent(draft.id)}`, {
      method: 'PUT', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ timing, customAudio }),
      keepalive: true,  // lets this complete even if the tab is closing/navigating right now
    }).then(res => {
      console.log(`[timing] server autosave -- ${res.ok ? 'ok' : 'FAILED (' + res.status + ')'}, ${Object.keys(manifest.ayahs).length}/${ayahStates.length} ayah(s) sent`);
    }).catch(e => console.warn('[timing] server autosave error:', e));
  }
  // Final best-effort flush the instant the page is actually leaving --
  // 'pagehide' fires for both an in-app navigation (location.href=...) and
  // closing the tab/browser, unlike 'beforeunload' which some browsers
  // don't reliably fire for the former. keepalive on the fetch above is
  // what lets this request still land after the page has already unloaded.
  window.addEventListener('pagehide', () => {
    clearTimeout(serverAutosaveTimer);
    runServerAutosave();
  });

  // When there are more words than fit, `align-content:center` (used to keep
  // short ayahs looking nice) centers the wrapped rows by pushing overflow
  // equally above *and* below the container -- but scrollTop can never go
  // negative, so that top overflow becomes permanently unreachable no matter
  // how far the user scrolls. Switch to top-aligned wrapping whenever the
  // content is actually taller than the visible card, so every word stays
  // reachable; keep centering only when everything already fits.
  function updateWordChipsOverflow(){
    wordChipsEl.classList.toggle('overflowing', wordChipsEl.scrollHeight > wordChipsEl.clientHeight + 1);
  }
  // Android address-bar show/hide and the Amiri webfont swapping in both
  // resize the card after the initial render -- re-check then too.
  window.addEventListener('resize', updateWordChipsOverflow);
  window.addEventListener('orientationchange', updateWordChipsOverflow);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(updateWordChipsOverflow);

  function renderBoundaryHandle(rawIndex, mode){
    // No text content -- the dot/⊕/break-ticks are all drawn via CSS
    // (::before/::after) so their size is controlled in one place (see the
    // .word-boundary rules) instead of depending on font rendering of a
    // tiny glyph like "·".
    const cls = 'word-boundary' + (mode ? ` ${mode}` : '');
    const aria = mode === 'break' ? 'A new frame starts here -- tap to merge these words instead'
      : mode === 'merge' ? 'These words are merged as one beat -- tap to undo'
      : 'Tap to start a new frame here, or merge these two words';
    return `<button type="button" class="${cls}" data-boundary="${rawIndex}" aria-label="${aria}"></button>`;
  }

  function renderChips(){
    const entry = currentAyah();
    wordChipsEl.classList.toggle('previewing', previewMode);
    const groups = computeChipGroups(entry, boundaryModes);

    if (previewMode){
      const curIdx = getPreviewCurrentWordIndex(elapsed);
      lastPreviewIdx = curIdx;
      wordChipsEl.innerHTML = groups.map(g => {
        const cls = 'word-chip' + (g[0] === curIdx ? ' preview-current' : '');
        return `<div class="${cls}" data-i="${g[0]}">${g.map(i => entry.words[i]).join(' ')}</div>`;
      }).join('');
      updateWordChipsOverflow();
      return;
    }

    const selectedMarker = markerList.find(m => m.id === selectedMarkerId);

    // Every raw gap gets exactly one boundary handle -- INSIDE a chip
    // (always 'merge' there, since that's the only way two raw words share
    // one chip) or BETWEEN two chips ('break' or default). Rendering the
    // 'merge' ones inline, not just the ones between chips, is what keeps a
    // merge always clickable again -- otherwise, once two words merged into
    // one chip, there'd be no handle left in the DOM to un-merge them.
    let html = '';
    groups.forEach((g, gi) => {
      const lead = g[0];
      const wordMarkers = markerList.filter(m => m.wordIndex === lead);
      let cls = 'word-chip';
      if (wordMarkers.length) cls += ' marked';
      if (selectedMarker && selectedMarker.wordIndex === lead) cls += ' selected';
      const orderLabel = wordMarkers.map(m => markerList.indexOf(m) + 1).join(',');
      const orderAttr = wordMarkers.length ? ` data-order="${orderLabel}"` : '';

      let inner = '';
      g.forEach((wi, k) => {
        if (k > 0) inner += renderBoundaryHandle(g[k - 1], 'merge');
        inner += `<span class="word-chip-word">${entry.words[wi]}</span>`;
      });

      html += `<div class="${cls}" data-i="${lead}"${orderAttr}>${inner}</div>`;
      if (gi < groups.length - 1){
        const boundaryIdx = g[g.length - 1];  // gap right after this chip's last raw word
        html += renderBoundaryHandle(boundaryIdx, boundaryModes[boundaryIdx] || null);
      }
    });
    wordChipsEl.innerHTML = html;
    updateWordChipsOverflow();
  }

  // Cycles the boundary between raw words rawIndex/rawIndex+1: null -> break
  // -> merge -> null. 'break' never changes which raw words share a chip
  // (only frame grouping), so the common case -- tap once to drop a frame
  // separator here -- never touches markerList. Only entering/leaving
  // 'merge' can change chip grouping -- when that happens, any marker whose
  // chip no longer exists in the new grouping is dropped (the user re-marks
  // that chip fresh) rather than guessing which of the old markers' times
  // should survive on the new, differently-shaped chip. Putting 'merge'
  // second (not first) means a plain frame-separator tap never risks losing
  // an already-placed mark on the way there.
  function toggleBoundary(rawIndex){
    const entry = currentAyah();
    pushUndoSnapshot();
    const cur = boundaryModes[rawIndex] || null;
    boundaryModes[rawIndex] = cur === null ? 'break' : cur === 'break' ? 'merge' : null;
    console.log(`[timing] toggleBoundary(${rawIndex}): ${cur || 'none'} -> ${boundaryModes[rawIndex] || 'none'}`);

    const validLeads = new Set(computeChipGroups(entry, boundaryModes).map(g => g[0]));
    const beforeCount = markerList.length;
    markerList = markerList.filter(m => validLeads.has(m.wordIndex));
    if (markerList.length !== beforeCount){
      console.log(`[timing] toggleBoundary(${rawIndex}): dropped ${beforeCount - markerList.length} marker(s) whose chip no longer exists`);
    }
    if (selectedMarkerId && !markerList.some(m => m.id === selectedMarkerId)) selectedMarkerId = null;

    updateNextButtonState();
    updatePreviewAvailability();
    renderChips();
    renderWaveMarkers();
    renderMarkPanel();
    persistSession();
  }

  function getPreviewCurrentMarker(t){
    let current = null;
    let bestTime = -Infinity;
    for (const m of markerList){
      if (m.time <= t && m.time > bestTime){
        bestTime = m.time;
        current = m;
      }
    }
    return current;
  }

  function getPreviewCurrentWordIndex(t){
    const m = getPreviewCurrentMarker(t);
    return m ? m.wordIndex : null;
  }

  function updatePreviewHighlight(){
    if (!previewMode) return;
    const idx = getPreviewCurrentWordIndex(elapsed);
    if (idx === lastPreviewIdx) return;
    lastPreviewIdx = idx;
    const chips = wordChipsEl.querySelectorAll('.word-chip');
    chips.forEach(chip => chip.classList.toggle('preview-current', Number(chip.dataset.i) === idx));
  }

  function renderWaveMarkers(){
    const entry = currentAyah();
    waveMarkersEl.innerHTML = markerList.map(m => {
      const pct = (m.time / entry.duration) * 100;
      const sel = m.id === selectedMarkerId ? ' sel' : '';
      return `<div class="wave-marker${sel}" style="left:${pct}%"></div>`;
    }).join('');
    renderFrameDividers();
  }

  // A frame divider sits at the time of the earliest mark inside each frame
  // after the first -- i.e. where playback actually crosses from one
  // displayed frame into the next (see computeFrameGroups()). A frame with
  // no marks yet (still being worked on) simply has no divider until it does.
  function renderFrameDividers(){
    const entry = currentAyah();
    const frameRanges = computeFrameGroups(entry, boundaryModes);
    const sortedMarks = [...markerList].sort((a, b) => a.time - b.time);
    const dividerTimes = [];
    for (let fi = 1; fi < frameRanges.length; fi++){
      const range = frameRanges[fi];
      const firstMark = sortedMarks.find(m => m.wordIndex >= range.start && m.wordIndex < range.end);
      if (firstMark) dividerTimes.push(firstMark.time);
    }
    document.getElementById('frameDividers').innerHTML = dividerTimes.map(t => {
      const pct = (t / entry.duration) * 100;
      return `<div class="frame-divider" style="left:${pct}%"></div>`;
    }).join('');
  }

  function selectRelativeMarker(dir){
    if (!markerList.length) return;
    const pos = markerList.findIndex(m => m.id === selectedMarkerId);
    if (pos === -1){
      // Nothing selected yet -- pick a marked word to start from, in time
      // order (not creation order) so "next"/"prev" land somewhere
      // predictable regardless of the order the marks were placed in.
      const sortedByTime = [...markerList].sort((a, b) => a.time - b.time);
      selectedMarkerId = dir > 0 ? sortedByTime[0].id : sortedByTime[sortedByTime.length - 1].id;
    } else {
      const next = (pos + dir + markerList.length) % markerList.length;
      selectedMarkerId = markerList[next].id;
    }
    renderChips();
    renderWaveMarkers();
    renderMarkPanel();
  }

  function updateMarkPanelBodyClass(){
    document.body.classList.toggle('mark-panel-open', panelOpen && markerList.length > 0);
    // toggling this class resizes .word-card (the transport controls hide/show),
    // which can flip whether the chips actually overflow -- re-measure.
    updateWordChipsOverflow();
  }

  function renderMarkPanel(){
    const entry = currentAyah();
    clearAllBtn.disabled = markerList.length === 0;
    clearFrameSeparatorsBtn.disabled = !boundaryModes.some(m => m === 'break');
    trimEdgeWordsBtn.disabled = !canTrimEdgeWords();
    markersToggleBtn.disabled = markerList.length === 0;
    markersToggleBtn.classList.toggle('on', panelOpen);
    if (markerList.length) markersToggleBtn.dataset.badge = markerList.length;
    else delete markersToggleBtn.dataset.badge;
    markersToggleBtn.setAttribute('aria-label', markerList.length ? `Markers · ${markerList.length}` : 'Markers');

    updateMarkPanelBodyClass();

    if (!panelOpen || !markerList.length){
      markPanelEl.innerHTML = '';
      return;
    }

    const selectedPos = markerList.findIndex(m => m.id === selectedMarkerId);
    const hasSelection = selectedPos !== -1;

    // nav row (prev/next marker + count) now renders at the BOTTOM of the panel
    const navRow = `
      <div class="mp-nav-row${hasSelection ? ' mp-nav-row--bottom' : ''}">
        <button class="mp-navbtn" id="mpPrevBtn" aria-label="Go to previous marker">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
          Prev
        </button>
        <span class="mp-nav-count">${hasSelection ? `${selectedPos + 1} of ${markerList.length}` : `${markerList.length} marker${markerList.length === 1 ? '' : 's'}`}</span>
        <button class="mp-navbtn" id="mpNextBtn" aria-label="Go to next marker">
          Next
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        </button>
      </div>
    `;

    let html = '';

    if (hasSelection){
      const m = markerList[selectedPos];
      const word = chipGroupForLead(entry, boundaryModes, m.wordIndex).map(i => entry.words[i]).join(' ');
      html += `
        <div class="mp-adjust-head">
          <div class="mp-word">
            <div class="mp-order-badge">${selectedPos + 1}</div>
            <div>
              <div class="mp-word-ar">${word}</div>
              <div class="mp-word-time">marked at ${m.time.toFixed(2)}s</div>
            </div>
          </div>
          <button class="mp-unmark" id="mpUnmarkBtn" aria-label="Clear this mark">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V5a1 1 0 011-1h4a1 1 0 011 1v2m2 0v13a1 1 0 01-1 1H8a1 1 0 01-1-1V7h10z"/></svg>
          </button>
        </div>
        <div class="mp-nudge-row">
          <button class="mp-nudge" id="mpNudgeBack">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
            0.1s
          </button>
          <button class="mp-playfrom" id="mpPlayFrom" aria-label="Play from this mark">
            <svg viewBox="0 0 24 24" fill="#F6F1E4"><path d="M8 5v14l11-7z"/></svg>
          </button>
          <button class="mp-nudge" id="mpNudgeFwd">
            0.1s
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
          </button>
        </div>
      `;
    }

    html += navRow;

    markPanelEl.innerHTML = html;

    document.getElementById('mpPrevBtn').addEventListener('click', () => selectRelativeMarker(-1));
    document.getElementById('mpNextBtn').addEventListener('click', () => selectRelativeMarker(1));

    if (hasSelection){
      const m = markerList[selectedPos];
      document.getElementById('mpUnmarkBtn').addEventListener('click', () => unmarkMarker(m.id));
      document.getElementById('mpNudgeBack').addEventListener('click', () => nudgeMarker(m.id, -0.1));
      document.getElementById('mpNudgeFwd').addEventListener('click', () => nudgeMarker(m.id, 0.1));
      document.getElementById('mpPlayFrom').addEventListener('click', () => playFrom(m.time));
    }
  }

  function addMarker(i, time){
    pushUndoSnapshot();
    const entry = currentAyah();
    const t = Math.max(0, Math.min(time, entry.duration));
    const id = ++markIdCounter;
    markerList.push({ id, wordIndex: i, time: t });
    selectedMarkerId = id;

    updateNextButtonState();
    updatePreviewAvailability();

    if (!playing){
      if (elapsed >= entry.duration) seekTo(0);
      startPlayback();
    }

    renderChips();
    renderWaveMarkers();
    renderMarkPanel();
    persistSession();
  }

  function unmarkMarker(id){
    const idx = markerList.findIndex(m => m.id === id);
    if (idx === -1) return;
    pushUndoSnapshot();
    markerList.splice(idx, 1);
    selectedMarkerId = null;
    updateNextButtonState();
    updatePreviewAvailability();
    renderChips();
    renderWaveMarkers();
    renderMarkPanel();
    persistSession();
  }

  function nudgeMarker(id, delta){
    const m = markerList.find(mk => mk.id === id);
    if (!m) return;
    pushUndoSnapshot();
    const entry = currentAyah();
    m.time = Math.max(0, Math.min(m.time + delta, entry.duration));
    seekTo(m.time);
    renderChips();
    renderWaveMarkers();
    renderMarkPanel();
    persistSession();
  }

  function playFrom(t){
    seekTo(t);
    if (!playing) startPlayback();
  }

  function updatePreviewAvailability(){
    previewBtn.disabled = markerList.length === 0;
  }

  function enterPreview(){
    if (previewBtn.disabled) return;

    // Start from the mark *before* the currently selected word, if any, so
    // preview plays into the selected word rather than jumping straight to
    // it. If there's no earlier mark (selected word is the first one) or
    // nothing is selected, fall back to the earliest-timed mark.
    const sortedByTime = [...markerList].sort((a, b) => a.time - b.time);
    const selectedPos = sortedByTime.findIndex(m => m.id === selectedMarkerId);
    const startMarker = selectedPos > 0 ? sortedByTime[selectedPos - 1] : sortedByTime[0];
    const startTime = startMarker?.time ?? 0;

    previewMode = true;
    selectedMarkerId = null;
    lastPreviewIdx = undefined;

    setPreviewButtonsRunning(true);

    panelOpen = false;
    markPanelEl.innerHTML = '';
    markersToggleBtn.classList.remove('on');
    updateMarkPanelBodyClass();
    renderChips();
    renderWaveMarkers();

    seekTo(startTime);
    startPlayback();
  }

  // Always plays from the very first word of the ayah, ignoring whatever
  // word is currently selected (or whether anything is selected/marked at
  // all) -- unlike enterPreview() above, this never needs a mark to exist.
  function enterPreviewFromStart(){
    previewMode = true;
    selectedMarkerId = null;
    lastPreviewIdx = undefined;

    setPreviewButtonsRunning(true);

    panelOpen = false;
    markPanelEl.innerHTML = '';
    markersToggleBtn.classList.remove('on');
    updateMarkPanelBodyClass();
    renderChips();
    renderWaveMarkers();

    seekTo(0);
    startPlayback();
  }

  function exitPreview(){
    previewMode = false;
    lastPreviewIdx = undefined;

    setPreviewButtonsRunning(false);

    stopPlayback();
    renderChips();
    renderWaveMarkers();
    renderMarkPanel();
  }

  previewBtn.addEventListener('click', () => previewMode ? exitPreview() : enterPreview());
  playFromStartBtn.addEventListener('click', () => previewMode ? exitPreview() : enterPreviewFromStart());

  // Auto-detects a start time for every word via /api/timing/auto-align
  // (faster-whisper word timestamps fuzzy-matched against this ayah's own
  // text -- see quran_lib/recognize.py's align_words_to_audio()), then
  // replaces the whole markerList with one mark per CHIP (a merged pair of
  // words counts as one chip, so it gets exactly one mark, at its first
  // word's detected time -- same rule a hand-placed mark follows). Also
  // applies suggested merges (words recited too fast to tell apart from
  // the next one -- never more than two words at a time) to
  // boundaryModes, without touching boundaries the user already set.
  async function runAutoAlign(){
    if (autoAlignBtn.disabled) return;
    const entry = currentAyah();
    if (!entry || !entry.words || !entry.words.length) return;
    if (previewMode) exitPreview();
    if (playing) stopPlayback();

    autoAlignBtn.disabled = true;
    autoAlignBtn.classList.add('busy');
    try {
      const params = new URLSearchParams({
        surah: String(draft.surah),
        ayah: String(entry.realAyah),
        reciter: draft.reciterKey,
      });
      const res = await fetch(`/api/timing/auto-align?${params.toString()}${audioSourceParams(entry.realAyah)}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          words: entry.words,
          rangeStart: entry.rangeStart || 0,
          rangeEnd: entry.rangeEnd,
        }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Couldn't auto-detect word timing.");

      pushUndoSnapshot();

      // Apply suggested merges first -- never overrides a boundary the
      // user already set by hand.
      (data.merges || []).forEach(i => {
        if (!boundaryModes[i]) boundaryModes[i] = 'merge';
      });

      const chipGroups = computeChipGroups(entry, boundaryModes);
      markIdCounter = 0;
      markerList = chipGroups.map(g => {
        const lead = g[0];
        const t = Math.max(0, Math.min(data.times[lead] ?? 0, entry.duration));
        return { id: ++markIdCounter, wordIndex: lead, time: t };
      });
      selectedMarkerId = null;

      updateNextButtonState();
      updatePreviewAvailability();
      renderChips();
      renderWaveMarkers();
      renderMarkPanel();
      persistSession();
    } catch (e) {
      alert(e.message || "Couldn't auto-detect word timing.");
    } finally {
      autoAlignBtn.disabled = false;
      autoAlignBtn.classList.remove('busy');
    }
  }

  autoAlignBtn.addEventListener('click', runAutoAlign);

  function clearAllMarks(){
    if (!markerList.length) return;
    if (previewMode) exitPreview();
    pushUndoSnapshot();
    markerList = [];
    markIdCounter = 0;
