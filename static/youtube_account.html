<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F1E4">
<title>YouTube Account — Ayah Frame Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Manrope:wght@400;500;600;700;800&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>

  :root{
    --bg:#F6F1E4;
    --surface:#FFFDF6;
    --surface-2:#ECE3CC;
    --ink:#14183A;
    --ink-mute:#6C7094;
    --gold:#AD8226;
    --line:rgba(20,24,58,.14);
    --danger:#B23B3B;
    --success:#2F8F6A;
    --yt:#FF0000;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; }
  body{
    background:
      radial-gradient(120% 45% at 50% -8%, rgba(173,130,38,.09), transparent 60%),
      var(--bg);
    color:var(--ink);
    font-family:'Manrope', sans-serif;
    min-height:100dvh;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:none;
  }
  button, a{ font-family:inherit; }

  .screen{
    min-height:100dvh;
    display:flex; flex-direction:column; align-items:center;
    max-width:480px; margin:0 auto;
    padding:20px 20px 40px;
    padding-top:calc(env(safe-area-inset-top,0px) + 20px);
  }

  .topbar{ width:100%; display:flex; align-items:center; gap:12px; margin-bottom:20px; }
  .topbar-btn{
    width:38px; height:38px; border-radius:50%; border:none; cursor:pointer;
    background:var(--surface); box-shadow:0 2px 6px rgba(20,24,58,.08); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; color:var(--ink); flex-shrink:0;
    text-decoration:none;
  }
  .topbar-btn:active{ transform:scale(.93); }
  .topbar-btn svg{ width:16px; height:16px; }
  .topbar-title{ font-family:'Fraunces', serif; font-weight:600; font-size:17px; }

  #content{ width:100%; }

  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:18px;
    box-shadow:0 2px 6px rgba(20,24,58,.05);
  }

  .test-mode-banner{
    display:flex; align-items:flex-start; gap:10px; width:100%;
    background:rgba(173,130,38,.1); border:1px solid rgba(173,130,38,.25);
    border-radius:14px; padding:12px 14px; margin-bottom:18px;
    font-size:12px; font-weight:600; color:#7A5C1B; line-height:1.5;
  }
  .test-mode-banner svg{ width:15px; height:15px; flex-shrink:0; margin-top:1px; color:var(--gold); }

  /* ---------- not-connected state ---------- */
  .connect-hero{ display:flex; flex-direction:column; align-items:center; text-align:center; padding:36px 8px 8px; }
  .connect-icon{
    width:72px; height:72px; border-radius:50%; background:var(--yt); color:#fff;
    display:flex; align-items:center; justify-content:center; margin-bottom:20px;
    box-shadow:0 16px 30px -14px rgba(255,0,0,.45);
  }
  .connect-icon svg{ width:32px; height:32px; }
  .connect-title{ font-family:'Fraunces', serif; font-weight:600; font-size:19px; margin-bottom:8px; }
  .connect-sub{ font-size:12.5px; color:var(--ink-mute); line-height:1.6; max-width:30ch; margin-bottom:28px; }

  .connect-btn{
    width:100%; height:52px; border-radius:15px; border:none; cursor:pointer;
    background:var(--yt); color:#fff; font-weight:800; font-size:13.5px;
    display:flex; align-items:center; justify-content:center; gap:9px;
    box-shadow:0 16px 28px -16px rgba(255,0,0,.45);
  }
  .connect-btn:active{ transform:scale(.98); }
  .connect-btn:disabled{ opacity:.7; pointer-events:none; }
  .connect-btn svg{ width:16px; height:16px; flex-shrink:0; }
  .connect-btn .spinner{ animation:spin 1s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .connect-fineprint{
    font-size:11px; color:var(--ink-mute); text-align:center; line-height:1.6; margin-top:14px; max-width:32ch;
  }

  /* ---------- connected state ---------- */
  .profile-card{ display:flex; align-items:center; gap:12px; padding:16px; margin-bottom:20px; }
  .profile-avatar{
    width:46px; height:46px; border-radius:50%; background:var(--yt); color:#fff;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
    font-weight:800; font-size:15px;
  }
  .profile-avatar img{ width:100%; height:100%; border-radius:50%; object-fit:cover; }
  .profile-info{ flex:1; min-width:0; }
  .profile-name{ font-weight:800; font-size:14.5px; }
  .profile-handle{ font-size:11.5px; color:var(--ink-mute); font-weight:600; margin-top:1px; }
  .profile-badge{
    flex-shrink:0; display:flex; align-items:center; gap:5px;
    background:rgba(47,143,106,.14); color:var(--success); font-weight:800; font-size:10.5px;
    padding:5px 9px; border-radius:100px;
  }
  .profile-badge svg{ width:10px; height:10px; }

  .section-label{
    font-size:10.5px; font-weight:800; letter-spacing:1px; text-transform:uppercase;
    color:var(--ink-mute); margin:0 2px 10px;
  }

  .channel-row{
    display:flex; align-items:center; gap:12px; padding:12px 14px; margin-bottom:24px;
  }
  .channel-row-avatar{
    width:38px; height:38px; border-radius:50%; color:#fff; font-weight:800; font-size:13.5px;
    display:flex; align-items:center; justify-content:center; flex-shrink:0; background:var(--yt);
  }
  .channel-row-text{ flex:1; min-width:0; }
  .channel-row-name{ font-weight:800; font-size:13.5px; }
  .channel-row-sub{ font-size:11px; color:var(--ink-mute); font-weight:600; margin-top:1px; }

  .disconnect-btn{
    width:100%; height:50px; border-radius:14px; border:none; cursor:pointer;
    background:var(--surface-2); color:var(--danger); font-weight:800; font-size:13px;
  }
  .disconnect-btn:active{ transform:scale(.98); }

  /* ---------- confirm dialog ---------- */
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(20,24,58,.45); backdrop-filter:blur(2px);
    opacity:0; pointer-events:none; transition:opacity .18s ease; z-index:40;
  }
  .modal-backdrop.open{ opacity:1; pointer-events:auto; }
  .confirm-modal{
    position:fixed; left:50%; top:50%; z-index:41;
    width:calc(100% - 64px); max-width:320px;
    background:var(--bg); border:1px solid var(--line); border-radius:20px;
    padding:22px 20px 18px; box-shadow:0 24px 60px -20px rgba(20,24,58,.45);
    opacity:0; pointer-events:none;
    transform:translate(-50%,-50%) scale(.92);
    transition:opacity .18s ease, transform .18s cubic-bezier(.32,.72,0,1);
  }
  .confirm-modal.open{ opacity:1; pointer-events:auto; transform:translate(-50%,-50%) scale(1); }
  .confirm-title{ font-family:'Fraunces', serif; font-weight:600; font-size:16px; text-align:center; }
  .confirm-message{ font-size:12.5px; color:var(--ink-mute); text-align:center; line-height:1.5; margin-top:7px; }
  .confirm-actions{ display:flex; gap:9px; margin-top:18px; }
  .confirm-btn{
    flex:1; height:44px; border-radius:13px; border:none; cursor:pointer; font-weight:800; font-size:12.5px;
  }
  .confirm-btn:active{ transform:scale(.97); }
  .confirm-cancel{ background:var(--surface-2); color:var(--ink); }
  .confirm-danger{ background:#B4453A; color:#FFFDF6; }

</style>
</head>
<body>

<div class="screen">
  <div class="topbar">
    <a class="topbar-btn" id="backBtn" href="/youtube_videos.html" aria-label="Back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <div class="topbar-title">YouTube Account</div>
  </div>

  <div class="test-mode-banner">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="13"/><line x1="12" y1="16.5" x2="12.01" y2="16.5"/></svg>
    <span>Test mode — this screen doesn't talk to YouTube yet. "Connecting" just simulates it locally.</span>
  </div>

  <div id="content"></div>
</div>

<div class="modal-backdrop" id="modalBackdrop"></div>
<div class="confirm-modal" id="confirmModal">
  <div class="confirm-title">Disconnect YouTube?</div>
  <div class="confirm-message">This just clears the simulated connection. Nothing real happens.</div>
  <div class="confirm-actions">
    <button class="confirm-btn confirm-cancel" id="confirmCancelBtn">Cancel</button>
    <button class="confirm-btn confirm-danger" id="confirmDisconnectBtn">Disconnect</button>
  </div>
</div>

<script>
  const params = new URLSearchParams(location.search);
  const returnTo = params.get('returnTo');
  if (returnTo) document.getElementById('backBtn').href = returnTo;

  const contentEl = document.getElementById('content');

  function renderDisconnected(){
    contentEl.innerHTML = `
      <div class="connect-hero">
        <div class="connect-icon">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M21.6 7.2s-.2-1.6-.85-2.3c-.8-.9-1.7-.9-2.1-1C15.9 3.7 12 3.7 12 3.7h-.05s-3.9 0-6.65.2c-.4.05-1.3.05-2.1 1-.65.7-.85 2.3-.85 2.3S2.15 9.1 2.15 11v1.9c0 1.9.2 3.8.2 3.8s.2 1.6.85 2.3c.8.9 1.85.85 2.3.95 1.7.15 7.2.2 7.2.2s3.9 0 6.65-.2c.4-.05 1.3-.05 2.1-1 .65-.7.85-2.3.85-2.3s.2-1.9.2-3.8V11c0-1.9-.2-3.8-.2-3.8zM9.95 15.3V8.7l6 3.3-6 3.3z"/></svg>
        </div>
        <div class="connect-title">Connect a YouTube channel</div>
        <div class="connect-sub">Simulates linking a channel so you can try posting videos from here. No real YouTube account is used.</div>
        <button class="connect-btn" id="connectBtn" type="button">
          <svg id="connectBtnIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M21.6 7.2s-.2-1.6-.85-2.3c-.8-.9-1.7-.9-2.1-1C15.9 3.7 12 3.7 12 3.7h-.05s-3.9 0-6.65.2c-.4.05-1.3.05-2.1 1-.65.7-.85 2.3-.85 2.3S2.15 9.1 2.15 11v1.9c0 1.9.2 3.8.2 3.8s.2 1.6.85 2.3c.8.9 1.85.85 2.3.95 1.7.15 7.2.2 7.2.2s3.9 0 6.65-.2c.4-.05 1.3-.05 2.1-1 .65-.7.85-2.3.85-2.3s.2-1.9.2-3.8V11c0-1.9-.2-3.8-.2-3.8zM9.95 15.3V8.7l6 3.3-6 3.3z"/></svg>
          <span id="connectBtnLabel">Connect (test)</span>
        </button>
        <div class="connect-fineprint">Test mode: this creates a fake channel locally, no real sign-in happens.</div>
      </div>
    `;
    document.getElementById('connectBtn').addEventListener('click', async () => {
      const btn = document.getElementById('connectBtn');
      const label = document.getElementById('connectBtnLabel');
      const icon = document.getElementById('connectBtnIcon');
      btn.disabled = true;
      label.textContent = 'Connecting…';
      icon.outerHTML = '<svg id="connectBtnIcon" class="spinner" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M12 3a9 9 0 1 0 9 9"/></svg>';
      try {
        await fetch('/api/youtube/connect', { method: 'POST' });
      } catch (e) { /* falls through to re-render, which will show it's still disconnected */ }
      render();
    });
  }

  function initials(name){
    return name.split(' ').map(w => w[0]).slice(0, 2).join('').toUpperCase();
  }

  function renderConnected(status){
    const channel = status.channel;
    contentEl.innerHTML = `
      <div class="card profile-card">
        <div class="profile-avatar">${channel.picture ? `<img src="${channel.picture}" alt="">` : initials(channel.name || 'Y')}</div>
        <div class="profile-info">
          <div class="profile-name">${channel.name}</div>
          <div class="profile-handle">${channel.handle || ''}</div>
        </div>
        <div class="profile-badge">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
          Connected
        </div>
      </div>

      <div class="section-label">Channel</div>
      <div class="card channel-row">
        <div class="channel-row-avatar">${initials(channel.name || 'Y')}</div>
        <div class="channel-row-text">
          <div class="channel-row-name">${channel.name}</div>
          <div class="channel-row-sub">${channel.handle || 'Channel'}</div>
        </div>
      </div>

      <button class="disconnect-btn" id="disconnectBtn" type="button">Disconnect account</button>
    `;
    document.getElementById('disconnectBtn').addEventListener('click', openConfirm);
  }

  async function render(){
    let status;
    try {
      status = await fetch('/api/youtube/status').then(r => r.json());
    } catch (e) {
      renderDisconnected();
      return;
    }
    if (status.connected) renderConnected(status); else renderDisconnected();
  }

  const modalBackdrop = document.getElementById('modalBackdrop');
  const confirmModal = document.getElementById('confirmModal');
  function openConfirm(){
    modalBackdrop.classList.add('open');
    confirmModal.classList.add('open');
  }
  function closeConfirm(){
    modalBackdrop.classList.remove('open');
    confirmModal.classList.remove('open');
  }
  modalBackdrop.addEventListener('click', closeConfirm);
  document.getElementById('confirmCancelBtn').addEventListener('click', closeConfirm);
  document.getElementById('confirmDisconnectBtn').addEventListener('click', async () => {
    try { await fetch('/api/youtube/disconnect', { method: 'POST' }); } catch (e) { /* falls through to re-render */ }
    closeConfirm();
    render();
  });

  render();
</script>

</body>
</html>
