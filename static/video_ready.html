<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F1E4">
<title>Video ready — Ayah Frame Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Manrope:wght@400;500;600;700;800&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<script src="/quran-data.js"></script>
<style>

  :root{
    --bg:#F6F1E4;
    --surface:#FFFDF6;
    --surface-2:#ECE3CC;
    --ink:#14183A;
    --ink-mute:#6C7094;
    --gold:#AD8226;
    --line:rgba(20,24,58,.14);
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; }
  body{
    background:
      radial-gradient(120% 45% at 50% -8%, rgba(173,130,38,.09), transparent 60%),
      var(--bg);
    color:var(--ink);
    font-family:'Manrope', sans-serif;
    min-height:100dvh;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:none;
  }
  button, a{ font-family:inherit; }

  .screen{
    height:100dvh;
    display:flex; flex-direction:column; align-items:center;
    max-width:480px; margin:0 auto;
    padding:20px 20px 32px;
    padding-top:calc(env(safe-area-inset-top,0px) + 20px);
    overflow:hidden;
  }

  .topbar{
    width:100%; display:flex; align-items:center; justify-content:space-between;
    margin-bottom:22px; flex-shrink:0;
  }
  .topbar-btn{
    width:38px; height:38px; border-radius:50%; border:none; cursor:pointer;
    background:var(--surface); box-shadow:0 2px 6px rgba(20,24,58,.08); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; color:var(--ink);
  }
  .topbar-btn:active{ transform:scale(.93); }
  .topbar-btn svg{ width:16px; height:16px; }
  .topbar-spacer{ width:38px; }

  /* min-height:0 lets this shrink below its content's natural size instead
     of forcing .screen to overflow -- required for the player's flex:1
     "weight" below to ever actually be able to give ground to it. */
  #content{
    width:100%; min-height:0; flex:1;
    display:flex; flex-direction:column; align-items:center;
  }

  .ready-eyebrow{
    font-size:10.5px; font-weight:800; letter-spacing:1.6px; text-transform:uppercase;
    color:var(--gold); margin-bottom:6px; flex-shrink:0;
  }
  .ready-title{ font-family:'Fraunces', serif; font-weight:600; font-size:22px; margin:0 0 8px; text-align:center; flex-shrink:0; }

  .ready-meta{
    color:var(--ink-mute); font-size:13px; font-weight:700; margin:0 0 20px; text-align:center;
    flex-shrink:0;
  }
  .ready-meta .surah{ color:var(--ink); }

  .not-found{ color:var(--ink-mute); font-size:13px; font-weight:600; max-width:300px; text-align:center; margin:0 auto; }

  /* ---------- custom video player ---------- */
  /* flex:1 (a "weight" of 1, like Compose's Modifier.weight) instead of a
     fixed/max height -- the player takes whatever vertical space is left
     over after the header text and action buttons claim theirs, so it
     shrinks on short viewports instead of pushing the buttons off-screen. */
  .player{
    position:relative; width:100%; max-width:320px; border-radius:20px; overflow:hidden;
    background:#000; box-shadow:0 20px 44px -20px rgba(20,24,58,.45);
    border:1px solid var(--line);
    touch-action:none;
    flex:1; min-height:0;
  }
  .player video{ width:100%; height:100%; display:block; object-fit:contain; background:#000; }

  .player-tap{ position:absolute; inset:0; cursor:pointer; }

  .player-center-btn{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%) scale(1);
    width:56px; height:56px; border-radius:50%;
    background:rgba(20,24,58,.5); backdrop-filter:blur(4px);
    display:flex; align-items:center; justify-content:center; color:#fff;
    pointer-events:none; opacity:0; transition:opacity .18s ease, transform .18s ease;
  }
  .player-center-btn svg{ width:22px; height:22px; }
  .player.paused .player-center-btn{ opacity:1; }

  .player-mute{
    position:absolute; top:10px; right:10px; width:32px; height:32px; border-radius:50%;
    border:none; cursor:pointer; background:rgba(20,24,58,.5); backdrop-filter:blur(4px);
    display:flex; align-items:center; justify-content:center; color:#fff;
  }
  .player-mute svg{ width:14px; height:14px; }

  .player-bottom{
    position:absolute; left:0; right:0; bottom:0; padding:22px 10px 10px;
    background:linear-gradient(to top, rgba(0,0,0,.55), transparent);
    display:flex; flex-direction:column; gap:6px;
  }
  .player-progress{
    position:relative; height:14px; display:flex; align-items:center; cursor:pointer;
  }
  .player-progress::before{
    content:""; position:absolute; left:0; right:0; height:3px; border-radius:3px;
    background:rgba(255,255,255,.3);
  }
  .player-progress-fill{
    position:absolute; left:0; height:3px; border-radius:3px; background:var(--gold); width:0%;
    pointer-events:none;
  }
  .player-progress-thumb{
    position:absolute; width:11px; height:11px; border-radius:50%; background:var(--gold);
    top:50%; transform:translate(-50%,-50%); left:0%;
    box-shadow:0 0 0 3px rgba(255,255,255,.25);
    pointer-events:none;
  }
  .player-time{
    font-size:10.5px; font-weight:700; color:rgba(255,255,255,.85); letter-spacing:.2px;
    font-variant-numeric:tabular-nums;
  }

  .player-replay{
    position:absolute; inset:0; display:none; align-items:center; justify-content:center;
    flex-direction:column; gap:10px; background:rgba(20,24,58,.55); backdrop-filter:blur(3px);
    color:#fff; cursor:pointer;
  }
  .player.ended .player-replay{ display:flex; }
  .player-replay-btn{
    width:52px; height:52px; border-radius:50%; background:var(--gold); color:#2B2004;
    display:flex; align-items:center; justify-content:center;
  }
  .player-replay-btn svg{ width:20px; height:20px; }
  .player-replay-label{ font-size:11.5px; font-weight:800; letter-spacing:.3px; }

  /* ---------- actions ---------- */
  .ready-actions{ margin-top:26px; display:flex; flex-direction:column; gap:10px; width:100%; max-width:300px; flex-shrink:0; }
  .ready-btn{
    height:52px; padding:0 22px; border-radius:15px; border:none; cursor:pointer;
    font-weight:800; font-size:13.5px; display:flex; align-items:center; justify-content:center; gap:8px;
    text-decoration:none;
  }
  .ready-btn:active{ transform:scale(.97); }
  .ready-btn-primary{ background:var(--ink); color:#F6F1E4; box-shadow:0 16px 28px -16px rgba(20,24,58,.45); }
  .ready-btn-secondary{ background:var(--surface-2); color:var(--ink); }
  .ready-btn svg{ width:14px; height:14px; flex-shrink:0; }

  .ready-actions-row{ display:flex; gap:10px; }
  .ready-actions-row .ready-btn{ flex:1; padding:0 12px; }

  /* ---------- post sheet ---------- */
  .post-backdrop{
    position:fixed; inset:0; background:rgba(20,24,58,.45); backdrop-filter:blur(2px);
    opacity:0; pointer-events:none; transition:opacity .2s ease; z-index:20;
  }
  .post-backdrop.open{ opacity:1; pointer-events:auto; }

  .post-sheet{
    position:fixed; left:0; right:0; bottom:0; max-width:480px; margin:0 auto;
    background:var(--surface); border-radius:22px 22px 0 0;
    box-shadow:0 -12px 30px rgba(20,24,58,.2);
    padding:10px 20px calc(env(safe-area-inset-bottom,0px) + 22px);
    transform:translateY(100%); transition:transform .22s cubic-bezier(.32,.72,0,1);
    z-index:21;
  }
  .post-sheet.open{ transform:translateY(0); }
  .post-sheet-handle{ width:36px; height:4px; border-radius:3px; background:var(--line); margin:0 auto 16px; }
  .post-sheet-title{ font-family:'Fraunces', serif; font-weight:600; font-size:17px; margin-bottom:14px; }

  .post-option{
    width:100%; display:flex; align-items:center; gap:12px; text-align:left;
    background:var(--surface-2); border:none; border-radius:15px; padding:12px 14px;
    margin-bottom:10px; cursor:pointer; opacity:.55; pointer-events:none;
  }
  .post-option:not([disabled]){ opacity:1; pointer-events:auto; }
  .post-option:not([disabled]):active{ transform:scale(.98); }
  .post-option-icon{
    width:38px; height:38px; border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; color:#fff;
  }
  .post-option-icon svg{ width:18px; height:18px; }
  .post-option-icon.fb{ background:#1877F2; }
  .post-option-icon.yt{ background:#FF0000; }
  .post-option-text{ display:flex; flex-direction:column; gap:2px; }
  .post-option-label{ font-weight:800; font-size:13.5px; color:var(--ink); }
  .post-option-sub{ font-size:11px; font-weight:700; color:var(--ink-mute); }

  .post-sheet-cancel{
    width:100%; height:48px; border:none; border-radius:15px; background:none;
    color:var(--ink-mute); font-weight:800; font-size:13.5px; cursor:pointer;
  }

</style>
</head>
<body>

<div class="screen">
  <div class="topbar">
    <a class="topbar-btn" href="/" aria-label="Home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10a1 1 0 001 1h4v-6h4v6h4a1 1 0 001-1V10"/></svg>
    </a>
    <div class="topbar-spacer"></div>
  </div>
  <div id="content">
    <div class="ready-title">Loading…</div>
  </div>
</div>

<div class="post-backdrop" id="postBackdrop"></div>
<div class="post-sheet" id="postSheet">
  <div class="post-sheet-handle"></div>
  <div class="post-sheet-title">Post this video</div>
  <button class="post-option" id="postOptionFacebook">
    <span class="post-option-icon fb">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M22 12.06C22 6.5 17.52 2 12 2S2 6.5 2 12.06C2 17.08 5.66 21.24 10.44 22v-7.03H7.9v-2.91h2.54V9.85c0-2.5 1.49-3.89 3.77-3.89 1.09 0 2.24.2 2.24.2v2.46h-1.26c-1.24 0-1.63.77-1.63 1.56v1.88h2.78l-.45 2.91h-2.33V22C18.34 21.24 22 17.08 22 12.06z"/></svg>
    </span>
    <span class="post-option-text">
      <span class="post-option-label">Facebook Page</span>
      <span class="post-option-sub">Share this video</span>
    </span>
  </button>
  <button class="post-option" id="postOptionYoutube">
    <span class="post-option-icon yt">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M23.5 6.2a3 3 0 00-2.1-2.1C19.5 3.5 12 3.5 12 3.5s-7.5 0-9.4.6A3 3 0 00.5 6.2 31.4 31.4 0 000 12a31.4 31.4 0 00.5 5.8 3 3 0 002.1 2.1c1.9.6 9.4.6 9.4.6s7.5 0 9.4-.6a3 3 0 002.1-2.1A31.4 31.4 0 0024 12a31.4 31.4 0 00-.5-5.8zM9.6 15.5v-7l6.3 3.5-6.3 3.5z"/></svg>
    </span>
    <span class="post-option-text">
      <span class="post-option-label">YouTube Channel</span>
      <span class="post-option-sub">Share this video (test mode)</span>
    </span>
  </button>
  <button class="post-sheet-cancel" id="postSheetCancel">Cancel</button>
</div>

<script>
  const params = new URLSearchParams(location.search);
  let jobId = params.get('jobId');
  const sessionId = params.get('sessionId');
  const contentEl = document.getElementById('content');

  function formatTime(t){
    if (!isFinite(t) || t < 0) t = 0;
    const m = Math.floor(t / 60);
    const s = Math.floor(t % 60);
    return `${m}:${String(s).padStart(2, '0')}`;
  }

  // Wires up a bare <video> into a tap-to-toggle, drag-to-seek, mute-toggle
  // player with a play-once "ended" overlay -- no native controls at all.
  function initPlayer(){
    const playerEl = document.getElementById('player');
    const video = document.getElementById('readyVideo');
    const tapEl = document.getElementById('playerTap');
    const muteBtn = document.getElementById('muteBtn');
    const progressTrack = document.getElementById('progressTrack');
    const progressFill = document.getElementById('progressFill');
    const progressThumb = document.getElementById('progressThumb');
    const timeLabel = document.getElementById('timeLabel');
    const replayEl = document.getElementById('playerReplay');

    function setMuteIcon(){
      muteBtn.innerHTML = video.muted
        ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H3v6h3l5 4V5z"/><line x1="16" y1="9" x2="21" y2="15"/><line x1="21" y1="9" x2="16" y2="15"/></svg>'
        : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 010 7"/><path d="M18 6a9 9 0 010 12"/></svg>';
    }
    setMuteIcon();

    function updateProgress(){
      const pct = video.duration ? (video.currentTime / video.duration) * 100 : 0;
      progressFill.style.width = pct + '%';
      progressThumb.style.left = pct + '%';
      timeLabel.textContent = `${formatTime(video.currentTime)} / ${formatTime(video.duration)}`;
    }

    function togglePlay(){
      if (video.ended){ video.currentTime = 0; playerEl.classList.remove('ended'); }
      if (video.paused) video.play().catch(() => {}); else video.pause();
    }

    tapEl.addEventListener('click', togglePlay);

    video.addEventListener('play', () => playerEl.classList.remove('paused', 'ended'));
    video.addEventListener('pause', () => { if (!video.ended) playerEl.classList.add('paused'); });
    video.addEventListener('timeupdate', updateProgress);
    video.addEventListener('loadedmetadata', updateProgress);
    // Play once: no loop attribute, just surface a replay overlay at the end
    // instead of the browser's own end-of-video state.
    video.addEventListener('ended', () => playerEl.classList.add('ended'));

    replayEl.addEventListener('click', () => {
      playerEl.classList.remove('ended');
      video.currentTime = 0;
      video.play().catch(() => {});
    });

    muteBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      video.muted = !video.muted;
      setMuteIcon();
    });

    // Drag-to-seek on the progress track (pointer events cover mouse + touch).
    let seeking = false;
    function seekFromEvent(e){
      const rect = progressTrack.getBoundingClientRect();
      const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
      const pct = Math.min(1, Math.max(0, x / rect.width));
      if (video.duration) video.currentTime = pct * video.duration;
      updateProgress();
    }
    progressTrack.addEventListener('pointerdown', (e) => {
      e.stopPropagation();
      seeking = true;
      progressTrack.setPointerCapture(e.pointerId);
      seekFromEvent(e);
    });
    progressTrack.addEventListener('pointermove', (e) => { if (seeking) seekFromEvent(e); });
    progressTrack.addEventListener('pointerup', (e) => { seeking = false; progressTrack.releasePointerCapture(e.pointerId); });

    // Autoplay: try unmuted first (some browsers/contexts allow it right
    // after a user action like tapping "Generate"), fall back to muted
    // autoplay (always allowed) so the video is still moving on load --
    // the mute button above makes turning sound on a one-tap fix.
    video.play().catch(() => {
      video.muted = true;
      setMuteIcon();
      video.play().catch(() => { playerEl.classList.add('paused'); });
    });
  }

  // The "Post" sheet is static markup outside #content (survives re-renders
  // of the ready/unavailable states), so this just wires it up once postBtn
  // exists -- safe to call every renderReady(), it re-adds the same
  // listeners on a fresh postBtn each time.
  function initPostSheet(){
    const postBtn = document.getElementById('postBtn');
    const backdrop = document.getElementById('postBackdrop');
    const sheet = document.getElementById('postSheet');
    const cancelBtn = document.getElementById('postSheetCancel');
    const facebookOption = document.getElementById('postOptionFacebook');
    const youtubeOption = document.getElementById('postOptionYoutube');
    if (!postBtn) return;

    function open(){ backdrop.classList.add('open'); sheet.classList.add('open'); }
    function close(){ backdrop.classList.remove('open'); sheet.classList.remove('open'); }

    postBtn.addEventListener('click', open);
    backdrop.addEventListener('click', close);
    cancelBtn.addEventListener('click', close);
    facebookOption.addEventListener('click', () => {
      let url = `/post_facebook.html?jobId=${encodeURIComponent(jobId)}`;
      if (sessionId) url += `&sessionId=${encodeURIComponent(sessionId)}`;
      location.href = url;
    });
    youtubeOption.addEventListener('click', () => {
      let url = `/post_youtube.html?jobId=${encodeURIComponent(jobId)}`;
      if (sessionId) url += `&sessionId=${encodeURIComponent(sessionId)}`;
      location.href = url;
    });
  }

  // meta is {surahName, ayahStart, ayahEnd, reciterName} -- any field can be
  // missing (older sessions, or the session record having been lost since
  // generation) so the line just quietly drops whatever it doesn't have.
  function renderReady(downloadUrl, meta, editTimingUrl){
    const parts = [];
    if (meta && meta.surahName){
      const range = (meta.ayahStart != null && meta.ayahEnd != null)
        ? (meta.ayahStart === meta.ayahEnd ? `Ayah ${meta.ayahStart}` : `Ayahs ${meta.ayahStart}–${meta.ayahEnd}`)
        : '';
      parts.push(`<span class="surah">${meta.surahName}</span>${range ? ' · ' + range : ''}`);
    }
    if (meta && meta.reciterName) parts.push(meta.reciterName);
    const metaHtml = parts.length ? `<div class="ready-meta">${parts.join(' — ')}</div>` : '';

    contentEl.innerHTML = `
      <div class="ready-eyebrow">Video ready</div>
      <div class="ready-title">Your ayah video is ready</div>
      ${metaHtml}
      <div class="player paused" id="player">
        <video id="readyVideo" src="${downloadUrl}" playsinline webkit-playsinline></video>
        <div class="player-tap" id="playerTap"></div>
        <div class="player-center-btn">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        </div>
        <button class="player-mute" id="muteBtn" aria-label="Toggle sound"></button>
        <div class="player-bottom">
          <div class="player-progress" id="progressTrack">
            <div class="player-progress-fill" id="progressFill"></div>
            <div class="player-progress-thumb" id="progressThumb"></div>
          </div>
          <div class="player-time" id="timeLabel">0:00 / 0:00</div>
        </div>
        <div class="player-replay" id="playerReplay">
          <div class="player-replay-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
          </div>
          <div class="player-replay-label">Watch again</div>
        </div>
      </div>
      <div class="ready-actions">
        <button class="ready-btn ready-btn-primary" id="postBtn" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="#F6F1E4" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20V4M5 11l7-7 7 7"/><path d="M5 20h14"/></svg>
          Post
        </button>
        <div class="ready-actions-row">
          <a class="ready-btn ready-btn-secondary" href="${downloadUrl}" download>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v12M7 11l5 5 5-5M5 20h14"/></svg>
            Download
          </a>
          ${editTimingUrl ? `
          <a class="ready-btn ready-btn-secondary" href="${editTimingUrl}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21v-4l12-12 4 4-12 12H4z"/><path d="M13 6l4 4"/></svg>
            Edit timing
          </a>` : ''}
        </div>
      </div>
    `;
    initPostSheet();
    initPlayer();
  }

  function renderUnavailable(){
    contentEl.innerHTML = `
      <div class="ready-title">This video isn't available anymore</div>
      <div class="not-found">The server may have restarted since it was generated. Check your video library from the home screen.</div>
      <div class="ready-actions">
        <a class="ready-btn ready-btn-primary" href="/">Home</a>
      </div>
    `;
  }

  (async function init(){
    // Fetch the session up front -- both to recover a missing jobId (see
    // app.py's api_generate()) the same way generating.html does, and to
    // read the surah/ayah/reciter this video was made from for the meta line.
    let session = null;
    if (sessionId){
      try {
        session = await fetch(`/api/sessions/${encodeURIComponent(sessionId)}`).then(r => r.json());
        if (!jobId && session && session.jobId) jobId = session.jobId;
      } catch (e) { /* fall through to the no-jobId check below */ }
    }
    if (!jobId){ renderUnavailable(); return; }
    try {
      // sessionId lets the backend reconstruct this job's outcome from the
      // session record if JOBS (in-memory) has forgotten it -- see
      // app.py's _session_job_fallback().
      let url = `/api/status/${encodeURIComponent(jobId)}`;
      if (sessionId) url += `?sessionId=${encodeURIComponent(sessionId)}`;
      const res = await fetch(url);
      const json = await res.json();
      if (!res.ok || json.status !== 'done' || !json.downloadUrl){ renderUnavailable(); return; }

      let meta = null;
      if (session && session.surah != null){
        const surahInfo = (window.SURAHS || []).find(s => s.n === session.surah);
        meta = {
          surahName: surahInfo ? surahInfo.en : `Surah ${session.surah}`,
          ayahStart: session.ayahStart, ayahEnd: session.ayahEnd,
        };
        if (session.reciter){
          try {
            const reciters = await fetch('/api/reciters').then(r => r.json());
            meta.reciterName = reciters[session.reciter] || null;
          } catch (e) { /* meta line just skips the reciter name */ }
        }
      }
      // Same entry point index.html's "Edit word timing" theme-sheet action
      // uses -- editTiming=1 keeps timing.html in edit-only mode.
      const editTimingUrl = sessionId ? `/timing.html?sessionId=${encodeURIComponent(sessionId)}&editTiming=1` : null;
      renderReady(json.downloadUrl, meta, editTimingUrl);
    } catch (e) {
      renderUnavailable();
    }
  })();
</script>

</body>
</html>
