<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F1E4">
<title>Post to YouTube — Ayah Frame Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Manrope:wght@400;500;600;700;800&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<script src="/quran-data.js"></script>
<style>

  :root{
    --bg:#F6F1E4;
    --surface:#FFFDF6;
    --surface-2:#ECE3CC;
    --ink:#14183A;
    --ink-mute:#6C7094;
    --gold:#AD8226;
    --line:rgba(20,24,58,.14);
    --danger:#B23B3B;
    --success:#2F8F6A;
    --yt:#FF0000;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; }
  body{
    background:
      radial-gradient(120% 45% at 50% -8%, rgba(173,130,38,.09), transparent 60%),
      var(--bg);
    color:var(--ink);
    font-family:'Manrope', sans-serif;
    min-height:100dvh;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:none;
  }
  button, a, textarea{ font-family:inherit; }

  .screen{
    min-height:100dvh;
    display:flex; flex-direction:column; align-items:center;
    max-width:480px; margin:0 auto;
    padding:20px 20px 40px;
    padding-top:calc(env(safe-area-inset-top,0px) + 20px);
  }

  .topbar{
    width:100%; display:flex; align-items:center; gap:12px;
    margin-bottom:20px;
  }
  .topbar-btn{
    width:38px; height:38px; border-radius:50%; border:none; cursor:pointer;
    background:var(--surface); box-shadow:0 2px 6px rgba(20,24,58,.08); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; color:var(--ink); flex-shrink:0;
    text-decoration:none;
  }
  .topbar-btn:active{ transform:scale(.93); }
  .topbar-btn svg{ width:16px; height:16px; }
  .topbar-title{ font-family:'Fraunces', serif; font-weight:600; font-size:17px; }

  #content{ width:100%; }

  .preview-notice{
    display:flex; align-items:flex-start; gap:10px;
    background:rgba(173,130,38,.1); border:1px solid rgba(173,130,38,.25);
    border-radius:14px; padding:12px 14px; margin-bottom:18px;
    font-size:12px; font-weight:600; color:#7A5C1B; line-height:1.5;
  }
  .preview-notice svg{ width:15px; height:15px; flex-shrink:0; margin-top:1px; color:var(--gold); }

  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:18px;
    box-shadow:0 2px 6px rgba(20,24,58,.05);
  }

  /* ---------- connected channel ---------- */
  .page-card{
    display:flex; align-items:center; gap:12px; padding:14px 16px; margin-bottom:16px;
  }
  .page-avatar{
    width:42px; height:42px; border-radius:50%; background:var(--yt); color:#fff;
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .page-avatar svg{ width:19px; height:19px; }
  .page-avatar img{ width:100%; height:100%; border-radius:50%; object-fit:cover; }
  .page-info{ flex:1; min-width:0; }
  .page-name{ font-weight:800; font-size:14px; }
  .page-sub{ font-size:11.5px; color:var(--ink-mute); font-weight:600; margin-top:1px; }
  .page-change{
    background:none; border:none; color:var(--gold); font-weight:800; font-size:12px;
    cursor:pointer; padding:6px 8px; flex-shrink:0;
  }

  /* ---------- video preview ---------- */
  .preview-card{ padding:12px; margin-bottom:16px; display:flex; gap:12px; align-items:center; }
  .preview-thumb{
    position:relative; width:64px; height:96px; border-radius:12px; overflow:hidden;
    background:#000; flex-shrink:0; cursor:pointer;
  }
  .preview-thumb video{ width:100%; height:100%; object-fit:cover; display:block; }
  .preview-thumb-play{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    background:rgba(20,24,58,.35); color:#fff; transition:opacity .15s ease;
  }
  .preview-thumb-play svg{ width:16px; height:16px; }
  .preview-thumb.playing .preview-thumb-play{ opacity:0; }
  .preview-meta{ flex:1; min-width:0; }
  .preview-meta-title{ font-weight:800; font-size:13.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .preview-meta-sub{ font-size:11.5px; color:var(--ink-mute); font-weight:600; margin-top:2px; }

  /* ---------- description ---------- */
  .field-label{
    font-size:10.5px; font-weight:800; letter-spacing:1px; text-transform:uppercase;
    color:var(--ink-mute); margin:0 2px 8px;
  }
  .caption-card{ padding:14px 16px; margin-bottom:6px; }
  .caption-input{
    width:100%; border:none; resize:none; background:none; color:var(--ink);
    font-size:14px; line-height:1.55; min-height:110px; outline:none;
  }
  .caption-count{ text-align:right; font-size:11px; color:var(--ink-mute); font-weight:700; margin:6px 4px 20px; }

  .hint{ font-size:11.5px; color:var(--ink-mute); font-weight:600; text-align:center; margin:14px 0 0; line-height:1.5; }

  /* ---------- post button ---------- */
  .post-actions{ margin-top:18px; }
  .post-btn{
    width:100%; height:54px; padding:0 22px; border-radius:15px; border:none; cursor:pointer;
    font-weight:800; font-size:14px; display:flex; align-items:center; justify-content:center; gap:9px;
    background:var(--yt); color:#fff; box-shadow:0 16px 28px -16px rgba(255,0,0,.45);
  }
  .post-btn:active{ transform:scale(.98); }
  .post-btn:disabled{ opacity:.6; pointer-events:none; }
  .post-btn svg{ width:15px; height:15px; }
  .post-btn .spinner{ animation:spin 1s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* ---------- channel picker sheet ---------- */
  .sheet-backdrop{
    position:fixed; inset:0; background:rgba(20,24,58,.45); backdrop-filter:blur(2px);
    opacity:0; pointer-events:none; transition:opacity .2s ease; z-index:20;
  }
  .sheet-backdrop.open{ opacity:1; pointer-events:auto; }

  .sheet{
    position:fixed; left:0; right:0; bottom:0; max-width:480px; margin:0 auto;
    max-height:80vh; display:flex; flex-direction:column;
    background:var(--surface); border-radius:22px 22px 0 0;
    box-shadow:0 -12px 30px rgba(20,24,58,.2);
    padding:10px 20px calc(env(safe-area-inset-bottom,0px) + 18px);
    transform:translateY(100%); transition:transform .22s cubic-bezier(.32,.72,0,1);
    z-index:21;
  }
  .sheet.open{ transform:translateY(0); }
  .sheet-handle{ width:36px; height:4px; border-radius:3px; background:var(--line); margin:0 auto 16px; flex-shrink:0; }
  .sheet-title{ font-family:'Fraunces', serif; font-weight:600; font-size:17px; margin-bottom:4px; flex-shrink:0; }
  .sheet-sub{ font-size:12px; color:var(--ink-mute); font-weight:600; margin-bottom:14px; flex-shrink:0; }

  .page-list{ overflow-y:auto; margin:0 -4px; padding:0 4px; }
  .page-row{
    width:100%; display:flex; align-items:center; gap:12px; text-align:left;
    background:var(--surface-2); border:2px solid transparent; border-radius:15px; padding:10px 12px;
    margin-bottom:8px; cursor:pointer;
  }
  .page-row.selected{ border-color:var(--yt); background:rgba(255,0,0,.06); }
  .page-row-avatar{
    width:38px; height:38px; border-radius:50%; color:#fff; font-weight:800; font-size:14px;
    display:flex; align-items:center; justify-content:center; flex-shrink:0; background:var(--yt);
  }
  .page-row-avatar img{ width:100%; height:100%; border-radius:50%; object-fit:cover; }
  .page-row-text{ flex:1; min-width:0; }
  .page-row-name{ font-weight:800; font-size:13.5px; }
  .page-row-sub{ font-size:11px; font-weight:600; color:var(--ink-mute); margin-top:1px; }
  .page-row-check{
    width:20px; height:20px; border-radius:50%; border:2px solid var(--line); flex-shrink:0;
    display:flex; align-items:center; justify-content:center; color:#fff;
  }
  .page-row.selected .page-row-check{ background:var(--yt); border-color:var(--yt); }
  .page-row-check svg{ width:11px; height:11px; opacity:0; }
  .page-row.selected .page-row-check svg{ opacity:1; }

  .sheet-actions{ flex-shrink:0; padding-top:12px; display:flex; flex-direction:column; gap:8px; }
  .sheet-confirm-btn{
    width:100%; height:52px; border-radius:15px; border:none; cursor:pointer;
    font-weight:800; font-size:13.5px; background:var(--yt); color:#fff;
  }
  .sheet-confirm-btn:disabled{ opacity:.5; pointer-events:none; }
  .sheet-confirm-btn:active{ transform:scale(.98); }
  .sheet-cancel-btn{
    width:100%; height:44px; border:none; border-radius:15px; background:none;
    color:var(--ink-mute); font-weight:800; font-size:13px; cursor:pointer;
  }

</style>
</head>
<body>

<div class="screen">
  <div class="topbar">
    <a class="topbar-btn" id="backBtn" href="/" aria-label="Back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <div class="topbar-title">Post to YouTube</div>
  </div>

  <div id="content">
    <div class="preview-notice">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="13"/><line x1="12" y1="16.5" x2="12.01" y2="16.5"/></svg>
      <span>Test mode — this simulates posting a Short. Nothing is uploaded to real YouTube.</span>
    </div>

    <div class="card page-card">
      <div class="page-avatar">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M21.6 7.2s-.2-1.6-.85-2.3c-.8-.9-1.7-.9-2.1-1C15.9 3.7 12 3.7 12 3.7h-.05s-3.9 0-6.65.2c-.4.05-1.3.05-2.1 1-.65.7-.85 2.3-.85 2.3S2.15 9.1 2.15 11v1.9c0 1.9.2 3.8.2 3.8s.2 1.6.85 2.3c.8.9 1.85.85 2.3.95 1.7.15 7.2.2 7.2.2s3.9 0 6.65-.2c.4-.05 1.3-.05 2.1-1 .65-.7.85-2.3.85-2.3s.2-1.9.2-3.8V11c0-1.9-.2-3.8-.2-3.8zM9.95 15.3V8.7l6 3.3-6 3.3z"/></svg>
      </div>
      <div class="page-info">
        <div class="page-name" id="pageName">Select a channel</div>
        <div class="page-sub" id="pageSub">Required before you can post</div>
      </div>
      <button class="page-change" id="pageChangeBtn">Select</button>
    </div>

    <div class="card preview-card">
      <div class="preview-thumb" id="previewThumb">
        <video id="previewVideo" muted playsinline webkit-playsinline></video>
        <div class="preview-thumb-play" id="previewPlay">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        </div>
      </div>
      <div class="preview-meta">
        <div class="preview-meta-title" id="previewTitle">Your ayah video</div>
        <div class="preview-meta-sub" id="previewSub"></div>
      </div>
    </div>

    <div class="field-label">Description</div>
    <div class="card caption-card">
      <textarea class="caption-input" id="captionInput" maxlength="5000" placeholder="Write a description…"></textarea>
    </div>
    <div class="caption-count"><span id="captionCount">0</span> / 5000</div>

    <div class="post-actions">
      <button class="post-btn" id="postBtn" type="button" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20V4M5 11l7-7 7 7"/><path d="M5 20h14"/></svg>
        <span id="postBtnLabel">Post to YouTube</span>
      </button>
      <div class="hint" id="postHint">Select a channel above before you can post.</div>
    </div>
  </div>
</div>

<div class="sheet-backdrop" id="pageSheetBackdrop"></div>
<div class="sheet" id="pageSheet">
  <div class="sheet-handle"></div>
  <div class="sheet-title">Choose a channel</div>
  <div class="sheet-sub">Pick which YouTube channel to post this video to.</div>
  <div class="page-list" id="pageList"></div>
  <div class="sheet-actions">
    <button class="sheet-confirm-btn" id="pageSheetConfirm" disabled type="button">Post to selected channel</button>
    <button class="sheet-cancel-btn" id="pageSheetCancel" type="button">Cancel</button>
  </div>
</div>

<script>
  const params = new URLSearchParams(location.search);
  const jobId = params.get('jobId');
  const sessionId = params.get('sessionId');
  const videoId = params.get('videoId');
  const referrer = params.get('from');

  const backBtn = document.getElementById('backBtn');
  let backUrl = '/';
  if (referrer) backUrl = referrer;
  else if (jobId || sessionId){
    backUrl = `/video_ready.html?${jobId ? 'jobId=' + encodeURIComponent(jobId) : ''}${sessionId ? (jobId ? '&' : '') + 'sessionId=' + encodeURIComponent(sessionId) : ''}`;
  }
  backBtn.href = backUrl;

  const postBtn = document.getElementById('postBtn');
  const postHint = document.getElementById('postHint');
  const captionInput = document.getElementById('captionInput');
  const captionCount = document.getElementById('captionCount');
  const pageChangeBtn = document.getElementById('pageChangeBtn');
  const pageNameEl = document.getElementById('pageName');
  const pageSubEl = document.getElementById('pageSub');
  const pageAvatarEl = document.querySelector('.page-avatar');

  captionInput.addEventListener('input', () => {
    captionCount.textContent = captionInput.value.length;
  });

  let ytConnected = false;
  let channels = [];
  let selectedChannelId = null;

  const pageSheetBackdrop = document.getElementById('pageSheetBackdrop');
  const pageSheet = document.getElementById('pageSheet');
  const pageList = document.getElementById('pageList');
  const pageSheetConfirm = document.getElementById('pageSheetConfirm');
  const pageSheetCancel = document.getElementById('pageSheetCancel');

  function initials(name){
    return name.split(' ').map(w => w[0]).slice(0, 2).join('').toUpperCase();
  }

  function rowAvatar(c){
    return c.picture
      ? `<span class="page-row-avatar"><img src="${c.picture}" alt=""></span>`
      : `<span class="page-row-avatar">${initials(c.name)}</span>`;
  }

  function renderPageList(){
    pageList.innerHTML = channels.map(c => `
      <button class="page-row${c.id === selectedChannelId ? ' selected' : ''}" data-channel-id="${c.id}" type="button">
        ${rowAvatar(c)}
        <span class="page-row-text">
          <span class="page-row-name">${c.name}</span>
          <span class="page-row-sub">${c.handle || 'Channel'}</span>
        </span>
        <span class="page-row-check">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
        </span>
      </button>
    `).join('');
    pageList.querySelectorAll('.page-row').forEach(row => {
      row.addEventListener('click', () => {
        selectedChannelId = row.dataset.channelId;
        renderPageList();
        pageSheetConfirm.disabled = false;
      });
    });
  }

  function openPageSheet(){
    pageSheetConfirm.disabled = !selectedChannelId;
    renderPageList();
    pageSheetBackdrop.classList.add('open');
    pageSheet.classList.add('open');
  }
  function closePageSheet(){
    pageSheetBackdrop.classList.remove('open');
    pageSheet.classList.remove('open');
  }

  function updatePageCard(){
    const channel = channels.find(c => c.id === selectedChannelId);
    if (!channel) return;
    pageNameEl.textContent = channel.name;
    pageSubEl.textContent = 'Posting as this channel';
    pageAvatarEl.innerHTML = channel.picture
      ? `<img src="${channel.picture}" alt="">`
      : '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M21.6 7.2s-.2-1.6-.85-2.3c-.8-.9-1.7-.9-2.1-1C15.9 3.7 12 3.7 12 3.7h-.05s-3.9 0-6.65.2c-.4.05-1.3.05-2.1 1-.65.7-.85 2.3-.85 2.3S2.15 9.1 2.15 11v1.9c0 1.9.2 3.8.2 3.8s.2 1.6.85 2.3c.8.9 1.85.85 2.3.95 1.7.15 7.2.2 7.2.2s3.9 0 6.65-.2c.4-.05 1.3-.05 2.1-1 .65-.7.85-2.3.85-2.3s.2-1.9.2-3.8V11c0-1.9-.2-3.8-.2-3.8zM9.95 15.3V8.7l6 3.3-6 3.3z"/></svg>';
    pageChangeBtn.textContent = 'Change';
    postBtn.disabled = false;
    postHint.textContent = 'Test mode: posts a simulated video, nothing goes to real YouTube.';
  }

  pageSheetBackdrop.addEventListener('click', closePageSheet);
  pageSheetCancel.addEventListener('click', closePageSheet);
  pageChangeBtn.addEventListener('click', () => {
    if (!ytConnected){
      const returnTo = `/post_youtube.html?${jobId ? 'jobId=' + encodeURIComponent(jobId) : ''}${sessionId ? (jobId ? '&' : '') + 'sessionId=' + encodeURIComponent(sessionId) : ''}`;
      location.href = `/youtube_account.html?returnTo=${encodeURIComponent(returnTo)}`;
      return;
    }
    openPageSheet();
  });

  pageSheetConfirm.addEventListener('click', () => {
    closePageSheet();
    updatePageCard();
  });

  postBtn.addEventListener('click', () => {
    if (!selectedChannelId) return;
    try { sessionStorage.setItem('ytPostCaption', captionInput.value); } catch (e) { /* description just won't prefill on the next screen */ }
    let url = `/post_youtube_progress.html?channelId=${encodeURIComponent(selectedChannelId)}`;
    if (jobId) url += `&jobId=${encodeURIComponent(jobId)}`;
    if (sessionId) url += `&sessionId=${encodeURIComponent(sessionId)}`;
    if (videoId) url += `&videoId=${encodeURIComponent(videoId)}`;
    if (referrer) url += `&from=${encodeURIComponent(referrer)}`;
    location.href = url;
  });

  // ---------- compact tap-to-preview player ----------
  function initPreviewPlayer(downloadUrl){
    const video = document.getElementById('previewVideo');
    const thumb = document.getElementById('previewThumb');
    video.src = downloadUrl;
    thumb.addEventListener('click', () => {
      if (video.paused){ video.play().catch(() => {}); thumb.classList.add('playing'); }
      else { video.pause(); thumb.classList.remove('playing'); }
    });
    video.addEventListener('ended', () => thumb.classList.remove('playing'));
  }

  (async function init(){
    try {
      const status = await fetch('/api/youtube/status').then(r => r.json());
      ytConnected = !!status.connected;
      channels = ytConnected ? [status.channel] : [];
    } catch (e) {
      ytConnected = false;
      channels = [];
    }

    if (!ytConnected){
      pageNameEl.textContent = 'Connect YouTube first';
      pageSubEl.textContent = 'Required before you can post';
      pageChangeBtn.textContent = 'Connect';
      postHint.textContent = 'Connect a YouTube channel before you can post.';
    } else if (channels.length === 1){
      selectedChannelId = channels[0].id;
      updatePageCard();
    }

    if (videoId){
      try {
        const videos = await fetch('/api/videos').then(r => r.json());
        const v = (Array.isArray(videos) ? videos : []).find(x => x.id === videoId);
        if (v){
          const surahInfo = (window.SURAHS || []).find(s => s.n === v.surah);
          const surahName = surahInfo ? surahInfo.en : (v.surah != null ? `Surah ${v.surah}` : 'Untitled');
          const range = (v.ayahStart != null && v.ayahEnd != null)
            ? (v.ayahStart === v.ayahEnd ? `Ayah ${v.ayahStart}` : `Ayahs ${v.ayahStart}–${v.ayahEnd}`)
            : '';
          const title = `${surahName}${range ? ' · ' + range : ''}`;
          document.getElementById('previewTitle').textContent = title;
          let reciterName = null;
          if (v.reciter){
            try { reciterName = (await fetch('/api/reciters').then(r => r.json()))[v.reciter] || null; }
            catch (e) { /* description/preview just skip the reciter name */ }
          }
          document.getElementById('previewSub').textContent = reciterName || '';
          const captionLines = [`📖 ${title}`];
          if (reciterName) captionLines.push(`Recited by ${reciterName}`);
          captionLines.push('', '#Quran #Islam #Shorts');
          captionInput.value = captionLines.join('\n');
          captionCount.textContent = captionInput.value.length;
          initPreviewPlayer(`/output/${encodeURIComponent(v.file)}`);
        }
      } catch (e) { /* preview/meta just stay at their defaults */ }
      return;
    }

    let session = null;
    let resolvedJobId = jobId;
    if (sessionId){
      try {
        session = await fetch(`/api/sessions/${encodeURIComponent(sessionId)}`).then(r => r.json());
        if (!resolvedJobId && session && session.jobId) resolvedJobId = session.jobId;
      } catch (e) { /* meta/preview just stay at their defaults below */ }
    }

    let meta = null;
    if (session && session.surah != null){
      const surahInfo = (window.SURAHS || []).find(s => s.n === session.surah);
      meta = {
        surahName: surahInfo ? surahInfo.en : `Surah ${session.surah}`,
        ayahStart: session.ayahStart, ayahEnd: session.ayahEnd,
      };
      if (session.reciter){
        try {
          const reciters = await fetch('/api/reciters').then(r => r.json());
          meta.reciterName = reciters[session.reciter] || null;
        } catch (e) { /* description/preview just skip the reciter name */ }
      }
    }

    if (meta && meta.surahName){
      const range = (meta.ayahStart != null && meta.ayahEnd != null)
        ? (meta.ayahStart === meta.ayahEnd ? `Ayah ${meta.ayahStart}` : `Ayahs ${meta.ayahStart}–${meta.ayahEnd}`)
        : '';
      const title = `${meta.surahName}${range ? ' · ' + range : ''}`;
      document.getElementById('previewTitle').textContent = title;
      document.getElementById('previewSub').textContent = meta.reciterName || '';

      const captionLines = [`📖 ${title}`];
      if (meta.reciterName) captionLines.push(`Recited by ${meta.reciterName}`);
      captionLines.push('', '#Quran #Islam #Shorts');
      captionInput.value = captionLines.join('\n');
      captionCount.textContent = captionInput.value.length;
    }

    if (resolvedJobId){
      try {
        let url = `/api/status/${encodeURIComponent(resolvedJobId)}`;
        if (sessionId) url += `?sessionId=${encodeURIComponent(sessionId)}`;
        const res = await fetch(url);
        const json = await res.json();
        if (res.ok && json.status === 'done' && json.downloadUrl) initPreviewPlayer(json.downloadUrl);
      } catch (e) { /* preview thumb just stays empty (black) */ }
    }
  })();
</script>
